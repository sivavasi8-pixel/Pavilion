// A plain <select> with a blank first option, so the field stays optional
// exactly like the free-text input it replaces — nothing downstream reads
// these fields any differently based on how the value was entered.
function FieldSelect({ value, onChange, options, placeholder, style }) {
  return (
    <select value={value || ""} onChange={(e) => onChange(e.target.value)} style={style || inputStyle}>
      <option value="">{placeholder}</option>
      {options.map((opt) => <option key={opt} value={opt}>{opt}</option>)}
    </select>
  );
}

// Ground name is a dropdown of every ground this team has already used
// (derived from existing matches — no separate list to maintain) plus an
// "Add new" option that reveals a plain text box. Starts in text mode
// whenever there's nothing to pick from yet, or the current value isn't
// one of the known grounds (e.g. editing an older match whose ground was
// only ever used once).
function GroundNameField({ value, knownGrounds, onChange, onBlur }) {
  const [manual, setManual] = useState(knownGrounds.length === 0 || (!!value && !knownGrounds.includes(value)));
  if (manual) {
    return (
      <div>
        <input
          placeholder="Ground name"
          value={value}
          onChange={(e) => onChange(e.target.value)}
          onBlur={(e) => onBlur && onBlur(e.target.value.trim())}
          style={inputStyle}
        />
        {knownGrounds.length > 0 && (
          <button
            type="button"
            onClick={() => setManual(false)}
            style={{ background: "none", border: "none", padding: "4px 0 0", fontSize: 11, color: COLORS.leather, textDecoration: "underline", cursor: "pointer" }}
          >
            Choose from list instead
          </button>
        )}
      </div>
    );
  }
  return (
    <select
      value={knownGrounds.includes(value) ? value : ""}
      onChange={(e) => {
        if (e.target.value === "__new__") { setManual(true); onChange(""); return; }
        onChange(e.target.value);
        if (onBlur) onBlur(e.target.value);
      }}
      style={inputStyle}
    >
      <option value="">Ground name</option>
      {knownGrounds.map((g) => <option key={g} value={g}>{g}</option>)}
      <option value="__new__">+ Add new ground…</option>
    </select>
  );
}

// Native date picker by default, with a "Type it instead" toggle into
// three plain Day/Month/Year number fields — same toggle pattern as
// GroundNameField above. Exists because <input type="date"> is
// picker-only on some devices/browsers, with no reliable way to just
// type the date directly on all of them.
function DobField({ value, onChange, onBlur, maxDate, dark, compact }) {
  const [manual, setManual] = useState(false);
  const [day, setDay] = useState("");
  const [month, setMonth] = useState("");
  const [year, setYear] = useState("");
  const [localError, setLocalError] = useState("");

  const fieldStyle = {
    ...inputStyle,
    background: dark ? COLORS.pitch : "#fff",
    border: `1px solid ${dark ? COLORS.pitchLight : COLORS.line}`,
    color: dark ? "#fff" : COLORS.ink,
    padding: compact ? "6px 8px" : "10px 12px",
    fontSize: compact ? 12 : 13,
    textAlign: "center",
  };
  const linkStyle = {
    background: "none", border: "none", padding: "4px 0 0", fontSize: 11,
    color: dark ? COLORS.willow : COLORS.leather, textDecoration: "underline", cursor: "pointer",
  };

  function enterManual() {
    if (value) {
      const parts = value.split("-");
      if (parts.length === 3) {
        setYear(parts[0] || "");
        setMonth(parts[1] ? String(Number(parts[1])) : "");
        setDay(parts[2] ? String(Number(parts[2])) : "");
      }
    }
    setManual(true);
  }

  function commit(nextDay, nextMonth, nextYear) {
    setLocalError("");
    if (!nextDay || !nextMonth || nextYear.length < 4) return; // still typing — nothing to validate yet
    const d = Number(nextDay), m = Number(nextMonth), y = Number(nextYear);
    const dt = new Date(y, m - 1, d);
    const valid = dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
    if (!valid) { setLocalError("That's not a real date — check the day and month."); return; }
    const iso = `${String(y).padStart(4, "0")}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    onChange(iso);
    if (onBlur) onBlur(iso);
  }

  if (manual) {
    return (
      <div>
        <div style={{ display: "flex", gap: 8, marginBottom: 4 }}>
          <input
            placeholder="DD" inputMode="numeric" maxLength={2} value={day}
            onChange={(e) => { const v = e.target.value.replace(/\D/g, "").slice(0, 2); setDay(v); commit(v, month, year); }}
            style={{ ...fieldStyle, flex: 1 }}
          />
          <input
            placeholder="MM" inputMode="numeric" maxLength={2} value={month}
            onChange={(e) => { const v = e.target.value.replace(/\D/g, "").slice(0, 2); setMonth(v); commit(day, v, year); }}
            style={{ ...fieldStyle, flex: 1 }}
          />
          <input
            placeholder="YYYY" inputMode="numeric" maxLength={4} value={year}
            onChange={(e) => { const v = e.target.value.replace(/\D/g, "").slice(0, 4); setYear(v); commit(day, month, v); }}
            style={{ ...fieldStyle, flex: 1.6 }}
          />
        </div>
        {localError && <div style={{ fontSize: 10, color: dark ? "#F0A6A4" : COLORS.leather, marginBottom: 4 }}>{localError}</div>}
        <button type="button" onClick={() => setManual(false)} style={linkStyle}>
          Use date picker instead
        </button>
      </div>
    );
  }
  return (
    <div>
      <input
        type="date" value={value} max={maxDate}
        onChange={(e) => { onChange(e.target.value); if (onBlur) onBlur(e.target.value); }}
        style={fieldStyle}
      />
      <button type="button" onClick={enterManual} style={linkStyle}>
        Type it instead
      </button>
    </div>
  );
}

// The Gear Exchange tab — one feed, two post types (Sell/Want), shared
// between the admin and player sides via `isAdmin` rather than two
// separate near-identical components, since the feed itself is the same
// either way and only a couple of per-card actions actually differ.
function MarketplaceTab({ marketplace, photos, players, isAdmin, viewerId, teamName, onPost, onUpdate, onToggleInterest, onClose, onDelete, onViewPhoto }) {
  const [filter, setFilter] = useState("all"); // all | sell | want | mine
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState(EMPTY_LISTING_FORM);
  const [formError, setFormError] = useState("");
  const [posting, setPosting] = useState(false);
  const [expandedId, setExpandedId] = useState(null);
  // Set while editing an existing listing (its id) — null while posting a
  // brand-new one. Same form either way; this just decides whether
  // handleSubmit calls onPost or onUpdate.
  const [editingId, setEditingId] = useState(null);

  const allListings = Object.values(marketplace || {}).sort((a, b) => (b.postedAt || "").localeCompare(a.postedAt || ""));
  const listings = allListings.filter((l) => {
    const mine = isAdmin ? l.posterId === null : l.posterId === viewerId;
    if (filter === "mine") return mine;
    if (l.status !== "active") return false; // closed listings only ever show under "Mine"
    if (filter === "sell") return l.type === "sell";
    if (filter === "want") return l.type === "want";
    return true;
  });

  function updateForm(field, value) {
    setForm((prev) => ({ ...prev, [field]: value }));
  }
  function closeForm() {
    setShowForm(false);
    setEditingId(null);
    setForm(EMPTY_LISTING_FORM);
    setFormError("");
  }
  // Pre-fills the same form used to post a new listing, from the listing's
  // current fields and whichever photos it actually has (old single-photo
  // format or new multi-photo format — marketplacePhotoKeys hides that
  // difference already).
  function startEdit(listing) {
    const existingPhotos = marketplacePhotoKeys(listing).map((k) => photos[k]).filter(Boolean);
    setForm({
      type: listing.type, category: listing.category, title: listing.title, description: listing.description,
      condition: listing.condition || "", priceMin: listing.priceMin || "", priceMax: listing.priceMax || "",
      photos: existingPhotos,
    });
    setEditingId(listing.id);
    setFormError("");
    setShowForm(true);
  }
  async function handleSubmit() {
    setFormError("");
    if (!form.title.trim()) { setFormError("Give it a short title."); return; }
    if (!form.category) { setFormError("Pick a category."); return; }
    setPosting(true);
    if (editingId) await onUpdate(editingId, form);
    else await onPost(form);
    setPosting(false);
    closeForm();
  }

  const FILTERS = [["all", "All"], ["sell", "For Sale"], ["want", "Wanted"], ["mine", "Mine"]];

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, marginBottom: 14 }}>
        <div style={{ fontSize: 12.5, color: COLORS.inkSoft }}>Buy, sell, or ask around for cricket gear.</div>
        <button onClick={() => (showForm ? closeForm() : setShowForm(true))} style={{ flexShrink: 0, background: COLORS.willow, color: "#fff", border: "none", borderRadius: 8, padding: "8px 14px", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>
          {showForm ? "Cancel" : "+ Post"}
        </button>
      </div>

      {showForm && (
        <div style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: 16, marginBottom: 16 }}>
          {editingId && <div style={{ fontSize: 11, fontWeight: 700, color: COLORS.willow, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 10 }}>Editing listing</div>}
          <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
            <button
              onClick={() => updateForm("type", "sell")} className="chip"
              style={{ flex: 1, cursor: "pointer", borderRadius: 10, padding: "10px", fontSize: 13, fontWeight: 600, border: `1px solid ${form.type === "sell" ? COLORS.willow : COLORS.line}`, background: form.type === "sell" ? COLORS.willow : "transparent", color: form.type === "sell" ? "#fff" : COLORS.ink }}
            >
              🏏 Selling
            </button>
            <button
              onClick={() => updateForm("type", "want")} className="chip"
              style={{ flex: 1, cursor: "pointer", borderRadius: 10, padding: "10px", fontSize: 13, fontWeight: 600, border: `1px solid ${form.type === "want" ? COLORS.willow : COLORS.line}`, background: form.type === "want" ? COLORS.willow : "transparent", color: form.type === "want" ? "#fff" : COLORS.ink }}
            >
              🙋 Wanted
            </button>
          </div>
          <FieldSelect placeholder="Category" value={form.category} onChange={(v) => updateForm("category", v)} options={GEAR_CATEGORIES} style={{ ...inputStyle, marginBottom: 8 }} />
          <input placeholder="Title — e.g. SG Bat, English Willow" value={form.title} onChange={(e) => updateForm("title", e.target.value)} onBlur={(e) => updateForm("title", e.target.value.trim())} style={{ ...inputStyle, marginBottom: 8 }} />
          <textarea
            placeholder="Details (optional)" value={form.description} onChange={(e) => updateForm("description", e.target.value)}
            style={{ ...inputStyle, marginBottom: 8, minHeight: 60, resize: "vertical", fontFamily: "inherit" }}
          />
          {form.type === "sell" && (
            <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
              <button
                onClick={() => updateForm("condition", "New")} className="chip"
                style={{ flex: 1, cursor: "pointer", borderRadius: 8, padding: "8px", fontSize: 12.5, fontWeight: 600, border: `1px solid ${form.condition === "New" ? COLORS.willow : COLORS.line}`, background: form.condition === "New" ? "#E4C79A" : "transparent", color: COLORS.ink }}
              >
                New
              </button>
              <button
                onClick={() => updateForm("condition", "Used")} className="chip"
                style={{ flex: 1, cursor: "pointer", borderRadius: 8, padding: "8px", fontSize: 12.5, fontWeight: 600, border: `1px solid ${form.condition === "Used" ? COLORS.willow : COLORS.line}`, background: form.condition === "Used" ? "#E4C79A" : "transparent", color: COLORS.ink }}
              >
                Used
              </button>
            </div>
          )}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 10 }}>
            <input
              placeholder={form.type === "want" ? "Budget min" : "Price min"} inputMode="decimal" value={form.priceMin}
              onChange={(e) => updateForm("priceMin", sanitizeDecimalInput(e.target.value))} style={inputStyle}
            />
            <input
              placeholder={form.type === "want" ? "Budget max" : "Price max"} inputMode="decimal" value={form.priceMax}
              onChange={(e) => updateForm("priceMax", sanitizeDecimalInput(e.target.value))} style={inputStyle}
            />
          </div>
          <div style={{ display: "flex", gap: 8, marginBottom: 6, flexWrap: "wrap" }}>
            {form.photos.map((dataUrl, i) => (
              <div key={i} style={{ width: 56, height: 56, borderRadius: 8, overflow: "hidden", position: "relative", flexShrink: 0 }}>
                <img src={dataUrl} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                <button
                  onClick={() => updateForm("photos", form.photos.filter((_, idx) => idx !== i))}
                  style={{ position: "absolute", top: 2, right: 2, width: 16, height: 16, borderRadius: "50%", background: "rgba(0,0,0,0.6)", color: "#fff", border: "none", fontSize: 9, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", padding: 0 }}
                >
                  ✕
                </button>
              </div>
            ))}
            {form.photos.length < MARKETPLACE_MAX_PHOTOS && (
              <PlainImageUpload maxDim={800} quality={0.78} onUpload={(dataUrl) => updateForm("photos", [...form.photos, dataUrl])}>
                {(busy) => (
                  <div style={{ width: 56, height: 56, borderRadius: 8, border: `1.5px dashed ${COLORS.line}`, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", fontSize: 18, color: COLORS.inkSoft, flexShrink: 0 }}>
                    {busy ? "…" : "+"}
                  </div>
                )}
              </PlainImageUpload>
            )}
          </div>
          <div style={{ fontSize: 10.5, color: COLORS.inkSoft, marginBottom: 10 }}>{form.photos.length} of {MARKETPLACE_MAX_PHOTOS} photos (optional)</div>
          {formError && <div style={{ background: "#FCEBEA", color: COLORS.leather, borderRadius: 8, padding: "8px 12px", fontSize: 11.5, marginBottom: 8 }}>{formError}</div>}
          <button onClick={handleSubmit} disabled={posting} style={{ width: "100%", background: COLORS.pitch, color: "#fff", border: "none", borderRadius: 8, padding: "10px", fontSize: 13, fontWeight: 600, cursor: posting ? "default" : "pointer", opacity: posting ? 0.7 : 1 }}>
            {posting ? "Saving…" : editingId ? "Save changes" : "Post"}
          </button>
        </div>
      )}

      <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>
        {FILTERS.map(([key, label]) => (
          <button
            key={key} onClick={() => setFilter(key)}
            style={{ fontSize: 11.5, fontWeight: 600, padding: "6px 13px", borderRadius: 20, border: "none", cursor: "pointer", background: filter === key ? COLORS.willow : "#EEEAD9", color: filter === key ? "#fff" : COLORS.inkSoft }}
          >
            {label}
          </button>
        ))}
      </div>

      {listings.length === 0 ? (
        <div style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: 24, textAlign: "center" }}>
          <div style={{ fontSize: 28, marginBottom: 8 }}>🏏</div>
          <div style={{ fontSize: 13, color: COLORS.inkSoft }}>{filter === "mine" ? "You haven't posted anything yet." : "Nothing posted yet — be the first."}</div>
