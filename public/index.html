              onToggleInterest={onToggleInterest} onClose={onClose} onDelete={onDelete} onEdit={startEdit} onViewPhoto={onViewPhoto}
            />
          ))}
        </div>
      )}
    </div>
  );
}

function MarketplaceListingCard({ listing, photoList, players, photos, teamName, isAdmin, viewerId, expanded, onToggleExpand, onToggleInterest, onClose, onDelete, onEdit, onViewPhoto }) {
  const [copied, setCopied] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const posterName = marketplacePosterName(listing, players, teamName);
  const priceRange = fmtMarketplacePriceRange(listing.priceMin, listing.priceMax);
  const isMine = isAdmin ? listing.posterId === null : listing.posterId === viewerId;
  const iAmInterested = !isAdmin && (listing.interested || []).includes(viewerId);
  const interestedPlayers = (listing.interested || []).map((id) => players.find((p) => p.id === id)).filter(Boolean);
  const canDelete = isAdmin || isMine;
  const coverPhoto = photoList[0];

  async function handleCopy() {
    const ok = await copyText(buildMarketplaceMessage(listing, players, teamName));
    setCopied(ok);
    if (ok) setTimeout(() => setCopied(false), 2000);
  }

  return (
    <div style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 12, overflow: "hidden", opacity: listing.status === "closed" ? 0.65 : 1 }}>
      <button onClick={onToggleExpand} style={{ width: "100%", textAlign: "left", background: "transparent", border: "none", cursor: "pointer", padding: 14, display: "flex", gap: 10 }}>
        <div style={{ width: 44, height: 44, borderRadius: 8, overflow: "hidden", flexShrink: 0, background: "#E4C79A", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20 }}>
          {coverPhoto ? <img src={coverPhoto} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : (GEAR_CATEGORY_ICON[listing.category] || "📦")}
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: "flex", justifyContent: "space-between", gap: 8 }}>
            <span style={{ fontSize: 13.5, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{listing.title}</span>
            {priceRange && <span className="mono" style={{ fontSize: 12, fontWeight: 700, color: "#3B7A3E", flexShrink: 0 }}>{priceRange}</span>}
          </div>
          <div style={{ fontSize: 11, color: COLORS.inkSoft, marginTop: 2 }}>{posterName} · {fmtAgo(listing.postedAt)}</div>
          <div style={{ display: "flex", gap: 5, marginTop: 6, flexWrap: "wrap" }}>
            <span style={{ fontSize: 9.5, fontWeight: 700, padding: "2px 8px", borderRadius: 20, textTransform: "uppercase", background: listing.type === "want" ? "#F6E9D2" : "#EAF3E4", color: listing.type === "want" ? "#8A5A17" : "#3B6D11" }}>
              {listing.type === "want" ? "Wanted" : "For sale"}
            </span>
            {listing.condition && <span style={{ fontSize: 9.5, fontWeight: 700, padding: "2px 8px", borderRadius: 20, textTransform: "uppercase", background: "#EEEAD9", color: COLORS.inkSoft }}>{listing.condition}</span>}
            {listing.status === "closed" && <span style={{ fontSize: 9.5, fontWeight: 700, padding: "2px 8px", borderRadius: 20, textTransform: "uppercase", background: "#F5E1DC", color: "#9A3634" }}>Closed</span>}
          </div>
        </div>
      </button>

      {expanded && (
        <div style={{ padding: "0 14px 14px" }}>
          {listing.description && <div style={{ fontSize: 12.5, color: COLORS.ink, marginBottom: 10, whiteSpace: "pre-wrap" }}>{listing.description}</div>}
          {photoList.length > 0 && (
            <div style={{ display: "flex", gap: 8, overflowX: "auto", marginBottom: 10, paddingBottom: 2 }}>
              {photoList.map((p, i) => (
                <img
                  key={i} src={p} alt={listing.title} onClick={() => onViewPhoto(listing.title, p, true)}
                  style={{ width: photoList.length > 1 ? 140 : "100%", maxHeight: 200, height: 200, objectFit: "cover", borderRadius: 10, cursor: "pointer", flexShrink: 0 }}
                />
              ))}
            </div>
          )}

          {interestedPlayers.length > 0 && (
            <div style={{ marginBottom: 10 }}>
              <div style={{ fontSize: 11, fontWeight: 600, color: COLORS.inkSoft, marginBottom: 6 }}>🙋 Interested ({interestedPlayers.length})</div>
              <AvatarStack people={interestedPlayers} currentPlayerId={viewerId} photos={photos} onViewPhoto={onViewPhoto} />
            </div>
          )}

          <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <button onClick={handleCopy} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 5, background: "transparent", border: `1px solid ${COLORS.line}`, borderRadius: 8, padding: "8px", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
              {copied ? "✅ Copied!" : "📋 Copy"}
            </button>
            <WhatsAppShareLink text={buildMarketplaceMessage(listing, players, teamName)} style={{ flex: 1, padding: "8px" }}>
              💬 Share
            </WhatsAppShareLink>
          </div>

          {!isAdmin && listing.status === "active" && !isMine && (
            <button
              onClick={() => onToggleInterest(listing.id, viewerId)}
              style={{
                width: "100%", cursor: "pointer", borderRadius: 8, padding: "9px", fontSize: 12.5, fontWeight: 600,
                border: `1px solid ${iAmInterested ? "#3B7A3E" : COLORS.willow}`,
                background: iAmInterested ? "#3B7A3E" : "transparent", color: iAmInterested ? "#fff" : COLORS.willow,
              }}
            >
              {iAmInterested ? "✓ You're interested" : "🙋 I'm interested"}
            </button>
          )}

          {isMine && listing.status === "active" && (
            <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
              <button
                onClick={() => onEdit(listing)}
                style={{ flex: 1, cursor: "pointer", borderRadius: 8, padding: "9px", fontSize: 12.5, fontWeight: 600, border: `1px solid ${COLORS.willow}`, background: "transparent", color: COLORS.willow }}
              >
                ✏️ Edit
              </button>
              <button
                onClick={() => onClose(listing.id)}
                style={{ flex: 1, cursor: "pointer", borderRadius: 8, padding: "9px", fontSize: 12.5, fontWeight: 600, border: `1px solid ${COLORS.line}`, background: "transparent", color: COLORS.inkSoft }}
              >
                Mark as {listing.type === "want" ? "Found" : "Sold"}
              </button>
            </div>
          )}

          {canDelete && (
            confirmDelete ? (
              <div style={{ background: "#FCEBEA", borderRadius: 8, padding: 10, marginTop: 8 }}>
                <div style={{ fontSize: 12, color: COLORS.leather, marginBottom: 8 }}>Delete this listing? This can't be undone.</div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button onClick={() => setConfirmDelete(false)} style={{ flex: 1, background: "transparent", border: `1px solid ${COLORS.line}`, borderRadius: 6, padding: "8px", fontSize: 12, cursor: "pointer" }}>Cancel</button>
                  <button onClick={() => onDelete(listing.id)} style={{ flex: 1, background: COLORS.leather, color: "#fff", border: "none", borderRadius: 6, padding: "8px", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>Delete</button>
                </div>
              </div>
            ) : (
              <button
                onClick={() => setConfirmDelete(true)}
                style={{ width: "100%", marginTop: 8, cursor: "pointer", borderRadius: 8, padding: "9px", fontSize: 12.5, fontWeight: 600, border: `1px solid ${COLORS.leather}`, background: "transparent", color: COLORS.leather }}
              >
                🗑️ Delete listing
              </button>
            )
          )}
        </div>
      )}
    </div>
  );
}

const EMPTY_MATCH_FORM = { matchType: "", groundName: "", date: "", time: "", overs: "", ballType: "", jersey: "", locationUrl: "", capacity: "", upiNumber: "", paymentQr: null, banner: null };

function MatchesAdminTab({ players, photos, onViewPhoto, matches, addMatch, updateMatchField, toggleMatchAvailable, toggleMatchNotAvailable, togglePlayed, toggleMatchPaid, deleteMatch, updateMatchCapacity, adminAddAvailable, adminAddNotAvailable, promoteFromWaitlist, addGuestPlayer, paymentDefault, uploadMatchBanner, removeMatchBanner, uploadMatchQr, removeMatchQr, setMatchPerformerField, clearMatchPerformer, onMatchLiveStarted, onMatchLiveStopped, teamName }) {
  const [showNewForm, setShowNewForm] = useState(false);
  const [expandedId, setExpandedId] = useState(null);
  const [form, setForm] = useState(EMPTY_MATCH_FORM);
  // Set only by duplicateMatch below — the source match to copy the
  // total fee from once the new one's actually created (totalCost isn't a
  // field on this form at all; it's applied straight onto the new match
  // afterward, the same way the banner/QR photos already are).
  const [duplicatingFrom, setDuplicatingFrom] = useState(null);

  const matchList = Object.values(matches || {}).sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  // Every ground this team has ever used, derived from its own match data
  // — a new ground typed into any match becomes available here for the
  // next one without any separate list to maintain.
  const knownGrounds = useMemo(
    () => Array.from(new Set(Object.values(matches || {}).map((m) => m.groundName).filter(Boolean))).sort(),
    [matches]
  );
  // The first location URL ever saved for each ground, keyed by ground
  // name — "first" meaning creation order (the timestamp embedded in each
  // match's own id), not scheduled match date, since that's the true order
  // the admin actually typed things in. Once a ground has one, it's what
  // auto-fills going forward; a later edit to one match's own location is
  // just a one-off override for that match; it doesn't update this map.
  const knownGroundLocations = useMemo(() => {
    const withLocation = Object.values(matches || {})
      .filter((m) => m.groundName && m.locationUrl)
      .sort((a, b) => (Number((a.id || "").split("_")[1]) || 0) - (Number((b.id || "").split("_")[1]) || 0));
    const map = {};
    withLocation.forEach((m) => { if (!map[m.groundName]) map[m.groundName] = m.locationUrl; });
    return map;
  }, [matches]);

  // Carries the team's default UPI/QR (set in Settings) into every new
  // match automatically — admin can still edit either field for just this
  // one match afterward, same as any other match field.
  function openNewForm() {
    setForm({ ...EMPTY_MATCH_FORM, upiNumber: paymentDefault.upiNumber || "", paymentQr: paymentDefault.qr || null });
    setDuplicatingFrom(null);
    setShowNewForm(true);
  }
  // Called from a specific match's own Settings tab ("Duplicate this
  // match") rather than always guessing "the most recent one" — the admin
  // picks which match to reuse as the template. Everything about who's
  // playing, paid, or performing never carries over — a new match always
  // starts with none of that regardless of how it was created; only the
  // setup fields below do.
  function duplicateMatch(source) {
    if (!source) return;
    const ownQr = source.hasPaymentQr ? photos[matchQrKey(source.id)] : null;
    setForm({
      ...EMPTY_MATCH_FORM,
      matchType: source.matchType || "",
      groundName: source.groundName || "",
      time: source.time || "",
      overs: source.overs || "",
      ballType: source.ballType || "",
      jersey: source.jersey || "",
      locationUrl: source.locationUrl || "",
      capacity: source.capacity ? String(source.capacity) : "",
      upiNumber: source.upiNumber || paymentDefault.upiNumber || "",
      paymentQr: ownQr || paymentDefault.qr || null,
      // date and banner deliberately stay blank — see the plan this came from.
    });
    setDuplicatingFrom(source);
    setShowNewForm(true);
    // The New Match form always renders at the top of this tab — scrolling
    // there is what actually surfaces it, since the button that triggered
    // this can be deep inside one match's own expanded Settings tab,
    // scrolled well below where the form appears.
    if (typeof window !== "undefined") window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function handleCreate() {
    if (!form.groundName.trim()) return;
    // Trim every free-text field here — a trailing space typed by mistake
    // (very easy on a phone keyboard) used to get saved as-is and then
    // show up as a stray gap or double-space anywhere the field was used,
    // including WhatsApp messages built from it.
    const cleaned = {
      ...form,
      matchType: form.matchType.trim(),
      groundName: form.groundName.trim(),
      time: form.time.trim(),
      overs: form.overs.trim(),
      ballType: form.ballType.trim(),
      jersey: form.jersey.trim(),
      locationUrl: form.locationUrl.trim(),
      upiNumber: form.upiNumber.trim(),
    };
    const id = addMatch(cleaned);
    // Images go to their own documents once the match (and its id) exists
    // — addMatch itself no longer accepts them inline, since that's the
    // exact thing that let a shared matches document grow past its write
    // cap. Fire-and-forget is fine here: the New Match form has already
    // closed, and the backfill effect picks up the flag either way.
    if (cleaned.banner) uploadMatchBanner(id, cleaned.banner);
    if (cleaned.paymentQr) uploadMatchQr(id, cleaned.paymentQr);
    // The one field duplicateMatch carries over that isn't part of this
    // form at all — applied directly onto the freshly created match.
    if (duplicatingFrom && duplicatingFrom.totalCost) updateMatchField(id, "totalCost", duplicatingFrom.totalCost);
    setForm(EMPTY_MATCH_FORM);
    setDuplicatingFrom(null);
    setShowNewForm(false);
    setExpandedId(id);
  }

  return (
    <div>
      <div style={{ fontSize: 11, letterSpacing: 1, textTransform: "uppercase", color: COLORS.inkSoft, marginBottom: 4 }}>Weekend matches</div>
      <div style={{ fontSize: 13, color: COLORS.inkSoft, marginBottom: 16 }}>
        Separate from nets — one-off match fees, availability, and payment tracking.
      </div>

      {!showNewForm ? (
        <button onClick={openNewForm} style={{ width: "100%", background: COLORS.leather, color: "#fff", border: "none", borderRadius: 10, padding: "12px", fontSize: 13, fontWeight: 600, cursor: "pointer", marginBottom: 18, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
          <Icon size={15}>+</Icon> New match
        </button>
      ) : (
        <div style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: 16, marginBottom: 18 }}>
          <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 12 }}>{duplicatingFrom ? "New match (duplicated)" : "New match"}</div>
          {duplicatingFrom && (
            <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 10.5, color: "#3B6D11", background: "#EAF3E4", borderRadius: 8, padding: "6px 10px", marginBottom: 10 }}>
              <Icon size={11}>✓</Icon> Filled in from {cleanField(duplicatingFrom.groundName, "your last match")} — just pick a new date below.
            </div>
          )}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
            <FieldSelect placeholder="Match type" value={form.matchType} onChange={(v) => setForm({ ...form, matchType: v })} options={MATCH_TYPE_OPTIONS} />
            <GroundNameField
              value={form.groundName} knownGrounds={knownGrounds}
              onChange={(v) => setForm((f) => ({ ...f, groundName: v, locationUrl: knownGroundLocations[v] || f.locationUrl }))}
            />
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
            <input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} style={inputStyle} />
            <input type="time" value={form.time} onChange={(e) => setForm({ ...form, time: e.target.value })} style={inputStyle} />
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
            <FieldSelect placeholder="Overs" value={form.overs} onChange={(v) => setForm({ ...form, overs: v })} options={OVERS_OPTIONS} />
            <FieldSelect placeholder="Ball" value={form.ballType} onChange={(v) => setForm({ ...form, ballType: v })} options={BALL_TYPE_OPTIONS} />
          </div>
          <div style={{ marginBottom: 8 }}>
            <FieldSelect placeholder="Jersey / dress code" value={form.jersey} onChange={(v) => setForm({ ...form, jersey: v })} options={JERSEY_OPTIONS} />
          </div>
          <input placeholder="Location (Google Maps link)" value={form.locationUrl} onChange={(e) => setForm({ ...form, locationUrl: e.target.value })} style={{ ...inputStyle, marginBottom: 8 }} />
          <input
            type="number" min="0" placeholder="Max players (optional — leave blank for no limit)"
            value={form.capacity}
            onChange={(e) => setForm({ ...form, capacity: e.target.value })}
            style={{ ...inputStyle, marginBottom: 12 }}
          />

          <div style={{ fontSize: 11, color: COLORS.inkSoft, marginBottom: 6 }}>Match banner (optional) — shown to players above the match details</div>
          <MatchBannerUpload banner={form.banner} onUpload={(dataUrl) => setForm({ ...form, banner: dataUrl })} onRemove={() => setForm({ ...form, banner: null })} style={{ marginBottom: 14 }} />

          {(paymentDefault.upiNumber || paymentDefault.qr) && (
            <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 10.5, color: "#3B6D11", background: "#EAF3E4", borderRadius: 8, padding: "6px 10px", marginBottom: 8 }}>
              <Icon size={11}>✓</Icon> Carried forward from your team's default payment details
            </div>
          )}
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
            <PlainImageUpload
              maxDim={640} quality={0.92} onUpload={(dataUrl) => setForm({ ...form, paymentQr: dataUrl })}
              crop cropTitle="Position your QR code" cropConfirmLabel="Use this QR code"
              cropInstructions="Drag so just the QR code sits inside the frame — crop out any surrounding app screenshot."
            >
              {(busy) => (
                <div style={{
                  width: 44, height: 44, borderRadius: 8, overflow: "hidden", flexShrink: 0, cursor: "pointer",
                  background: "#fff", border: `1px solid ${COLORS.line}`, display: "flex", alignItems: "center", justifyContent: "center",
                }}>
                  {busy ? <Icon size={12} color={COLORS.inkSoft}>…</Icon> : form.paymentQr ? (
                    <img src={form.paymentQr} alt="" style={{ width: "100%", height: "100%", objectFit: "contain" }} />
                  ) : <Icon size={16} color={COLORS.inkSoft}>📷</Icon>}
                </div>
              )}
            </PlainImageUpload>
            <input placeholder="UPI / phone number for payment" value={form.upiNumber} onChange={(e) => setForm({ ...form, upiNumber: e.target.value })} style={{ ...inputStyle, flex: 1 }} />
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={() => { setShowNewForm(false); setDuplicatingFrom(null); }} style={{ flex: 1, background: "transparent", border: `1px solid ${COLORS.line}`, borderRadius: 8, padding: "10px", fontSize: 13, cursor: "pointer" }}>Cancel</button>
            <button onClick={handleCreate} style={{ flex: 1, background: COLORS.willow, color: "#fff", border: "none", borderRadius: 8, padding: "10px", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Create match</button>
          </div>
        </div>
      )}

      {matchList.length === 0 ? (
        <div style={{ fontSize: 13, color: COLORS.inkSoft }}>No matches yet — create one above when a weekend game comes up.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {matchList.map((m) => (
            <MatchCard
              key={m.id} match={m} players={players} photos={photos} onViewPhoto={onViewPhoto}
              expanded={expandedId === m.id}
              onToggleExpand={() => setExpandedId(expandedId === m.id ? null : m.id)}
              updateMatchField={updateMatchField} toggleMatchAvailable={toggleMatchAvailable} toggleMatchNotAvailable={toggleMatchNotAvailable}
              togglePlayed={togglePlayed} toggleMatchPaid={toggleMatchPaid} deleteMatch={deleteMatch}
              updateMatchCapacity={updateMatchCapacity} adminAddAvailable={adminAddAvailable} adminAddNotAvailable={adminAddNotAvailable}
              promoteFromWaitlist={promoteFromWaitlist} addGuestPlayer={addGuestPlayer}
              paymentDefault={paymentDefault} knownGrounds={knownGrounds} knownGroundLocations={knownGroundLocations}
              uploadMatchBanner={uploadMatchBanner} removeMatchBanner={removeMatchBanner}
              uploadMatchQr={uploadMatchQr} removeMatchQr={removeMatchQr}
              setMatchPerformerField={setMatchPerformerField} clearMatchPerformer={clearMatchPerformer}
              onDuplicate={duplicateMatch}
              onMatchLiveStarted={onMatchLiveStarted} onMatchLiveStopped={onMatchLiveStopped}
              teamName={teamName}
            />
          ))}
        </div>
      )}
    </div>
  );
}

function MatchCard({ match, players, photos, onViewPhoto, expanded, onToggleExpand, updateMatchField, toggleMatchAvailable, toggleMatchNotAvailable, togglePlayed, toggleMatchPaid, deleteMatch, updateMatchCapacity, adminAddAvailable, adminAddNotAvailable, promoteFromWaitlist, addGuestPlayer, paymentDefault, knownGrounds, knownGroundLocations, uploadMatchBanner, removeMatchBanner, uploadMatchQr, removeMatchQr, setMatchPerformerField, clearMatchPerformer, onDuplicate, onMatchLiveStarted, onMatchLiveStopped, teamName }) {
  const [copiedPerformers, setCopiedPerformers] = useState(false);
  async function handleCopyPerformers() {
    const ok = await copyText(buildMatchPerformersMessage(match, players, teamName));
    setCopiedPerformers(ok);
    if (ok) setTimeout(() => setCopiedPerformers(false), 2000);
  }
  const [copiedCarpool, setCopiedCarpool] = useState(false);
  async function handleCopyCarpool() {
    const ok = await copyText(buildCarpoolMessage(match, players, teamName));
    setCopiedCarpool(ok);
    if (ok) setTimeout(() => setCopiedCarpool(false), 2000);
  }
  const [copiedAvail, setCopiedAvail] = useState(false);
  const [copiedPay, setCopiedPay] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [showAddAvailable, setShowAddAvailable] = useState(false);
  const [addSearchQuery, setAddSearchQuery] = useState("");
  // Which list the "add someone verbally" panel below adds into — kept
  // separate from the panel's open/closed state so switching between
  // Available and Not Available doesn't reset the search someone's mid-typing.
  const [addMode, setAddMode] = useState("available"); // available | notAvailable
  const [guestError, setGuestError] = useState("");
  const [availableExpanded, setAvailableExpanded] = useState(false);
  const [notAvailableExpanded, setNotAvailableExpanded] = useState(false);
  const [playedExpanded, setPlayedExpanded] = useState(false);
  const [paidExpanded, setPaidExpanded] = useState(false);
  const [viewingProofOf, setViewingProofOf] = useState(null); // player id | null
  const [sharePayBusy, setSharePayBusy] = useState(false);
  const [activeTab, setActiveTab] = useState("squad");
  const [showLiveModal, setShowLiveModal] = useState(false);
  const PREVIEW_ROWS = 5;

  // .map() over the ids — not players.filter() — because match.available
  // is itself already in vote order (built from a Set, which keeps
  // insertion order): first player to vote is first in the array.
  // filter() would silently discard that and fall back to roster order.
  const availableIds = match.available || [];
  const availablePlayers = availableIds.map((id) => players.find((p) => p.id === id)).filter(Boolean);
  const notAvailableIds = match.notAvailable || [];
  const notAvailablePlayers = notAvailableIds.map((id) => players.find((p) => p.id === id)).filter(Boolean);
  // .map() over the ids, not players.filter() — same reasoning as
  // availablePlayers above: waitlist is already in join order.
  const waitlistIds = match.waitlist || [];
  const waitlistPlayers = waitlistIds.map((id) => players.find((p) => p.id === id)).filter(Boolean);
  const playedIds = computePlayedIds(match);
  const playedPlayers = playedIds.map((id) => players.find((p) => p.id === id)).filter(Boolean);
  const perPlayerFee = match.totalCost && playedPlayers.length ? Number(match.totalCost) / playedPlayers.length : 0;
  const paidCount = playedPlayers.filter((p) => (match.payments || {})[p.id]).length;
  const allPaid = playedPlayers.length > 0 && paidCount === playedPlayers.length;
  // Without a total cost (or nobody marked as played yet) perPlayerFee is
  // 0 — sending a "please pay ₹0" reminder is a real message the app used
  // to let through, not a hypothetical.
  const feeNotSet = !match.totalCost || Number(match.totalCost) <= 0 || playedPlayers.length === 0;
  const matchOwnQr = match.hasPaymentQr ? photos[matchQrKey(match.id)] : null;
  const effectiveQr = matchOwnQr || paymentDefault.qr;
  const matchBanner = match.hasBanner ? photos[matchBannerKey(match.id)] : null;
  const viewingProofPlayer = viewingProofOf ? players.find((p) => p.id === viewingProofOf) : null;
  const viewingProofPhoto = viewingProofOf ? photos[matchProofKey(match.id, viewingProofOf)] : null;
  const performers = match.performers || {};
  const filledPerformerCount = PERFORMER_CATEGORIES.filter((c) => performers[c.key] && performers[c.key].playerId).length;

  async function handleCopyAvail() {
    const ok = await copyText(buildMatchAvailabilityMessage(match, players));
    setCopiedAvail(ok);
    if (ok) setTimeout(() => setCopiedAvail(false), 2000);
  }
  async function handleCopyPay() {
    const ok = await copyText(buildMatchPaymentMessage(match, players, paymentDefault));
    setCopiedPay(ok);
    if (ok) setTimeout(() => setCopiedPay(false), 2000);
  }
  // Same button as the plain-text share everywhere else, just smarter
  // here specifically: when there's a QR to attach and the device
  // actually supports sharing a real file, this carries the message text
  // and the QR image together through the phone's own native share sheet
  // — the one place that can, since WhatsApp's own share link never can.
  // Falls straight back to the ordinary text-only WhatsApp link otherwise
  // (no QR set, desktop browser, or a share attempt that fails) — never a
  // dead end.
  async function handleSharePay() {
    const payCardUrl = buildPayCardUrl(match);
    const text = buildMatchPaymentMessage(match, players, paymentDefault, payCardUrl);
    if (effectiveQr && isMobileDevice() && navigator.share) {
      setSharePayBusy(true);
      try {
        const file = await dataUrlToFile(effectiveQr, "payment-qr.png");
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ text, files: [file] });
          setSharePayBusy(false);
          return;
        }
      } catch (e) {
        // A cancelled share sheet lands here too (AbortError) — not a
        // real failure, just fall through to the text-only link below.
      }
      setSharePayBusy(false);
    }
    window.open(buildWhatsAppShareUrl(text), "_blank");
  }

  return (
    <>
    <div style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 12, overflow: "hidden" }}>
      <div style={{ padding: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
          <div onClick={onToggleExpand} style={{ cursor: "pointer", minWidth: 0, flex: 1 }}>
            <div style={{ fontSize: 14, fontWeight: 600 }}>{match.matchType || "Match"} · {match.groundName || "Ground TBD"}</div>
            <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 2 }}>
              {match.date ? `${dayOfWeekName(match.date)}, ${fmtMatchDate(match.date)}` : "No date set"}{match.time ? ` · ${formatTimeDisplay(match.time)}` : ""}
            </div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 5, flexShrink: 0 }}>
            {onDuplicate && (
              <button
                onClick={() => onDuplicate(match)}
                title="Duplicate this match — opens a new match form pre-filled with its details"
                style={{ width: 28, height: 28, borderRadius: 8, border: `1px solid ${COLORS.willow}`, background: "transparent", color: COLORS.willow, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, padding: 0 }}
              >
                ⎘
              </button>
            )}
            <button
              onClick={() => setConfirmDelete(true)}
              title="Delete this match"
              style={{ width: 28, height: 28, borderRadius: 8, border: `1px solid ${COLORS.leather}`, background: "transparent", color: COLORS.leather, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, padding: 0 }}
            >
              🗑️
            </button>
            <button onClick={onToggleExpand} style={{ background: "transparent", border: "none", cursor: "pointer", padding: 4, display: "flex" }}>
              <Icon size={16} color={COLORS.inkSoft}>{expanded ? "←" : "→"}</Icon>
            </button>
          </div>
        </div>
        <div onClick={onToggleExpand} style={{ cursor: "pointer", display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
          {match.liveMeetingId && (
            <span style={{ fontSize: 11, fontWeight: 700, background: "#D62828", color: "#fff", padding: "3px 9px", borderRadius: 20, display: "flex", alignItems: "center", gap: 4 }}>
              🔴 LIVE
            </span>
          )}
          <span style={{ fontSize: 11, background: "#EEEAD9", color: COLORS.inkSoft, padding: "3px 9px", borderRadius: 20 }}>{availablePlayers.length} available</span>
          {match.totalCost && (
            <span style={{ fontSize: 11, background: allPaid ? "#EAF3E4" : "#FAEEDA", color: allPaid ? "#3B6D11" : "#854F0B", padding: "3px 9px", borderRadius: 20 }}>
              {paidCount} of {playedPlayers.length} paid
            </span>
          )}
        </div>
      </div>

      {confirmDelete && (
        <div style={{ margin: "0 16px 16px", background: "#FCEBEA", borderRadius: 8, padding: 10 }}>
          <div style={{ fontSize: 12, color: COLORS.leather, marginBottom: 8 }}>Delete this match and all its data? This can't be undone.</div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={() => setConfirmDelete(false)} style={{ flex: 1, background: "transparent", border: `1px solid ${COLORS.line}`, borderRadius: 6, padding: "8px", fontSize: 12, cursor: "pointer" }}>Cancel</button>
            <button onClick={() => deleteMatch(match.id)} style={{ flex: 1, background: COLORS.leather, color: "#fff", border: "none", borderRadius: 6, padding: "8px", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>Delete</button>
          </div>
        </div>
      )}

      {expanded && (
        <div style={{ padding: "0 16px 16px" }}>
          {match.liveMeetingId ? (
            <div style={{ marginBottom: 14 }}>
              <LiveViewer meetingId={match.liveMeetingId} />
              <button
                onClick={() => onMatchLiveStopped && onMatchLiveStopped(match.id)}
                style={{ width: "100%", background: "transparent", border: `1px solid ${COLORS.leather}`, color: COLORS.leather, borderRadius: 8, padding: "9px", fontSize: 12, fontWeight: 600, cursor: "pointer" }}
              >
                ⏹ End live broadcast
              </button>
            </div>
          ) : (
            onMatchLiveStarted && (
              <button
                onClick={() => setShowLiveModal(true)}
                style={{ width: "100%", background: "#D62828", color: "#fff", border: "none", borderRadius: 10, padding: "12px", fontSize: 13, fontWeight: 700, cursor: "pointer", marginBottom: 14, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}
              >
                🔴 Go Live
              </button>
            )
          )}
          <MatchTabBar tabs={ADMIN_MATCH_TABS} active={activeTab} onChange={setActiveTab}>
            {activeTab === "squad" && (
              <>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                  <span style={{ fontSize: 12, fontWeight: 600, color: COLORS.inkSoft }}>Available (before match)</span>
                  <span style={{
                    fontSize: 10, fontWeight: 700, padding: "2px 9px", borderRadius: 20,
                    background: match.capacity && availablePlayers.length >= match.capacity ? "#F6E9D2" : "#EEEAD9",
                    color: match.capacity && availablePlayers.length >= match.capacity ? "#8A5A17" : COLORS.inkSoft,
                  }}>
                    {match.capacity ? `${availablePlayers.length} / ${match.capacity} confirmed` : `${availablePlayers.length} confirmed`}
                  </span>
                </div>
                <div style={{ fontSize: 10.5, color: COLORS.inkSoft, marginBottom: 8 }}>Filled in automatically as players confirm from their own account.</div>
                {availablePlayers.length === 0 ? (
                  <div style={{ fontSize: 12, color: COLORS.inkSoft, marginBottom: 8 }}>No one's confirmed yet — waiting on player votes, or add someone below.</div>
                ) : (() => {
                  const shownAvailable = availableExpanded ? availablePlayers : availablePlayers.slice(0, PREVIEW_ROWS);
                  const overflow = availablePlayers.length - PREVIEW_ROWS;
                  return (
                    <div style={{ marginBottom: 8 }}>
                      <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                        {shownAvailable.map((p) => (
                          <span key={p.id} style={{
                            borderRadius: 20, padding: "4px 4px 4px 4px", fontSize: 12,
                            border: "1px solid #B9D9A6", background: "#EAF3E4", color: "#3B6D11",
                            display: "flex", alignItems: "center", gap: 6,
                          }}>
                            <PlayerAvatar name={p.name} photo={photos && photos[p.id]} size={20} border={false} onView={photos && photos[p.id] && onViewPhoto ? () => onViewPhoto(p.name, photos[p.id]) : undefined} />
                            {p.name}
                            {/* Reuses the player's own toggle — the branch that fires when
                                they're already in Available only ever removes them (frees a
                                waitlist spot, clears carpool) and never fires the "voted"
                                broadcast, so an admin cleanup here can't look like a real vote. */}
                            <button
                              onClick={() => toggleMatchAvailable(match.id, p.id)}
                              title={`Remove ${p.name} from Available`}
                              style={{ width: 16, height: 16, borderRadius: "50%", background: "rgba(0,0,0,0.12)", border: "none", color: "#3B6D11", fontSize: 10, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", padding: 0, flexShrink: 0 }}
                            >
                              ✕
                            </button>
                          </span>
                        ))}
                      </div>
                      {overflow > 0 && (
                        <button onClick={() => setAvailableExpanded((v) => !v)} style={{ width: "100%", background: "transparent", border: `1px dashed ${COLORS.line}`, color: COLORS.inkSoft, borderRadius: 8, padding: "8px", fontSize: 12, cursor: "pointer", marginTop: 8 }}>
                          {availableExpanded ? "Show less" : `Show all ${availablePlayers.length}`}
                        </button>
                      )}
                    </div>
                  );
                })()}
                <button onClick={() => { setShowAddAvailable((v) => !v); setGuestError(""); }} style={{ background: "transparent", border: "none", color: COLORS.inkSoft, fontSize: 11, textDecoration: "underline", cursor: "pointer", padding: 0, marginBottom: showAddAvailable ? 8 : 14 }}>
                  + Add someone who confirmed verbally, not through the app
                </button>
                {showAddAvailable && (
                  <div style={{ borderTop: `1px dashed ${COLORS.line}`, paddingTop: 10, marginBottom: 14 }}>
                    <div style={{ fontSize: 10.5, color: COLORS.inkSoft, marginBottom: 6 }}>
                      This is the only way to add someone here without them signing in themselves.
                    </div>
                    <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
                      <button
                        onClick={() => setAddMode("available")}
                        style={{
                          flex: 1, cursor: "pointer", borderRadius: 8, padding: "7px", fontSize: 11.5, fontWeight: 600,
                          border: `1px solid ${addMode === "available" ? "#3B6D11" : COLORS.line}`,
                          background: addMode === "available" ? "#EAF3E4" : "transparent",
                          color: addMode === "available" ? "#3B6D11" : COLORS.inkSoft,
                        }}
                      >
                        Available
                      </button>
                      <button
                        onClick={() => setAddMode("notAvailable")}
                        style={{
                          flex: 1, cursor: "pointer", borderRadius: 8, padding: "7px", fontSize: 11.5, fontWeight: 600,
                          border: `1px solid ${addMode === "notAvailable" ? "#9A3634" : COLORS.line}`,
                          background: addMode === "notAvailable" ? "#F5E1DC" : "transparent",
                          color: addMode === "notAvailable" ? "#9A3634" : COLORS.inkSoft,
                        }}
                      >
                        Not Available
                      </button>
                    </div>
                    <input
                      value={addSearchQuery}
                      onChange={(e) => { setAddSearchQuery(e.target.value); setGuestError(""); }}
                      placeholder="Search the squad…"
                      style={{ ...inputStyle, marginBottom: addSearchQuery.trim() ? 6 : 0 }}
                    />
                    {guestError && (
                      <div style={{ background: "#FCEBEA", color: COLORS.leather, borderRadius: 8, padding: "8px 12px", fontSize: 11.5, marginBottom: 6 }}>
                        {guestError}
                      </div>
                    )}
                    {addSearchQuery.trim() && (() => {
                      const q = addSearchQuery.trim().toLowerCase();
                      // Available mode excludes anyone already available or
                      // waitlisted, same as always. Not Available mode only
                      // excludes people already marked Not Available — someone
                      // currently Available can still show up here, since
                      // picking them is exactly how the admin corrects "actually,
                      // they can't make it" on someone's behalf.
                      const excludeIds = addMode === "available" ? [...availableIds, ...waitlistIds] : notAvailableIds;
                      const addFn = addMode === "available" ? adminAddAvailable : adminAddNotAvailable;
                      const matches = players.filter((p) => !excludeIds.includes(p.id) && p.name.toLowerCase().includes(q)).slice(0, 6);
                      if (matches.length === 0) {
                        return (
                          <div>
                            <div style={{ fontSize: 12, color: COLORS.inkSoft, padding: "6px 2px", marginBottom: 6 }}>No one on the roster matches "{addSearchQuery}".</div>
                            {addGuestPlayer && addMode === "available" && (
                              <button
                                onClick={() => {
                                  const res = addGuestPlayer(addSearchQuery);
                                  if (res.ok) { adminAddAvailable(match.id, res.id); setAddSearchQuery(""); setGuestError(""); }
                                  else setGuestError(res.error);
                                }}
                                style={{
                                  width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", textAlign: "left",
                                  background: "#E4C79A", border: `1px dashed ${COLORS.willow}`, borderRadius: 8,
                                  padding: "9px 10px", cursor: "pointer",
                                }}
                              >
                                <span style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.leather }}>+ Add "{addSearchQuery.trim()}" as a one-off guest</span>
                              </button>
                            )}
                          </div>
                        );
                      }
                      return (
                        <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 8, overflow: "hidden" }}>
                          {matches.map((p, i) => (
                            <button
                              key={p.id}
                              onClick={() => { addFn(match.id, p.id); setAddSearchQuery(""); }}
                              style={{
                                width: "100%", display: "flex", alignItems: "center", gap: 8, textAlign: "left",
                                background: "transparent", border: "none", cursor: "pointer", padding: "8px 10px",
                                borderBottom: i < matches.length - 1 ? `1px solid ${COLORS.line}` : "none",
                              }}
                            >
                              <PlayerAvatar name={p.name} photo={photos && photos[p.id]} size={20} border={false} />
                              <span style={{ fontSize: 13 }}>{p.name}</span>
                            </button>
                          ))}
                        </div>
                      );
                    })()}
                  </div>
                )}

                {waitlistPlayers.length > 0 && (
                  <div style={{ marginBottom: 14 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                      <span style={{ fontSize: 12, fontWeight: 600, color: COLORS.inkSoft }}>🕒 Waitlist</span>
                      <span style={{ fontSize: 10, fontWeight: 700, background: "#F6E9D2", color: "#8A5A17", padding: "2px 9px", borderRadius: 20 }}>{waitlistPlayers.length} waiting</span>
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                      {waitlistPlayers.map((p, i) => (
                        <div key={p.id} style={{ display: "flex", alignItems: "center", gap: 8, border: `1px solid ${COLORS.line}`, borderRadius: 8, padding: "7px 10px" }}>
                          <span style={{ width: 18, height: 18, borderRadius: "50%", background: "#8A5A17", color: "#fff", fontSize: 10, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{i + 1}</span>
                          <PlayerAvatar name={p.name} photo={photos && photos[p.id]} size={20} border={false} />
                          <span style={{ fontSize: 13, flex: 1 }}>{p.name}</span>
                          <button onClick={() => promoteFromWaitlist(match.id, p.id)} style={{ fontSize: 10.5, fontWeight: 700, color: COLORS.willow, background: "transparent", border: `1px solid ${COLORS.willow}`, borderRadius: 6, padding: "3px 8px", cursor: "pointer", flexShrink: 0 }}>
                            Promote
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {notAvailablePlayers.length > 0 && (() => {
                  const shownNotAvailable = notAvailableExpanded ? notAvailablePlayers : notAvailablePlayers.slice(0, PREVIEW_ROWS);
                  const overflow = notAvailablePlayers.length - PREVIEW_ROWS;
                  return (
                    <div style={{ marginBottom: 14 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                        <span style={{ fontSize: 12, fontWeight: 600, color: COLORS.inkSoft }}>Not Available</span>
                        <span style={{ fontSize: 10, fontWeight: 700, background: "#F5E1DC", color: "#9A3634", padding: "2px 9px", borderRadius: 20 }}>{notAvailablePlayers.length}</span>
                      </div>
                      <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                        {shownNotAvailable.map((p) => (
                          <span key={p.id} style={{
                            borderRadius: 20, padding: "4px 4px 4px 4px", fontSize: 12,
                            border: "1px solid #E0A79E", background: "#F5E1DC", color: "#9A3634",
                            display: "flex", alignItems: "center", gap: 6,
                          }}>
                            <PlayerAvatar name={p.name} photo={photos && photos[p.id]} size={20} border={false} onView={photos && photos[p.id] && onViewPhoto ? () => onViewPhoto(p.name, photos[p.id]) : undefined} />
                            {p.name}
                            <button
                              onClick={() => toggleMatchNotAvailable(match.id, p.id)}
                              title={`Remove ${p.name} from Not Available`}
                              style={{ width: 16, height: 16, borderRadius: "50%", background: "rgba(0,0,0,0.12)", border: "none", color: "#9A3634", fontSize: 10, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", padding: 0, flexShrink: 0 }}
                            >
                              ✕
                            </button>
                          </span>
                        ))}
                      </div>
                      {overflow > 0 && (
                        <button onClick={() => setNotAvailableExpanded((v) => !v)} style={{ width: "100%", background: "transparent", border: `1px dashed ${COLORS.line}`, color: COLORS.inkSoft, borderRadius: 8, padding: "8px", fontSize: 12, cursor: "pointer", marginTop: 8 }}>
                          {notAvailableExpanded ? "Show less" : `Show all ${notAvailablePlayers.length}`}
                        </button>
                      )}
                    </div>
                  );
                })()}

                {availablePlayers.length > 0 && (() => {
                  const shown = playedExpanded ? availablePlayers : availablePlayers.slice(0, PREVIEW_ROWS);
                  const overflow = availablePlayers.length - PREVIEW_ROWS;
                  return (
                    <>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                        <span style={{ fontSize: 12, fontWeight: 600, color: COLORS.inkSoft }}>Who actually played?</span>
                        <span style={{ fontSize: 10, fontWeight: 700, background: "#EEEAD9", color: COLORS.inkSoft, padding: "2px 9px", borderRadius: 20 }}>{playedPlayers.length} playing</span>
                      </div>
                      <div style={{ fontSize: 11, color: COLORS.inkSoft, marginBottom: 8 }}>Tap to exclude anyone who didn't get a chance — they won't be charged, and it won't stop anyone who votes available later from showing up here too.</div>
                      <div style={{ marginBottom: 14 }}>
                        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                          {shown.map((p) => {
                            const on = playedIds.includes(p.id);
                            return (
                              <button key={p.id} onClick={() => togglePlayed(match.id, p.id)} style={{
                                display: "flex", justifyContent: "space-between", alignItems: "center", width: "100%",
                                background: on ? "#EAF3E4" : "#F3EEDF", border: "none", borderRadius: 8, padding: "8px 10px", cursor: "pointer",
                              }}>
                                <span style={{ fontSize: 13, color: on ? COLORS.ink : COLORS.inkSoft, display: "flex", alignItems: "center", gap: 8 }}>
                                  <PlayerAvatar name={p.name} photo={photos && photos[p.id]} size={22} border={false} onView={photos && photos[p.id] && onViewPhoto ? () => onViewPhoto(p.name, photos[p.id]) : undefined} />
                                  {p.name}
                                </span>
                                <span style={{ fontSize: 11, fontWeight: 600, color: on ? "#3B6D11" : COLORS.inkSoft }}>{on ? "✓ Played" : "Didn't play"}</span>
                              </button>
                            );
                          })}
                        </div>
                        {overflow > 0 && (
                          <button onClick={() => setPlayedExpanded((v) => !v)} style={{ width: "100%", background: "transparent", border: `1px dashed ${COLORS.line}`, color: COLORS.inkSoft, borderRadius: 8, padding: "8px", fontSize: 12, cursor: "pointer", marginTop: 8 }}>
                            {playedExpanded ? "Show less" : `Show all ${availablePlayers.length}`}
                          </button>
                        )}
                      </div>
                    </>
                  );
                })()}

                <div style={{ display: "flex", gap: 8 }}>
                  <button onClick={handleCopyAvail} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 5, background: "transparent", border: `1px solid ${COLORS.line}`, borderRadius: 8, padding: "9px", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
                    {copiedAvail ? <Icon size={13}>✅</Icon> : <Icon size={13}>⧉</Icon>} {copiedAvail ? "Copied!" : "Copy availability"}
                  </button>
                  <WhatsAppShareLink text={buildMatchAvailabilityMessage(match, players)} style={{ flex: 1, gap: 5, padding: "9px" }}>
                    💬 Share
                  </WhatsAppShareLink>
                </div>
              </>
            )}

            {activeTab === "carpool" && (() => {
              const carpool = match.carpool || {};
              const driverIds = carpoolDrivers(match);
              const unmatchedRiders = carpoolUnmatchedRiders(match).map((id) => players.find((p) => p.id === id)).filter(Boolean);
              if (availablePlayers.length === 0) {
                return <div style={{ fontSize: 12, color: COLORS.inkSoft }}>Carpool details will appear here once players start confirming availability.</div>;
              }
              if (driverIds.length === 0 && unmatchedRiders.length === 0) {
                return <div style={{ fontSize: 12, color: COLORS.inkSoft }}>No one's offered a ride or asked for one yet.</div>;
              }
              const totalSeats = driverIds.reduce((sum, id) => sum + (carpool[id].seats || 0), 0);
              const totalRiders = driverIds.reduce((sum, id) => sum + carpoolRidersOf(match, id).length, 0);
              return (
                <div>
                  <div style={{ fontSize: 11.5, color: COLORS.inkSoft, marginBottom: 10 }}>
                    {driverIds.length} driver{driverIds.length === 1 ? "" : "s"} · {totalSeats} seat{totalSeats === 1 ? "" : "s"} offered · {totalRiders} matched{unmatchedRiders.length > 0 ? ` · ${unmatchedRiders.length} still need a ride` : ""}
                  </div>
                  {driverIds.length > 0 && (
                    <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: unmatchedRiders.length > 0 ? 10 : 0 }}>
                      {driverIds.map((id) => {
                        const driverPlayer = players.find((p) => p.id === id);
                        if (!driverPlayer) return null;
                        const entry = carpool[id];
                        const riders = carpoolRidersOf(match, id).map((rid) => players.find((p) => p.id === rid)).filter(Boolean);
                        const seatsLeft = carpoolSeatsLeft(match, id);
                        const { ordered, unordered, driverHasLocation } = suggestCarpoolOrder(match, id, players);
                        return (
                          <div key={id} style={{ background: "#F3EEDF", borderRadius: 8, padding: "8px 10px" }}>
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                              <div style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.ink }}>🚘 {driverPlayer.name} · {carpoolSeatsLabel(entry.seats, seatsLeft)}{entry.pickupPoint ? ` · ${entry.pickupPoint}` : ""}</div>
                              {entry.location && <a href={buildMapsViewUrl(entry.location)} target="_blank" rel="noreferrer" style={{ fontSize: 10.5, color: COLORS.willow, fontWeight: 700, textDecoration: "none", flexShrink: 0, marginLeft: 8 }}>View ↗</a>}
                            </div>
                            {riders.length === 0 ? (
                              <div style={{ fontSize: 11, color: COLORS.inkSoft, marginTop: 2 }}>No riders yet</div>
                            ) : driverHasLocation && ordered.length > 0 ? (
                              <div style={{ marginTop: 4 }}>
                                {ordered.map((r, i) => (
                                  <div key={r.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: COLORS.inkSoft }}>
                                    <span>{i + 1}. {r.name}</span>
                                    <span className="mono">~{r.distanceKm.toFixed(1)} km</span>
                                  </div>
                                ))}
                                {unordered.length > 0 && <div style={{ fontSize: 10.5, color: COLORS.inkSoft, marginTop: 2 }}>+ {unordered.map((r) => r.name).join(", ")} (no location)</div>}
                              </div>
                            ) : (
                              <div style={{ fontSize: 11, color: COLORS.inkSoft, marginTop: 2 }}>Riding: {riders.map((p) => p.name).join(", ")}</div>
                            )}
                            {entry.sharingLive && entry.liveLocation && (
                              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 6 }}>
                                <span style={{ fontSize: 10.5, color: "#3B7A3E", fontWeight: 600 }}>📍 Live · updated {fmtLiveAgo(entry.liveLocation.updatedAt)}</span>
                                <a href={buildMapsViewUrl(entry.liveLocation)} target="_blank" rel="noreferrer" style={{ fontSize: 10.5, color: "#3B7A3E", fontWeight: 700, textDecoration: "none" }}>View ↗</a>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                  {unmatchedRiders.length > 0 && (
                    <div style={{ fontSize: 11.5, color: "#9A3634", marginBottom: 10 }}>
                      🙋 Still need a ride: {unmatchedRiders.map((p) => p.name).join(", ")}
                    </div>
                  )}
                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={handleCopyCarpool} style={{ flex: 1, background: "transparent", border: `1px solid ${COLORS.line}`, color: COLORS.ink, borderRadius: 8, padding: "8px", fontSize: 12, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
                      {copiedCarpool ? "✅ Copied!" : "📋 Copy"}
                    </button>
                    <WhatsAppShareLink text={buildCarpoolMessage(match, players, teamName)} style={{ flex: 1, padding: "8px" }}>
                      💬 Share
                    </WhatsAppShareLink>
                  </div>
                </div>
              );
            })()}

            {activeTab === "money" && (
              <>
                <div style={{ background: COLORS.pitch, borderRadius: 12, padding: 16, marginBottom: 14 }}>
                  <div style={{ fontSize: 11, letterSpacing: 1, textTransform: "uppercase", color: COLORS.willow, marginBottom: 10 }}>Match fee split</div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 10 }}>
                    <div>
                      <div style={{ fontSize: 10, color: "#9BAE9E", marginBottom: 4 }}>TOTAL COST</div>
                      <input
                        type="text" inputMode="decimal" value={match.totalCost}
                        onChange={(e) => updateMatchField(match.id, "totalCost", sanitizeDecimalInput(e.target.value))}
                        onBlur={(e) => updateMatchField(match.id, "totalCost", String(Number(e.target.value) || 0))}
                        style={{ width: "100%", background: COLORS.pitchLight, border: "none", borderRadius: 8, padding: "8px 10px", color: "#fff", fontSize: 13, outline: "none", boxSizing: "border-box" }}
                      />
                    </div>
                    <div>
                      <div style={{ fontSize: 10, color: "#9BAE9E", marginBottom: 4 }}>PER PLAYER ({playedPlayers.length})</div>
                      <div style={{ background: COLORS.pitchLight, borderRadius: 8, padding: "8px 10px", color: "#fff", fontSize: 13 }}>{fmtINR(perPlayerFee)}</div>
                    </div>
                  </div>
                  <div style={{ fontSize: 10, color: "#9BAE9E", marginBottom: 6 }}>
                    UPI ID for this match {!match.upiNumber && paymentDefault.upiNumber ? "(using your team default — enter one here to override just this match)" : "(optional)"}
                  </div>
                  <input placeholder="UPI / phone number" value={match.upiNumber} onChange={(e) => updateMatchField(match.id, "upiNumber", e.target.value)} onBlur={(e) => updateMatchField(match.id, "upiNumber", e.target.value.trim())} style={{ width: "100%", background: COLORS.pitchLight, border: "none", borderRadius: 8, padding: "8px 10px", color: "#fff", fontSize: 13, outline: "none", boxSizing: "border-box", marginBottom: 10 }} />

                  <div style={{ fontSize: 10, color: "#9BAE9E", marginBottom: 6 }}>
                    QR code for this match {!matchOwnQr && paymentDefault.qr ? "(using your team default — upload one here to override just this match)" : "(optional)"}
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <PlainImageUpload
                      maxDim={640} quality={0.92} onUpload={(dataUrl) => uploadMatchQr(match.id, dataUrl)}
                      crop cropTitle="Position your QR code" cropConfirmLabel="Use this QR code"
                      cropInstructions="Drag so just the QR code sits inside the frame — crop out any surrounding app screenshot."
                    >
                      {(busy) => (
                        <div style={{
                          width: 44, height: 44, borderRadius: 8, overflow: "hidden", flexShrink: 0, cursor: "pointer",
                          background: "#fff", border: `1px solid ${COLORS.pitchLight}`, display: "flex", alignItems: "center", justifyContent: "center",
                        }}>
                          {busy ? <Icon size={12} color="#9BAE9E">…</Icon> : effectiveQr ? (
                            <img src={effectiveQr} alt="" style={{ width: "100%", height: "100%", objectFit: "contain" }} />
                          ) : <Icon size={16} color="#9BAE9E">📷</Icon>}
                        </div>
                      )}
                    </PlainImageUpload>
                    {matchOwnQr && (
                      <button onClick={() => removeMatchQr(match.id)} style={{ background: "transparent", border: "none", color: "#9BAE9E", fontSize: 11, textDecoration: "underline", cursor: "pointer", padding: 0 }}>
                        Remove override, use team default
                      </button>
                    )}
                  </div>
                </div>

                {playedPlayers.length > 0 && (() => {
                  const paidPct = Math.round((paidCount / playedPlayers.length) * 100);
                  const shown = paidExpanded ? playedPlayers : playedPlayers.slice(0, PREVIEW_ROWS);
                  const overflow = playedPlayers.length - PREVIEW_ROWS;
                  return (
                    <div style={{ marginBottom: 14 }}>
                      <div style={{ fontSize: 12, fontWeight: 600, color: COLORS.inkSoft, marginBottom: 8 }}>Payment status</div>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 5 }}>
                        <span className="mono" style={{ fontSize: 12, color: COLORS.inkSoft }}>{paidCount} of {playedPlayers.length} paid</span>
                        <span className="mono" style={{ fontSize: 12, color: COLORS.inkSoft }}>{paidPct}%</span>
                      </div>
                      <div style={{ background: COLORS.line, borderRadius: 6, height: 7, overflow: "hidden", marginBottom: 10 }}>
                        <div style={{ width: `${paidPct}%`, height: "100%", background: "#5C8A63", borderRadius: 6 }} />
                      </div>
                      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                        {shown.map((p) => {
                          const paid = !!(match.payments || {})[p.id];
                          const hasProof = !!(match.paymentProofFlags || {})[p.id];
                          const proofPhoto = photos[matchProofKey(match.id, p.id)];
                          return (
                            <div key={p.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0", borderBottom: `1px solid ${COLORS.line}` }}>
                              <span style={{ fontSize: 13, display: "flex", alignItems: "center", gap: 8, minWidth: 0 }}>
                                <PlayerAvatar name={p.name} photo={photos && photos[p.id]} size={22} border={false} onView={photos && photos[p.id] && onViewPhoto ? () => onViewPhoto(p.name, photos[p.id]) : undefined} />
                                {hasProof && (
                                  proofPhoto ? (
                                    <img
                                      src={proofPhoto} alt="Payment proof" onClick={() => setViewingProofOf(p.id)}
                                      style={{ width: 26, height: 26, borderRadius: 6, objectFit: "cover", cursor: "pointer", border: `1px solid ${COLORS.line}`, flexShrink: 0 }}
                                    />
                                  ) : (
                                    <span title="Proof uploaded — loading…" style={{ fontSize: 12, flexShrink: 0 }}>📎</span>
                                  )
                                )}
                                <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.name}</span>
                              </span>
                              <button onClick={() => toggleMatchPaid(match.id, p.id)} style={{
                                cursor: "pointer", borderRadius: 20, padding: "5px 12px", fontSize: 12, fontWeight: 600, flexShrink: 0,
                                border: `1px solid ${paid ? "#5C8A63" : COLORS.willow}`,
                                background: paid ? "#5C8A63" : "transparent", color: paid ? "#fff" : COLORS.willow,
                              }}>
                                {paid ? "Paid" : "Mark as paid"}
                              </button>
                            </div>
                          );
                        })}
                      </div>
                      {overflow > 0 && (
                        <button onClick={() => setPaidExpanded((v) => !v)} style={{ width: "100%", background: "transparent", border: `1px dashed ${COLORS.line}`, color: COLORS.inkSoft, borderRadius: 8, padding: "8px", fontSize: 12, cursor: "pointer", marginTop: 8 }}>
                          {paidExpanded ? "Show less" : `Show all ${playedPlayers.length}`}
                        </button>
                      )}
                    </div>
                  );
                })()}

                <div style={{ display: "flex", gap: 8 }}>
                  <button
                    onClick={handleCopyPay}
                    disabled={feeNotSet}
                    title={feeNotSet ? "Set a total cost above, and mark who played, first" : undefined}
                    style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 5, background: "transparent", border: `1px solid ${COLORS.line}`, borderRadius: 8, padding: "9px", fontSize: 12, fontWeight: 600, cursor: feeNotSet ? "not-allowed" : "pointer", opacity: feeNotSet ? 0.5 : 1 }}
                  >
                    {copiedPay ? <Icon size={13}>✅</Icon> : <Icon size={13}>⧉</Icon>} {copiedPay ? "Copied!" : feeNotSet ? "Set a fee first" : "Copy payment msg"}
                  </button>
                  {!feeNotSet && (
                    <button
                      onClick={handleSharePay}
                      disabled={sharePayBusy}
                      style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 5, background: "#25D366", border: "none", color: "#fff", borderRadius: 8, padding: "9px", fontSize: 12, fontWeight: 600, cursor: sharePayBusy ? "default" : "pointer", opacity: sharePayBusy ? 0.7 : 1 }}
                    >
                      💬 {sharePayBusy ? "…" : "Share"}
                    </button>
                  )}
                </div>
              </>
            )}

            {activeTab === "performers" && (
              playedPlayers.length === 0 ? (
                <div style={{ fontSize: 12, color: COLORS.inkSoft }}>Mark who played (in the Squad tab) to start tagging performers.</div>
              ) : (
                <div>
                  {PERFORMER_CATEGORIES.map((cat) => {
                    const entry = performers[cat.key] || {};
                    return (
                      <div key={cat.key} style={{ marginBottom: 10 }}>
                        <div style={{ fontSize: 11, color: COLORS.inkSoft, marginBottom: 4 }}>{cat.icon} {cat.label}</div>
                        <select
                          value={entry.playerId || ""}
                          onChange={(e) => {
                            const v = e.target.value;
                            if (!v) { clearMatchPerformer(match.id, cat.key); return; }
                            setMatchPerformerField(match.id, cat.key, "playerId", v);
                          }}
                          style={{ ...inputStyle, marginBottom: entry.playerId ? 6 : 0 }}
                        >
                          <option value="">Select player</option>
                          {playedPlayers.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
                        </select>
                        {entry.playerId && (
                          <input
                            placeholder="Note (optional) — e.g. 87 runs off 45 balls"
                            value={entry.note || ""}
                            onChange={(e) => setMatchPerformerField(match.id, cat.key, "note", e.target.value)}
                            onBlur={(e) => setMatchPerformerField(match.id, cat.key, "note", e.target.value.trim())}
                            style={{ ...inputStyle, fontSize: 12 }}
                          />
                        )}
                      </div>
                    );
                  })}

                  {filledPerformerCount > 0 && (
                    <div style={{ background: "linear-gradient(135deg, #C08A45, #9A6B3C)", borderRadius: 12, padding: 16, marginTop: 4 }}>
                      <div style={{ fontSize: 22, textAlign: "center", marginBottom: 4 }}>🏆</div>
                      <div className="scorenum" style={{ fontSize: 18, textAlign: "center", color: "#fff", marginBottom: 10 }}>Match Performers</div>
                      {PERFORMER_CATEGORIES.map((cat) => {
                        const entry = performers[cat.key];
                        if (!entry || !entry.playerId) return null;
                        const p = players.find((pl) => pl.id === entry.playerId);
                        if (!p) return null;
                        return (
                          <div key={cat.key} style={{ display: "flex", alignItems: "center", gap: 9, background: "rgba(255,255,255,0.14)", borderRadius: 10, padding: "8px 10px", marginBottom: 7 }}>
                            <PlayerAvatar name={p.name} photo={photos && photos[p.id]} size={26} border={false} />
                            <div>
                              <div style={{ fontSize: 9, textTransform: "uppercase", letterSpacing: 0.4, color: "rgba(255,255,255,0.75)" }}>{cat.label}</div>
                              <div style={{ fontSize: 12, fontWeight: 600, color: "#fff" }}>{p.name}</div>
                              {entry.note && <div style={{ fontSize: 10, color: "rgba(255,255,255,0.85)" }}>{entry.note}</div>}
                            </div>
                          </div>
                        );
                      })}
                      <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
                        <button onClick={handleCopyPerformers} style={{ flex: 1, background: "rgba(255,255,255,0.22)", border: "none", borderRadius: 8, padding: 9, fontSize: 12, fontWeight: 600, color: "#fff", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
                          {copiedPerformers ? "✅ Copied!" : "📋 Copy"}
                        </button>
                        <WhatsAppShareLink text={buildMatchPerformersMessage(match, players, teamName)} style={{ flex: 1, padding: 9 }}>
                          💬 Share
                        </WhatsAppShareLink>
                      </div>
                    </div>
                  )}
                </div>
              )
            )}

            {activeTab === "settings" && (
              <>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
                  <FieldSelect placeholder="Match type" value={match.matchType} onChange={(v) => updateMatchField(match.id, "matchType", v)} options={MATCH_TYPE_OPTIONS} />
                  <GroundNameField
                    value={match.groundName} knownGrounds={knownGrounds}
                    onChange={(v) => {
                      updateMatchField(match.id, "groundName", v);
                      const loc = knownGroundLocations[v];
                      if (loc) updateMatchField(match.id, "locationUrl", loc);
                    }}
                    onBlur={(v) => updateMatchField(match.id, "groundName", v)}
                  />
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 10 }}>
                  <input type="date" value={match.date} onChange={(e) => updateMatchField(match.id, "date", e.target.value)} style={inputStyle} />
                  <input type="time" value={match.time} onChange={(e) => updateMatchField(match.id, "time", e.target.value)} style={inputStyle} />
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 10 }}>
                  <FieldSelect placeholder="Overs" value={match.overs} onChange={(v) => updateMatchField(match.id, "overs", v)} options={OVERS_OPTIONS} />
                  <FieldSelect placeholder="Ball" value={match.ballType} onChange={(v) => updateMatchField(match.id, "ballType", v)} options={BALL_TYPE_OPTIONS} />
                </div>
                <div style={{ marginBottom: 8 }}>
                  <FieldSelect placeholder="Jersey / dress code" value={match.jersey} onChange={(v) => updateMatchField(match.id, "jersey", v)} options={JERSEY_OPTIONS} />
                </div>
                <input placeholder="Location (Google Maps link)" value={match.locationUrl} onChange={(e) => updateMatchField(match.id, "locationUrl", e.target.value)} onBlur={(e) => updateMatchField(match.id, "locationUrl", e.target.value.trim())} style={{ ...inputStyle, marginBottom: 8 }} />
                <input
                  type="number" min="0" placeholder="Max players (optional — leave blank for no limit)"
                  value={match.capacity || ""}
                  onChange={(e) => updateMatchCapacity(match.id, e.target.value)}
                  style={{ ...inputStyle, marginBottom: 12 }}
                />

                <div style={{ fontSize: 11, color: COLORS.inkSoft, marginBottom: 6 }}>Match banner (optional) — shown to players above the match details</div>
                <MatchBannerUpload
                  banner={matchBanner}
                  onUpload={(dataUrl) => uploadMatchBanner(match.id, dataUrl)}
                  onRemove={() => removeMatchBanner(match.id)}
                />
                {/* Duplicate and Delete moved to the card header, next to the
                    ground name — visible at a glance instead of needing to
                    expand into Settings to find them. */}
              </>
            )}
          </MatchTabBar>
        </div>
      )}
    </div>
    {viewingProofOf && viewingProofPlayer && (
      <PaymentProofModal
        playerName={viewingProofPlayer.name}
        photo={viewingProofPhoto}
        alreadyPaid={!!(match.payments || {})[viewingProofOf]}
        onClose={() => setViewingProofOf(null)}
        onConfirmPaid={() => { toggleMatchPaid(match.id, viewingProofOf); setViewingProofOf(null); }}
      />
    )}
    {showLiveModal && (
      <LiveBroadcastModal
        matchLabel={`${match.matchType || "Match"} · ${match.groundName || "Ground TBD"}`}
        broadcasterId={null}
        broadcasterName={teamName || "Admin"}
        onClose={() => setShowLiveModal(false)}
        onStarted={(meetingId) => onMatchLiveStarted(match.id, meetingId, null)}
        onStopped={() => onMatchLiveStopped && onMatchLiveStopped(match.id)}
      />
    )}
    </>
  );
}

const inputStyle = { width: "100%", border: `1px solid ${COLORS.line}`, borderRadius: 8, padding: "10px 12px", fontSize: 14, background: "#fff", color: COLORS.ink, outline: "none", boxSizing: "border-box" };


ReactDOM.createRoot(document.getElementById("root")).render(<CricketNetsTracker />);
</script>
</body>
</html>
