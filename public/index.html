                            <>
                              {locationRow}
                              <div style={{ fontSize: 12, color: COLORS.inkSoft }}>No one's offered a ride yet — check back later.</div>
                            </>
                          );
                        }
                        return (
                          <>
                            {locationRow}
                            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                            {driverIds.map((id) => {
                              const driverPlayer = players.find((p) => p.id === id);
                              if (!driverPlayer) return null;
                              const entry = carpool[id];
                              const seatsLeft = carpoolSeatsLeft(m, id);
                              const full = seatsLeft <= 0;
                              return (
                                <div key={id} style={{ border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: 10, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                                    <PlayerAvatar name={driverPlayer.name} photo={photos && photos[driverPlayer.id]} size={26} border={false} />
                                    <div>
                                      <div style={{ fontSize: 13, fontWeight: 600 }}>
                                        {driverPlayer.name}'s car {full ? <span style={{ fontSize: 10, fontWeight: 700, color: "#9A3634" }}>· Full</span> : <span style={{ fontSize: 10, fontWeight: 700, color: "#3B6D11" }}>· {seatsLeft} seat{seatsLeft === 1 ? "" : "s"} left</span>}
                                      </div>
                                      {entry.pickupPoint && <div style={{ fontSize: 11, color: COLORS.inkSoft }}>{entry.pickupPoint}</div>}
                                    </div>
                                  </div>
                                  {!full && (
                                    <button onClick={() => joinCarpoolDriver(m.id, authedPlayer.id, id)} style={{ background: COLORS.willow, border: "none", color: "#fff", fontSize: 12, fontWeight: 600, borderRadius: 8, padding: "7px 12px", cursor: "pointer", flexShrink: 0 }}>
                                      Join
                                    </button>
                                  )}
                                </div>
                              );
                            })}
                            </div>
                          </>
                        );
                      })()}
                    </div>
                  );
                })()
              )}

              {activeTab === "money" && (
                !(isPlaying && m.totalCost) ? (
                  <div style={{ fontSize: 12, color: COLORS.inkSoft }}>Match fee details will appear here once you're marked as playing and a fee is set.</div>
                ) : (
                  <div>
                    {!paid && effectiveQr && (
                      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 6, margin: "4px 0 14px" }}>
                        {payUrl ? (
                          // A real <a href="upi://..."> lets Android/Chrome resolve
                          // the external-app handoff through its normal link
                          // navigation path. Doing this via window.location.href in
                          // a click handler instead is what threw the generic
                          // "Something went wrong" interstitial — script-driven
                          // navigation to a custom scheme is handled far less
                          // reliably than a genuine anchor tap.
                          <a
                            href={payUrl}
                            style={{ width: 132, height: 132, borderRadius: 10, overflow: "hidden", background: "#fff", boxShadow: "0 1px 4px rgba(0,0,0,0.15)", display: "block" }}
                          >
                            <img src={effectiveQr} alt="Payment QR code" style={{ width: "100%", height: "100%", objectFit: "contain" }} />
                          </a>
                        ) : (
                          <div
                            onClick={() => onViewPhoto("Payment QR code", effectiveQr)}
                            style={{ width: 132, height: 132, borderRadius: 10, overflow: "hidden", background: "#fff", boxShadow: "0 1px 4px rgba(0,0,0,0.15)", cursor: "pointer" }}
                          >
                            <img src={effectiveQr} alt="Payment QR code" style={{ width: "100%", height: "100%", objectFit: "contain" }} />
                          </div>
                        )}
                        <div style={{ fontSize: 11, color: COLORS.inkSoft, textAlign: "center" }}>
                          {payUrl ? "Tap to pay via UPI app" : "Tap to enlarge, then scan to pay via UPI"}{effectiveUpiNumber ? <><br /><span className="mono">{effectiveUpiNumber}</span></> : null}
                        </div>
                      </div>
                    )}
                    {!paid && !effectiveQr && effectiveUpiNumber && (
                      payUrl ? (
                        <a
                          href={payUrl}
                          style={{ display: "block", fontSize: 12, color: COLORS.inkSoft, textAlign: "center", marginBottom: 14, textDecoration: "none" }}
                        >
                          Tap to pay via UPI app: <span className="mono">{effectiveUpiNumber}</span>
                        </a>
                      ) : (
                        <div style={{ fontSize: 12, color: COLORS.inkSoft, textAlign: "center", marginBottom: 14 }}>
                          Pay via UPI: <span className="mono">{effectiveUpiNumber}</span>
                        </div>
                      )
                    )}

                    <div style={{
                      borderRadius: 8, padding: "9px 10px", fontSize: 12, textAlign: "center", fontWeight: 600, marginBottom: 10,
                      background: paid ? "#EAF3E4" : "#FAEEDA", color: paid ? "#3B6D11" : "#854F0B",
                    }}>
                      {paid ? "✓ Payment confirmed by admin" : "⏳ Pending admin confirmation"}
                    </div>

                    {uploadMatchProof && (
                      <>
                        <div style={{ fontSize: 11, fontWeight: 600, color: COLORS.inkSoft, marginBottom: 6 }}>Payment proof (optional)</div>
                        {!hasProof ? (
                          <PlainImageUpload maxDim={800} quality={0.78} onUpload={(dataUrl) => uploadMatchProof(m.id, authedPlayer.id, dataUrl)}>
                            {(busy) => (
                              <div style={{
                                border: `1.5px dashed ${COLORS.line}`, borderRadius: 10, padding: 14, textAlign: "center", cursor: "pointer", background: "#fff",
                              }}>
                                <div style={{ fontSize: 18, marginBottom: 4 }}>{busy ? "…" : "📎"}</div>
                                <div style={{ fontSize: 11.5, color: COLORS.inkSoft }}>{busy ? "Uploading…" : "Tap to attach a payment screenshot"}</div>
                              </div>
                            )}
                          </PlainImageUpload>
                        ) : (
                          <div>
                            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
                              {proofPhoto ? (
                                <img src={proofPhoto} alt="Your payment proof" onClick={() => onViewPhoto("Your payment proof", proofPhoto)} style={{ width: 40, height: 40, borderRadius: 8, objectFit: "cover", cursor: "pointer", border: `1px solid ${COLORS.line}` }} />
                              ) : (
                                <div style={{ width: 40, height: 40, borderRadius: 8, background: "#EEEAD9", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16 }}>📎</div>
                              )}
                              <div style={{ fontSize: 11, color: COLORS.inkSoft }}>{paid ? "Uploaded" : "Uploaded — waiting on admin"}</div>
                            </div>
                            <div style={{ display: "flex", justifyContent: "center", gap: 14 }}>
                              <PlainImageUpload maxDim={800} quality={0.78} onUpload={(dataUrl) => uploadMatchProof(m.id, authedPlayer.id, dataUrl)}>
                                {(busy) => (
                                  <div style={{ fontSize: 10.5, color: COLORS.inkSoft, textAlign: "center", textDecoration: "underline", cursor: "pointer" }}>
                                    {busy ? "Uploading…" : "Replace"}
                                  </div>
                                )}
                              </PlainImageUpload>
                              {removeMatchProof && (
                                <button
                                  onClick={() => removeMatchProof(m.id, authedPlayer.id)}
                                  style={{ background: "none", border: "none", padding: 0, fontSize: 10.5, color: COLORS.leather, textDecoration: "underline", cursor: "pointer", fontFamily: "inherit" }}
                                >
                                  Remove
                                </button>
                              )}
                            </div>
                            {paid && (
                              <div style={{ fontSize: 10, color: COLORS.inkSoft, textAlign: "center", marginTop: 4 }}>
                                Already confirmed — replacing or removing this won't change that.
                              </div>
                            )}
                          </div>
                        )}
                      </>
                    )}
                  </div>
                )
              )}

              {activeTab === "performers" && (
                filledPerformerCount === 0 ? (
                  <div style={{ fontSize: 12, color: COLORS.inkSoft }}>Not announced yet.</div>
                ) : (
                  <div style={{ background: "linear-gradient(135deg, #C08A45, #9A6B3C)", borderRadius: 12, padding: 16 }}>
                    <div style={{ fontSize: 22, textAlign: "center", marginBottom: 4 }}>🏆</div>
                    <div className="scorenum" style={{ fontSize: 18, textAlign: "center", color: "#fff", marginBottom: 10 }}>Match Performers</div>
                    {PERFORMER_CATEGORIES.map((cat) => {
                      const entry = performers[cat.key];
                      if (!entry || !entry.playerId) return null;
                      const p = players.find((pl) => pl.id === entry.playerId);
                      if (!p) return null;
                      return (
                        <div key={cat.key} style={{ display: "flex", alignItems: "center", gap: 9, background: "rgba(255,255,255,0.14)", borderRadius: 10, padding: "8px 10px", marginBottom: 7 }}>
                          <PlayerAvatar name={p.name} photo={photos && photos[p.id]} size={26} border={false} onView={photos && photos[p.id] ? () => onViewPhoto(p.name, photos[p.id]) : undefined} />
                          <div>
                            <div style={{ fontSize: 9, textTransform: "uppercase", letterSpacing: 0.4, color: "rgba(255,255,255,0.75)" }}>{cat.label}</div>
                            <div style={{ fontSize: 12, fontWeight: 600, color: "#fff" }}>{p.name}</div>
                            {entry.note && <div style={{ fontSize: 10, color: "rgba(255,255,255,0.85)" }}>{entry.note}</div>}
                          </div>
                        </div>
                      );
                    })}
                    <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
                      <button onClick={() => handleCopyPerformers(m)} style={{ flex: 1, background: "rgba(255,255,255,0.22)", border: "none", borderRadius: 8, padding: 9, fontSize: 12, fontWeight: 600, color: "#fff", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
                        {copiedPerformersId === m.id ? "✅ Copied!" : "📋 Copy"}
                      </button>
                      <WhatsAppShareLink text={buildMatchPerformersMessage(m, players, teamName)} style={{ flex: 1, padding: 9 }}>
                        💬 Share
                      </WhatsAppShareLink>
                    </div>
                  </div>
                )
              )}
            </MatchTabBar>
            </div>
            )}
          </div>
        );
      })}
    </div>
    {liveModalMatchId && (
      <LiveBroadcastModal
        matchLabel={(() => {
          const lm = matchList.find((mm) => mm.id === liveModalMatchId);
          return lm ? `${lm.matchType || "Match"} · ${lm.groundName || "Ground TBD"}` : "Pavilion Live";
        })()}
        broadcasterId={authedPlayer.id}
        broadcasterName={authedPlayer.name}
        onClose={() => setLiveModalMatchId(null)}
        onStarted={(meetingId) => onMatchLiveStarted(liveModalMatchId, meetingId, authedPlayer.id)}
        onStopped={() => onMatchLiveStopped && onMatchLiveStopped(liveModalMatchId)}
      />
    )}
    </>
  );
}

function RegisterView({
  onBack, regName, setRegName, regPin, setRegPin, regPinConfirm, setRegPinConfirm,
  regPhoto, setRegPhoto, regDob, setRegDob, regError, setRegError, regBusy, setRegBusy, submitRegistration, onSubmitted,
}) {
  const fileInputRef = React.useRef(null);
  const [cropFile, setCropFile] = useState(null);

  function handlePhotoFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setCropFile(file);
  }

  function handleCropConfirm(dataUrl) {
    setRegPhoto(dataUrl);
    setCropFile(null);
  }

  async function handleSubmit() {
    setRegError("");
    if (!regName.trim()) { setRegError("Enter your name."); return; }
    if (!regDob) { setRegError("Enter your date of birth."); return; }
    if (new Date(regDob + "T00:00:00") > new Date()) { setRegError("Date of birth can't be in the future."); return; }
    if (regPin.length !== 4) { setRegError("Choose a 4-digit PIN."); return; }
    if (regPin !== regPinConfirm) { setRegError("PINs don't match."); return; }
    setRegBusy(true);
    const pinHash = await hashPin(regPin);
    const res = await submitRegistration({ name: regName, pinHash, photo: regPhoto, dob: regDob });
    setRegBusy(false);
    if (!res.ok) { setRegError(res.error); return; }
    onSubmitted(res.id);
  }

  return (
    <div style={{ minHeight: 480, background: COLORS.pitch, color: COLORS.cream, padding: 24 }}>
      <button onClick={onBack} style={{ ...iconBtnStyle, marginBottom: 20 }}><Icon size={16}>←</Icon> <span style={{ fontSize: 12, marginLeft: 4 }}>Back</span></button>
      <div className="w-340" style={{ margin: "0 auto" }}>
        <div style={{ fontSize: 11, letterSpacing: 3, textTransform: "uppercase", color: COLORS.willow, fontWeight: 600, marginBottom: 6, textAlign: "center" }}>New Player</div>
        <div className="scorenum" style={{ fontSize: 26, textAlign: "center", marginBottom: 20 }}>Register to join</div>

        <div style={{ display: "flex", justifyContent: "center", marginBottom: 6 }}>
          <button
            onClick={() => fileInputRef.current && fileInputRef.current.click()}
            style={{
              width: 72, height: 72, borderRadius: "50%", background: COLORS.pitchLight,
              border: `2px dashed ${COLORS.willow}`, cursor: "pointer", display: "flex",
              alignItems: "center", justifyContent: "center", overflow: "hidden", padding: 0,
            }}
          >
            {regPhoto ? (
              <img src={regPhoto} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
            ) : (
              <Icon size={22} color={COLORS.willow}>📷</Icon>
            )}
          </button>
        </div>
        <input ref={fileInputRef} type="file" accept="image/*" onChange={handlePhotoFile} style={{ display: "none" }} />
        {cropFile && <PhotoCropModal file={cropFile} onConfirm={handleCropConfirm} onCancel={() => setCropFile(null)} />}
        <div style={{ fontSize: 11, color: "#9BAE9E", textAlign: "center", marginBottom: 18 }}>
          {regPhoto ? "Tap to change photo" : "Tap to add a photo (optional — can add later)"}
        </div>

        <div style={{ background: COLORS.pitchLight, borderRadius: 12, padding: 16 }}>
          <div style={{ fontSize: 11, color: "#9BAE9E", marginBottom: 6 }}>Your name</div>
          <input
            value={regName}
            onChange={(e) => setRegName(e.target.value)}
            placeholder="e.g. Vinesh Kumar"
            style={{ width: "100%", background: COLORS.pitch, border: `1px solid ${COLORS.pitchLight}`, borderRadius: 8, padding: "10px 12px", color: "#fff", fontSize: 13, marginBottom: 14, boxSizing: "border-box", outline: "none" }}
          />

          <div style={{ fontSize: 11, color: "#9BAE9E", marginBottom: 6 }}>Date of birth</div>
          <DobField value={regDob} onChange={setRegDob} maxDate={todayISO()} dark />
          <div style={{ fontSize: 10, color: "#7C8E80", marginTop: 6, marginBottom: 14 }}>
            Only used to wish you on your birthday — set once here, your admin can correct it later if needed.
          </div>

          <div style={{ fontSize: 11, color: "#9BAE9E", marginBottom: 6 }}>Choose a 4-digit PIN</div>
          <input
            className="pinbox"
            type="password" inputMode="numeric" maxLength={4}
            value={regPin}
            onChange={(e) => setRegPin(e.target.value.replace(/\D/g, "").slice(0, 4))}
            placeholder="••••"
            style={{ width: "100%", textAlign: "center", letterSpacing: 8, fontSize: 20, border: `1px solid ${COLORS.pitchLight}`, borderRadius: 8, padding: "10px 12px", background: COLORS.pitch, color: "#fff", outline: "none", boxSizing: "border-box", marginBottom: 10 }}
          />
          <input
            className="pinbox"
            type="password" inputMode="numeric" maxLength={4}
            value={regPinConfirm}
            onChange={(e) => setRegPinConfirm(e.target.value.replace(/\D/g, "").slice(0, 4))}
            onKeyDown={(e) => e.key === "Enter" && handleSubmit()}
            placeholder="Confirm PIN"
            style={{ width: "100%", textAlign: "center", letterSpacing: 8, fontSize: 20, border: `1px solid ${COLORS.pitchLight}`, borderRadius: 8, padding: "10px 12px", background: COLORS.pitch, color: "#fff", outline: "none", boxSizing: "border-box", marginBottom: 14 }}
          />

          {regError && <div style={{ color: "#F0A6A4", fontSize: 12, marginBottom: 10 }}>{regError}</div>}

          <button onClick={handleSubmit} disabled={regBusy} style={{ width: "100%", background: COLORS.willow, color: "#fff", border: "none", borderRadius: 8, padding: "10px", fontSize: 14, fontWeight: 600, cursor: regBusy ? "default" : "pointer" }}>
            {regBusy ? "Submitting…" : "Register & request approval"}
          </button>
        </div>
        <div style={{ fontSize: 11, color: "#9BAE9E", textAlign: "center", marginTop: 12 }}>
          Your admin needs to approve you before you can log in.
        </div>
      </div>
    </div>
  );
}

function DailyLog({ selectedDate, setSelectedDate, players, dayData, toggleVote, setDayField, activeMonth, isLocked, weekendExceptions, addWeekendException, removeWeekendException, photos, onViewPhoto, notifyPendingVotesNudge, onNetsLiveStarted, onNetsLiveStopped, teamName }) {
  const [copied, setCopied] = useState(false);
  const [showFullDates, setShowFullDates] = useState(false);
  const [showAllPlayers, setShowAllPlayers] = useState(false);
  const [showAddSpecial, setShowAddSpecial] = useState(false);
  const [specialDateInput, setSpecialDateInput] = useState("");
  const [specialError, setSpecialError] = useState("");
  const [showLiveModal, setShowLiveModal] = useState(false);
  const today = todayISO();
  const n = daysInMonth(activeMonth);
  const monthExceptions = Object.keys(weekendExceptions || {}).filter((iso) => iso.startsWith(activeMonth)).sort();
  const dateOptions = Array.from({ length: n }, (_, i) => `${activeMonth}-${String(i + 1).padStart(2, "0")}`)
    .filter((iso) => !isWeekend(iso) || weekendExceptions[iso])
    .sort();
  const votedIds = dayData.votes || [];
  const declinedIds = dayData.declined || [];
  const declinedPlayers = players.filter((p) => declinedIds.includes(p.id));
  // Genuinely no response yet — excludes anyone who already declined, so
  // the reminder below (and this count) doesn't nag someone who's already
  // told the app they can't make it.
  const pendingPlayers = players.filter((p) => !votedIds.includes(p.id) && !declinedIds.includes(p.id));

  const selectedIdx = Math.max(0, dateOptions.indexOf(selectedDate));
  const compactStart = Math.min(selectedIdx, Math.max(0, dateOptions.length - 4));
  const compactDates = dateOptions.slice(compactStart, compactStart + 4);

  const PREVIEW_COUNT = 3;
  const previewPlayers = players.slice(0, PREVIEW_COUNT);
  const overflowCount = players.length - PREVIEW_COUNT;

  function buildPendingVotesMessage() {
    const lines = [
      `🏏 Please confirm attendance for nets on ${fmtDateLong(selectedDate)}:`,
      "",
      ...pendingPlayers.map((p) => `• ${p.name}`),
    ];
    if (declinedPlayers.length > 0) {
      lines.push("", `(${declinedPlayers.length} other${declinedPlayers.length === 1 ? "" : "s"} already said they can't make it)`);
    }
    return lines.join("\n");
  }
  async function handleCopyPendingVotes() {
    const ok = await copyText(buildPendingVotesMessage());
    setCopied(ok);
    if (ok) setTimeout(() => setCopied(false), 2000);
    if (notifyPendingVotesNudge) notifyPendingVotesNudge(pendingPlayers.map((p) => p.id), selectedDate);
  }

  function handleAddSpecial() {
    setSpecialError("");
    if (!specialDateInput) { setSpecialError("Pick a date first."); return; }
    if (!specialDateInput.startsWith(activeMonth)) { setSpecialError(`Pick a date within ${monthLabel(activeMonth)}.`); return; }
    if (!isWeekend(specialDateInput)) { setSpecialError("That's a weekday already on the schedule — pick a Saturday or Sunday."); return; }
    addWeekendException(specialDateInput);
    setSelectedDate(specialDateInput);
    setSpecialDateInput("");
    setShowAddSpecial(false);
  }

  return (
    <div>
      {isLocked && (
        <div style={{ background: "#FAEEDA", color: "#633806", borderRadius: 10, padding: "10px 14px", fontSize: 12, marginBottom: 14, display: "flex", alignItems: "center", gap: 6 }}>
          <Icon size={13}>🔒</Icon> This month is locked. Unlock it from the Summary tab to make changes.
        </div>
      )}
      <div style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: 16, marginBottom: 14 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontSize: 15, fontWeight: 600 }}>{fmtDateShort(selectedDate)}</span>
            {dayData.liveMeetingId && (
              <span style={{ fontSize: 11, fontWeight: 700, background: "#D62828", color: "#fff", padding: "3px 9px", borderRadius: 20 }}>🔴 LIVE</span>
            )}
          </div>
          <button onClick={() => setShowFullDates((v) => !v)} style={{ background: "transparent", border: "none", color: COLORS.inkSoft, fontSize: 12, cursor: "pointer", display: "flex", alignItems: "center", gap: 4 }}>
            {showFullDates ? "Show less" : "Week view"} <Icon size={12}>{showFullDates ? "←" : "→"}</Icon>
          </button>
        </div>

        {!showFullDates ? (
          <div style={{ display: "flex", gap: 8 }}>
            {compactDates.map((iso) => {
              const d = new Date(iso + "T00:00:00");
              const wk = d.toLocaleDateString("en-IN", { weekday: "short" }).toUpperCase();
              const dayNum = d.getDate();
              const active = iso === selectedDate;
              const special = !!weekendExceptions[iso];
              return (
                <button key={iso} onClick={() => setSelectedDate(iso)} className="chip" style={{
                  flex: 1, cursor: "pointer", border: special && !active ? `1px dashed ${COLORS.willow}` : "none",
                  background: active ? COLORS.leather : COLORS.line, color: active ? "#fff" : COLORS.ink,
                  borderRadius: 10, padding: "8px 4px", textAlign: "center", position: "relative",
                }}>
                  <div style={{ fontSize: 10, opacity: active ? 0.85 : 0.6 }}>{wk}{special ? " 🏏" : ""}</div>
                  <div style={{ fontSize: 15, fontWeight: 600, marginTop: 2 }}>{dayNum}</div>
                </button>
              );
            })}
          </div>
        ) : (
          <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 4 }}>
            {dateOptions.map((iso) => (
              <button key={iso} onClick={() => setSelectedDate(iso)} className="chip" style={{
                flex: "0 0 auto", cursor: "pointer", border: `1px solid ${iso === selectedDate ? COLORS.leather : (weekendExceptions[iso] ? COLORS.willow : COLORS.line)}`,
                borderStyle: weekendExceptions[iso] && iso !== selectedDate ? "dashed" : "solid",
                background: iso === selectedDate ? COLORS.leather : "#fff", color: iso === selectedDate ? "#fff" : COLORS.ink,
                borderRadius: 8, padding: "6px 10px", fontSize: 12, whiteSpace: "nowrap",
              }}>
                {fmtDateShort(iso)}{weekendExceptions[iso] ? " 🏏" : ""}
              </button>
            ))}
          </div>
        )}

        {!isLocked && (
          <div style={{ marginTop: 10 }}>
            {!showAddSpecial ? (
              <button onClick={() => setShowAddSpecial(true)} style={{ width: "100%", background: "transparent", border: `1px dashed ${COLORS.willow}`, color: COLORS.leather, borderRadius: 10, padding: "9px", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
                + Add a special match day (weekend)
              </button>
            ) : (
              <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: 12 }}>
                <div style={{ fontSize: 12, color: COLORS.inkSoft, marginBottom: 8 }}>Pick a Saturday or Sunday in {monthLabel(activeMonth)}:</div>
                <div style={{ display: "flex", gap: 8 }}>
                  <input
                    type="date"
                    value={specialDateInput}
                    min={`${activeMonth}-01`}
                    max={`${activeMonth}-${String(n).padStart(2, "0")}`}
                    onChange={(e) => { setSpecialDateInput(e.target.value); setSpecialError(""); }}
                    style={{ flex: 1, border: `1px solid ${COLORS.line}`, borderRadius: 8, padding: "8px 10px", fontSize: 13 }}
                  />
                  <button onClick={handleAddSpecial} style={{ background: COLORS.leather, color: "#fff", border: "none", borderRadius: 8, padding: "8px 14px", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>Add</button>
                  <button onClick={() => { setShowAddSpecial(false); setSpecialError(""); }} style={{ background: "transparent", border: `1px solid ${COLORS.line}`, borderRadius: 8, padding: "8px 12px", fontSize: 12, cursor: "pointer" }}>Cancel</button>
                </div>
                {specialError && <div style={{ color: COLORS.leather, fontSize: 11, marginTop: 8 }}>{specialError}</div>}
                {monthExceptions.length > 0 && (
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 10 }}>
                    {monthExceptions.map((iso) => (
                      <span key={iso} style={{ display: "flex", alignItems: "center", gap: 4, background: "#EEEAD9", borderRadius: 20, padding: "4px 8px 4px 10px", fontSize: 11 }}>
                        {fmtDateShort(iso)}
                        <button onClick={() => removeWeekendException(iso)} style={{ background: "transparent", border: "none", cursor: "pointer", color: COLORS.inkSoft, padding: 0, fontSize: 13, lineHeight: 1 }}>×</button>
                      </span>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>
        )}
      </div>

      {dayData.liveMeetingId ? (
        <div style={{ marginBottom: 14 }}>
          <LiveViewer meetingId={dayData.liveMeetingId} />
          <button
            onClick={() => onNetsLiveStopped && onNetsLiveStopped(selectedDate)}
            style={{ width: "100%", background: "transparent", border: `1px solid ${COLORS.leather}`, color: COLORS.leather, borderRadius: 8, padding: "9px", fontSize: 12, fontWeight: 600, cursor: "pointer" }}
          >
            ⏹ End live broadcast
          </button>
        </div>
      ) : (
        selectedDate === today && onNetsLiveStarted && (
          <button
            onClick={() => setShowLiveModal(true)}
            style={{ width: "100%", background: "#D62828", color: "#fff", border: "none", borderRadius: 10, padding: "12px", fontSize: 13, fontWeight: 700, cursor: "pointer", marginBottom: 14, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}
          >
            🔴 Go Live
          </button>
        )
      )}
      {showLiveModal && (
        <LiveBroadcastModal
          matchLabel={`Nets session · ${fmtDateShort(selectedDate)}`}
          broadcasterId={null}
          broadcasterName={teamName || "Admin"}
          onClose={() => setShowLiveModal(false)}
          onStarted={(meetingId) => onNetsLiveStarted(selectedDate, meetingId, null)}
          onStopped={() => onNetsLiveStopped && onNetsLiveStopped(selectedDate)}
        />
      )}

      <div style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: 16, marginBottom: 14 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <span style={{ fontSize: 13, color: COLORS.inkSoft }}>Attendance</span>
          {pendingPlayers.length > 0 && (
            <span style={{ fontSize: 11, background: "#FAEEDA", color: "#854F0B", padding: "3px 10px", borderRadius: 20 }}>
              {pendingPlayers.length} not confirmed
            </span>
          )}
        </div>
        {players.length === 0 ? (
          <div style={{ fontSize: 13, color: COLORS.inkSoft }}>Add players in the Players tab first.</div>
        ) : (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {(showAllPlayers ? players : previewPlayers).map((p) => {
              const voted = votedIds.includes(p.id);
              return (
                <button key={p.id} onClick={() => !isLocked && toggleVote(p.id)} disabled={isLocked} className="chip" style={{
                  cursor: isLocked ? "not-allowed" : "pointer", borderRadius: 20, padding: "5px 12px 5px 5px", fontSize: 13,
                  border: `1px solid ${voted ? COLORS.willow : COLORS.line}`,
                  background: voted ? COLORS.willow : "transparent", color: voted ? "#fff" : COLORS.ink,
                  display: "flex", alignItems: "center", gap: 7, opacity: isLocked ? 0.6 : 1,
                }}>
                  <PlayerAvatar name={p.name} photo={photos && photos[p.id]} size={22} border={false} onView={photos && photos[p.id] && onViewPhoto ? () => onViewPhoto(p.name, photos[p.id]) : undefined} />
                  {voted ? <Icon size={13}>✓</Icon> : null}{p.name}
                </button>
              );
            })}
            {overflowCount > 0 && (
              <button onClick={() => setShowAllPlayers((v) => !v)} className="chip" style={{
                cursor: "pointer", borderRadius: 20, padding: "6px 12px", fontSize: 13,
                border: "none", background: "#EEEAD9", color: COLORS.inkSoft,
              }}>
                {showAllPlayers ? "← Show less" : `+${overflowCount} more`}
              </button>
            )}
          </div>
        )}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 10, flexWrap: "wrap", gap: 6 }}>
          <div className="mono" style={{ fontSize: 12, color: COLORS.inkSoft }}>
            {votedIds.length} of {players.length} confirmed
            {declinedPlayers.length > 0 && <span style={{ color: "#9A3634" }}> · {declinedPlayers.length} not available</span>}
          </div>
          {pendingPlayers.length > 0 && (
            <div style={{ display: "flex", gap: 6 }}>
              <button onClick={handleCopyPendingVotes} style={{
                display: "flex", alignItems: "center", gap: 5, background: "transparent",
                border: `1px solid ${COLORS.willow}`, color: COLORS.willow, borderRadius: 8,
                padding: "4px 9px", fontSize: 11, fontWeight: 600, cursor: "pointer",
              }}>
                {copied ? <Icon size={12}>✅</Icon> : <Icon size={12}>🔔</Icon>}
                {copied ? "Copied!" : "Nudge pending"}
              </button>
              <WhatsAppShareLink text={buildPendingVotesMessage()} style={{ gap: 5, padding: "4px 9px", fontSize: 11 }}>
                <Icon size={12}>💬</Icon> Share
              </WhatsAppShareLink>
            </div>
          )}
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
        <div style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: 16 }}>
          <div style={{ fontSize: 12, color: COLORS.inkSoft, marginBottom: 8 }}>Net hours used</div>
          <input
            type="text" inputMode="decimal" disabled={isLocked}
            value={dayData.hours ?? 0}
            onChange={(e) => setDayField("hours", sanitizeDecimalInput(e.target.value))}
            onBlur={(e) => setDayField("hours", String(Number(e.target.value) || 0))}
            style={{ ...inputStyle, opacity: isLocked ? 0.6 : 1 }}
          />
        </div>
        <div style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: 16 }}>
          <div style={{ fontSize: 12, color: COLORS.inkSoft, marginBottom: 8 }}>New balls used</div>
          <input
            type="text" inputMode="numeric" disabled={isLocked}
            value={dayData.balls ?? 0}
            onChange={(e) => setDayField("balls", sanitizeIntegerInput(e.target.value))}
            onBlur={(e) => setDayField("balls", String(Number(e.target.value) || 0))}
            style={{ ...inputStyle, opacity: isLocked ? 0.6 : 1 }}
          />
        </div>
      </div>
      <div style={{ fontSize: 11, color: COLORS.inkSoft, marginTop: 8, textAlign: "center" }}>
        {isLocked ? "Editing is disabled for locked months." : `Saved automatically for ${fmtDateShort(selectedDate)} as soon as you type — no save button needed.`}
      </div>
    </div>
  );
}

function SubscriptionTab({ players, monthSubPlayers, toggleSub, activeMonth, totals, monthPayments, togglePaid, rates, isLocked, photos, onViewPhoto, notifySubReminderNudge }) {
  const [copied, setCopied] = useState(false);
  const [showAllPlayers, setShowAllPlayers] = useState(false);
  const [showAllPaid, setShowAllPaid] = useState(false);
  const pendingPlayers = monthSubPlayers.filter((pid) => !monthPayments[pid]);
  const PREVIEW_COUNT = 3;
  const previewPlayers = players.slice(0, PREVIEW_COUNT);
  const overflowCount = players.length - PREVIEW_COUNT;
  const PAID_PREVIEW_ROWS = 5;
  const shownSubPlayers = showAllPaid ? monthSubPlayers : monthSubPlayers.slice(0, PAID_PREVIEW_ROWS);
  const paidOverflow = monthSubPlayers.length - PAID_PREVIEW_ROWS;

  function buildReminderText() {
    const lines = [];
    lines.push(`🏏 *Nets Fee Reminder — ${monthLabel(activeMonth)}*`);
    lines.push("");
    if (pendingPlayers.length === 0) {
      lines.push("Everyone's paid up. Nothing pending!");
    } else {
      pendingPlayers.forEach((pid) => {
        const p = players.find((pl) => pl.id === pid);
        if (p) lines.push(`⏳ ${p.name}: ${fmtINR(rates.subAmount)}`);
      });
      lines.push("—————————————");
      lines.push(`Total pending: ${fmtINR(pendingPlayers.length * rates.subAmount)}`);
      lines.push("");
      lines.push("Please settle up soon so we can pay the nets and ball fees on time. Thanks!");
    }
    return lines.join("\n");
  }

  async function handleCopyReminder() {
    const ok = await copyText(buildReminderText());
    setCopied(ok);
    if (ok) setTimeout(() => setCopied(false), 2000);
    if (notifySubReminderNudge) notifySubReminderNudge(pendingPlayers);
  }

  return (
    <div>
      {isLocked && (
        <div style={{ background: "#FAEEDA", color: "#633806", borderRadius: 10, padding: "10px 14px", fontSize: 12, marginBottom: 14, display: "flex", alignItems: "center", gap: 6 }}>
          <Icon size={13}>🔒</Icon> This month is locked. Unlock it from the Summary tab to make changes.
        </div>
      )}
      <div style={{ fontSize: 11, letterSpacing: 1, textTransform: "uppercase", color: COLORS.inkSoft, marginBottom: 4 }}>
        {monthLabel(activeMonth)} subscription — ₹{rates.subAmount} per player
      </div>
      <div style={{ fontSize: 13, color: COLORS.inkSoft, marginBottom: 14 }}>Players opt in from Player Sign-in. Mark who's actually handed over the cash below.</div>
      {players.length === 0 ? (
        <div style={{ fontSize: 13, color: COLORS.inkSoft }}>Add players in the Players tab first.</div>
      ) : (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 18 }}>
          {(showAllPlayers ? players : previewPlayers).map((p) => {
            const inSub = monthSubPlayers.includes(p.id);
            return (
              <button key={p.id} onClick={() => !isLocked && toggleSub(p.id)} disabled={isLocked} className="chip" style={{
                cursor: isLocked ? "not-allowed" : "pointer", borderRadius: 20, padding: "5px 12px 5px 5px", fontSize: 13,
                border: `1px solid ${inSub ? COLORS.leather : COLORS.line}`,
                background: inSub ? COLORS.leather : "transparent", color: inSub ? "#fff" : COLORS.ink,
                display: "flex", alignItems: "center", gap: 7, opacity: isLocked ? 0.6 : 1,
              }}>
                <PlayerAvatar name={p.name} photo={photos && photos[p.id]} size={22} border={false} onView={photos && photos[p.id] && onViewPhoto ? () => onViewPhoto(p.name, photos[p.id]) : undefined} />
                {inSub ? <Icon size={13}>✓</Icon> : null}{p.name}
              </button>
            );
          })}
          {overflowCount > 0 && (
            <button onClick={() => setShowAllPlayers((v) => !v)} className="chip" style={{
              cursor: "pointer", borderRadius: 20, padding: "6px 12px", fontSize: 13,
              border: "none", background: "#EEEAD9", color: COLORS.inkSoft,
            }}>
              {showAllPlayers ? "← Show less" : `+${overflowCount} more`}
            </button>
          )}
        </div>
      )}

      {monthSubPlayers.length > 0 && (
        <div style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: 16, marginBottom: 18 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <div style={{ fontSize: 11, letterSpacing: 1, textTransform: "uppercase", color: COLORS.inkSoft }}>Payment status</div>
            {pendingPlayers.length > 0 && (
              <div style={{ display: "flex", gap: 6 }}>
                <button onClick={handleCopyReminder} style={{
                  display: "flex", alignItems: "center", gap: 5, background: "transparent",
                  border: `1px solid ${COLORS.willow}`, color: COLORS.willow, borderRadius: 8,
                  padding: "5px 10px", fontSize: 11, fontWeight: 600, cursor: "pointer",
                }}>
                  {copied ? <Icon size={13}>✅</Icon> : <Icon size={13}>🔔</Icon>}
                  {copied ? "Copied!" : `Copy (${pendingPlayers.length})`}
                </button>
                <WhatsAppShareLink text={buildReminderText()} style={{ gap: 5, padding: "5px 10px", fontSize: 11 }}>
                  <Icon size={13}>💬</Icon> Share
                </WhatsAppShareLink>
              </div>
            )}
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {shownSubPlayers.map((pid) => {
              const p = players.find((pl) => pl.id === pid);
              if (!p) return null;
              const paid = !!monthPayments[pid];
              return (
                <div key={pid} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0", borderBottom: `1px solid ${COLORS.line}` }}>
                  <span style={{ fontSize: 14, display: "flex", alignItems: "center", gap: 8 }}>
                    <PlayerAvatar name={p.name} photo={photos && photos[p.id]} size={24} border={false} onView={photos && photos[p.id] && onViewPhoto ? () => onViewPhoto(p.name, photos[p.id]) : undefined} />
                    {p.name}
                  </span>
                  <button onClick={() => !isLocked && togglePaid(pid)} disabled={isLocked} className="chip" style={{
                    cursor: isLocked ? "not-allowed" : "pointer", borderRadius: 20, padding: "5px 12px", fontSize: 12, fontWeight: 600,
                    border: `1px solid ${paid ? "#5C8A63" : COLORS.willow}`,
                    background: paid ? "#5C8A63" : "transparent",
                    color: paid ? "#fff" : COLORS.willow,
                    display: "flex", alignItems: "center", gap: 6, opacity: isLocked ? 0.6 : 1,
                  }}>
                    {paid ? <Icon size={12}>✓</Icon> : null}
                    {paid ? `Paid ${fmtINR(monthPayments[pid])}` : "Mark as paid"}
                  </button>
                </div>
              );
            })}
            {paidOverflow > 0 && (
              <button onClick={() => setShowAllPaid((v) => !v)} style={{ width: "100%", background: "transparent", border: `1px dashed ${COLORS.line}`, color: COLORS.inkSoft, borderRadius: 8, padding: "8px", fontSize: 12, cursor: "pointer" }}>
                {showAllPaid ? "Show less" : `Show all ${monthSubPlayers.length}`}
              </button>
            )}
          </div>
        </div>
      )}

      <div style={{ background: COLORS.pitch, color: COLORS.cream, borderRadius: 12, padding: 16, display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
        <div>
          <div style={{ fontSize: 13 }}>{monthSubPlayers.length} subscribed player{monthSubPlayers.length === 1 ? "" : "s"}</div>
          {totals.pending > 0 && <div style={{ fontSize: 12, color: "#F0C199", marginTop: 2 }}>{fmtINR(totals.pending)} still pending</div>}
        </div>
        <div className="scorenum" style={{ fontSize: 24 }}>{fmtINR(totals.collected)} <span style={{ fontSize: 13, opacity: 0.6 }}>/ {fmtINR(totals.expected)}</span></div>
      </div>
    </div>
  );
}

function PlayersTab({ players, newPlayerName, setNewPlayerName, addPlayer, removePlayer, pins, resetPlayerPin, playerError, setPlayerError, pendingRegistrations, approveRegistration, rejectRegistration, photos, removePlayerVideo, teamCode, playerPinResetRequests, dismissPlayerPinResetRequest, updatePlayerDob, makeFullMember }) {
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [confirmResetId, setConfirmResetId] = useState(null);
  const [approveError, setApproveError] = useState({});
  const [busyId, setBusyId] = useState(null);
  const [viewingPhoto, setViewingPhoto] = useState(null);
  const [viewingClip, setViewingClip] = useState(null); // player object | null
  const [inviteCopied, setInviteCopied] = useState(false);
  const [editingDobId, setEditingDobId] = useState(null);
  const [dobDraft, setDobDraft] = useState("");
  const [showAllRoster, setShowAllRoster] = useState(false);

  const pendingList = Object.values(pendingRegistrations || {}).sort((a, b) => a.submittedAt.localeCompare(b.submittedAt));
  const resetRequestList = Object.values(playerPinResetRequests || {}).sort((a, b) => a.requestedAt.localeCompare(b.requestedAt));
  const inviteLink = typeof window !== "undefined" ? `${window.location.origin}${window.location.pathname}?team=${teamCode}` : "";
  // Same preview+expand shape as MatchCard's "Who actually played"/payment
  // lists — full detail rows here (avatar, lock, reset/delete, birthday,
  // clips), so a smaller cap than the compact chip grids elsewhere.
  const ROSTER_PREVIEW_ROWS = 5;
  const shownRoster = showAllRoster ? players : players.slice(0, ROSTER_PREVIEW_ROWS);
  const rosterOverflow = players.length - ROSTER_PREVIEW_ROWS;

  async function handleApprove(id) {
    setBusyId(id);
    const res = await approveRegistration(id);
    setBusyId(null);
    if (!res.ok) {
      setApproveError((prev) => ({ ...prev, [id]: res.error }));
    } else {
      setApproveError((prev) => { const next = { ...prev }; delete next[id]; return next; });
    }
  }

  async function handleCopyInvite() {
    const ok = await copyText(inviteLink);
    setInviteCopied(ok);
    if (ok) setTimeout(() => setInviteCopied(false), 2000);
  }
  const inviteMessage = `🏏 Join our team on Pavilion — tap to sign in:\n${inviteLink}`;

  return (
    <>
    <div>
      <div style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: 16, marginBottom: 20 }}>
        <div style={{ fontSize: 11, letterSpacing: 1, textTransform: "uppercase", color: COLORS.inkSoft, marginBottom: 8 }}>Invite players</div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <div className="mono" style={{ flex: 1, fontSize: 11, color: COLORS.ink, background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 8, padding: "8px 10px", overflowX: "auto", whiteSpace: "nowrap" }}>
            {inviteLink}
          </div>
          <button onClick={handleCopyInvite} style={{ background: COLORS.willow, color: "#fff", border: "none", borderRadius: 8, padding: "8px 12px", fontSize: 11.5, fontWeight: 600, cursor: "pointer", flexShrink: 0 }}>
            {inviteCopied ? "✓ Copied" : "Copy"}
          </button>
          <WhatsAppShareLink text={inviteMessage} style={{ padding: "8px 12px", fontSize: 11.5, flexShrink: 0, gap: 5 }}>
            💬 Share
          </WhatsAppShareLink>
        </div>
        <div style={{ fontSize: 11, color: COLORS.inkSoft, marginTop: 8 }}>
          Share this in your team's WhatsApp group — tapping it opens straight to sign-in, no code to type.
        </div>
      </div>

      {resetRequestList.length > 0 && (
        <div style={{ marginBottom: 20 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <span style={{ fontSize: 12, color: COLORS.inkSoft, fontWeight: 600 }}>PIN reset requests</span>
            <span style={{ fontSize: 11, background: "#FAEEDA", color: "#854F0B", padding: "3px 10px", borderRadius: 20 }}>{resetRequestList.length} pending</span>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {resetRequestList.map((req) => (
              <div key={req.id} style={{ background: "#fff", border: `1px dashed ${COLORS.willow}`, borderRadius: 12, padding: 12, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, flexWrap: "wrap" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <PlayerAvatar name={req.playerName} photo={photos && photos[req.playerId]} size={30} border={false} />
                  <div>
                    <div style={{ fontSize: 13, fontWeight: 600 }}>{req.playerName}</div>
                    <div style={{ fontSize: 10, color: COLORS.inkSoft }}>requested a PIN reset · {timeAgo(req.requestedAt)}</div>
                  </div>
                </div>
                <div style={{ display: "flex", gap: 6 }}>
                  <button onClick={() => resetPlayerPin(req.playerId)} style={{ background: COLORS.willow, color: "#fff", border: "none", borderRadius: 6, padding: "6px 10px", fontSize: 11, fontWeight: 600, cursor: "pointer" }}>
                    Reset
                  </button>
                  <button onClick={() => dismissPlayerPinResetRequest(req.id)} style={{ background: "transparent", border: `1px solid ${COLORS.line}`, borderRadius: 6, padding: "6px 10px", fontSize: 11, color: COLORS.inkSoft, cursor: "pointer" }}>
                    Dismiss
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {pendingList.length > 0 && (
        <div style={{ marginBottom: 20 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <span style={{ fontSize: 12, color: COLORS.inkSoft, fontWeight: 600 }}>Registration requests</span>
            <span style={{ fontSize: 11, background: "#FAEEDA", color: "#854F0B", padding: "3px 10px", borderRadius: 20 }}>{pendingList.length} pending</span>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {pendingList.map((req) => (
              <div key={req.id} style={{ background: "#fff", border: `1px dashed ${COLORS.willow}`, borderRadius: 12, padding: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <PlayerAvatar name={req.name} photo={req.photo} size={36} border={false} onView={req.photo ? () => setViewingPhoto({ name: req.name, photo: req.photo }) : undefined} />
                    <div>
                      <div style={{ fontSize: 13, fontWeight: 600 }}>{req.name}</div>
                      <div style={{ fontSize: 10, color: COLORS.inkSoft }}>{timeAgo(req.submittedAt)}{!req.photo ? " · No photo" : ""}</div>
                    </div>
                  </div>
                  <div style={{ display: "flex", gap: 6 }}>
                    <button onClick={() => handleApprove(req.id)} disabled={busyId === req.id} style={{ background: COLORS.leather, color: "#fff", border: "none", borderRadius: 6, padding: "6px 10px", fontSize: 11, fontWeight: 600, cursor: "pointer" }}>
                      {busyId === req.id ? "…" : "Approve"}
                    </button>
                    <button onClick={() => rejectRegistration(req.id)} style={{ background: "transparent", border: `1px solid ${COLORS.line}`, borderRadius: 6, padding: "6px 10px", fontSize: 11, color: COLORS.inkSoft, cursor: "pointer" }}>
                      Reject
                    </button>
                  </div>
                </div>
                {approveError[req.id] && (
                  <div style={{ marginTop: 8, fontSize: 11, color: COLORS.leather, background: "#FCEBEA", borderRadius: 6, padding: "6px 8px" }}>
                    {approveError[req.id]}
                  </div>
                )}
              </div>
            ))}
          </div>
          <div style={{ fontSize: 11, color: COLORS.inkSoft, marginTop: 10 }}>
            Approving adds them to your player list immediately — they can log in right after.
          </div>
        </div>
      )}

      <div style={{ display: "flex", gap: 8, marginBottom: playerError ? 8 : 16 }}>
        <input
          value={newPlayerName}
          onChange={(e) => { setNewPlayerName(e.target.value); if (playerError) setPlayerError(""); }}
          onKeyDown={(e) => e.key === "Enter" && addPlayer()}
          placeholder="Player name"
          style={{ ...inputStyle, flex: 1 }}
        />
        <button onClick={addPlayer} style={{ background: COLORS.leather, color: "#fff", border: "none", borderRadius: 8, padding: "0 16px", display: "flex", alignItems: "center", gap: 6, cursor: "pointer", fontWeight: 600, fontSize: 13 }}>
          <Icon size={16}>+</Icon> Add
        </button>
      </div>
      {playerError && (
        <div style={{ background: "#FCEBEA", color: COLORS.leather, borderRadius: 8, padding: "8px 12px", fontSize: 12, marginBottom: 16 }}>
          {playerError}
        </div>
      )}
      {players.length === 0 ? (
        <div style={{ fontSize: 13, color: COLORS.inkSoft }}>No players yet. Add your squad above.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {shownRoster.map((p) => (
            <div key={p.id} style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: "10px 14px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <span style={{ fontSize: 14, display: "flex", alignItems: "center", gap: 8 }}>
                  <PlayerAvatar name={p.name} photo={photos && photos[p.id]} size={22} border={false} onView={photos && photos[p.id] ? () => setViewingPhoto({ name: p.name, photo: photos[p.id] }) : undefined} />
                  {p.name}
                  {pins[p.id] && <Icon size={12} color={COLORS.inkSoft}>🔒</Icon>}
                  {p.guest && (
                    <span className="mono" style={{ fontSize: 9.5, fontWeight: 700, letterSpacing: 0.3, textTransform: "uppercase", background: "#E4C79A", color: COLORS.leather, padding: "2px 7px", borderRadius: 20 }}>
                      Guest
                    </span>
                  )}
                </span>
                <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
                  {p.guest && makeFullMember && (
                    <button
                      onClick={() => makeFullMember(p.id)}
                      style={{ background: "transparent", border: `1px solid ${COLORS.willow}`, color: COLORS.willow, borderRadius: 6, padding: "4px 8px", fontSize: 10.5, fontWeight: 700, cursor: "pointer" }}
                    >
                      Make full member
                    </button>
                  )}
                  {pins[p.id] && (
                    <button
                      onClick={() => { setConfirmResetId(confirmResetId === p.id ? null : p.id); setConfirmDeleteId(null); }}
                      title="Reset PIN"
                      style={{ background: "transparent", border: "none", color: COLORS.inkSoft, cursor: "pointer", padding: 4 }}
                    >
                      <Icon size={16}>🔑</Icon>
                    </button>
                  )}
                  <button
                    onClick={() => { setConfirmDeleteId(confirmDeleteId === p.id ? null : p.id); setConfirmResetId(null); }}
                    style={{ background: "transparent", border: "none", color: COLORS.inkSoft, cursor: "pointer", padding: 4 }}
                  >
                    <Icon size={16}>🗑</Icon>
                  </button>
                </div>
              </div>

              {updatePlayerDob && (
                editingDobId === p.id ? (
                  <div style={{ display: "flex", alignItems: "flex-start", gap: 8, marginTop: 8, paddingTop: 8, borderTop: `1px solid ${COLORS.line}` }}>
                    <div style={{ flex: 1 }}>
                      <DobField value={dobDraft} onChange={setDobDraft} maxDate={todayISO()} compact />
                    </div>
                    <button
                      onClick={() => { updatePlayerDob(p.id, dobDraft); setEditingDobId(null); }}
                      style={{ background: COLORS.willow, color: "#fff", border: "none", borderRadius: 6, padding: "6px 10px", fontSize: 11, fontWeight: 600, cursor: "pointer" }}
                    >
                      Save
                    </button>
                    <button
                      onClick={() => setEditingDobId(null)}
                      style={{ background: "transparent", border: `1px solid ${COLORS.line}`, borderRadius: 6, padding: "6px 10px", fontSize: 11, cursor: "pointer" }}
                    >
                      Cancel
                    </button>
                  </div>
                ) : (
                  <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 8, paddingTop: 8, borderTop: `1px solid ${COLORS.line}`, fontSize: 11 }}>
                    {p.dob ? (
                      <>
                        <span className="mono" style={{ color: COLORS.inkSoft }}>🎂 {fmtBirthdayShort(p.dob)}</span>
                        <button
                          onClick={() => { setEditingDobId(p.id); setDobDraft(p.dob || ""); }}
                          style={{ background: "transparent", border: "none", color: COLORS.willow, textDecoration: "underline", cursor: "pointer", padding: 0, fontSize: 11 }}
                        >
                          Edit
                        </button>
                      </>
                    ) : (
                      <button
                        onClick={() => { setEditingDobId(p.id); setDobDraft(""); }}
                        style={{ background: "transparent", border: "none", color: COLORS.leather, textDecoration: "underline", cursor: "pointer", padding: 0, fontSize: 11 }}
                      >
                        + Add birthday
                      </button>
                    )}
                  </div>
                )
              )}

              {(p.battingVideoUrl || p.bowlingVideoUrl) && (
                <div style={{ marginTop: 8, display: "flex", flexDirection: "column", gap: 6, paddingTop: 8, borderTop: `1px solid ${COLORS.line}` }}>
                  {[
                    { slotType: "Batting", url: p.battingVideoUrl, label: "🏏 Batting" },
                    { slotType: "Bowling", url: p.bowlingVideoUrl, label: "🎯 Bowling" },
                  ].filter((s) => s.url).map((s) => (
                    <div key={s.slotType} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <span style={{ fontSize: 11, background: "#EEEAD9", color: COLORS.inkSoft, padding: "2px 8px", borderRadius: 10 }}>
                        {s.label}
                      </span>
                      <button onClick={() => setViewingClip({ player: p, slotType: s.slotType })} style={{ background: "transparent", border: "none", color: COLORS.willow, fontSize: 11, fontWeight: 600, textDecoration: "underline", cursor: "pointer", padding: 0 }}>
                        ▶ View
                      </button>
                      {removePlayerVideo && (
                        <button onClick={() => removePlayerVideo(p.id, s.slotType)} style={{ background: "transparent", border: "none", color: COLORS.leather, fontSize: 11, textDecoration: "underline", cursor: "pointer", padding: 0 }}>
                          Remove
                        </button>
                      )}
                    </div>
                  ))}
                </div>
              )}

              {confirmResetId === p.id && (
                <div style={{ marginTop: 10, background: "#FFF6E8", borderRadius: 8, padding: 10, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
                  <span style={{ fontSize: 12, color: COLORS.inkSoft }}>Clear {p.name}'s PIN? They'll set a new one at next sign-in.</span>
                  <div style={{ display: "flex", gap: 6 }}>
                    <button onClick={() => setConfirmResetId(null)} style={{ background: "transparent", border: `1px solid ${COLORS.line}`, borderRadius: 6, padding: "4px 8px", fontSize: 11, cursor: "pointer" }}>Cancel</button>
                    <button onClick={() => { resetPlayerPin(p.id); setConfirmResetId(null); }} style={{ background: COLORS.willow, color: "#fff", border: "none", borderRadius: 6, padding: "4px 8px", fontSize: 11, fontWeight: 600, cursor: "pointer" }}>Reset</button>
                  </div>
                </div>
              )}

              {confirmDeleteId === p.id && (
                <div style={{ marginTop: 10, background: "#FCEBEA", borderRadius: 8, padding: 10, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, flexWrap: "wrap" }}>
                  <span style={{ fontSize: 12, color: COLORS.leather, display: "flex", alignItems: "center", gap: 5 }}>
                    <Icon size={13}>⚠</Icon> Removes {p.name} and all their votes/payment history. This can't be undone.
                  </span>
                  <div style={{ display: "flex", gap: 6 }}>
                    <button onClick={() => setConfirmDeleteId(null)} style={{ background: "transparent", border: `1px solid ${COLORS.line}`, borderRadius: 6, padding: "4px 8px", fontSize: 11, cursor: "pointer" }}>Cancel</button>
                    <button onClick={() => { removePlayer(p.id); setConfirmDeleteId(null); }} style={{ background: COLORS.leather, color: "#fff", border: "none", borderRadius: 6, padding: "4px 8px", fontSize: 11, fontWeight: 600, cursor: "pointer" }}>Remove</button>
                  </div>
                </div>
              )}
            </div>
          ))}
          {rosterOverflow > 0 && (
            <button onClick={() => setShowAllRoster((v) => !v)} style={{ width: "100%", background: "transparent", border: `1px dashed ${COLORS.line}`, color: COLORS.inkSoft, borderRadius: 8, padding: "8px", fontSize: 12, cursor: "pointer" }}>
              {showAllRoster ? "Show less" : `Show all ${players.length}`}
            </button>
          )}
        </div>
      )}
    </div>
    {viewingPhoto && <PhotoViewerModal name={viewingPhoto.name} photo={viewingPhoto.photo} preserveAspect={viewingPhoto.preserveAspect} onClose={() => setViewingPhoto(null)} />}
    {viewingClip && <ClipViewerModal playerName={viewingClip.player.name} tag={viewingClip.slotType} url={viewingClip.slotType === "Bowling" ? viewingClip.player.bowlingVideoUrl : viewingClip.player.battingVideoUrl} onClose={() => setViewingClip(null)} />}
    </>
  );
}

function SummaryTab({
  activeMonth, totals, carryForward, closingBalance, monthSubPlayers, players, monthDayEntries,
  setTab, setSelectedDate, monthPayments, rates, monthAdjustment, monthAdjustmentRaw, setAdjustmentValue, perPlayerExtra, onExportFullSeason,
  isLocked, toggleMonthLock,
}) {
  const [exported, setExported] = useState(false);
  const [copied, setCopied] = useState(false);
  const [fullExported, setFullExported] = useState(false);
  const [confirmingUnlock, setConfirmingUnlock] = useState(false);

  const rows = [
    ["Net hours used", `${totals.hours} hr`],
    [`Net fee (₹${rates.netRate}/hr)`, fmtINR(totals.netFee)],
    ["New balls used", `${totals.balls}`],
    [`Ball fee (₹${rates.ballRate}/ball)`, fmtINR(totals.ballFee)],
    ["Total expense", fmtINR(totals.expense)],
    ["Carried forward in", fmtINR(carryForward)],
    ["Manual adjustment", fmtINR(monthAdjustment)],
    ["Subscribed players", `${monthSubPlayers.length}`],
    [`Expected (₹${rates.subAmount} × players)`, fmtINR(totals.expected)],
    ["Actually collected", fmtINR(totals.collected)],
    ["Pending dues", fmtINR(Math.max(totals.pending, 0))],
  ];

  function buildSettlementText() {
    const lines = [];
    lines.push(`CRICKET NETS SETTLEMENT — ${monthLabel(activeMonth).toUpperCase()}`);
    lines.push("=".repeat(40));
    lines.push("");
    rows.forEach(([label, val]) => lines.push(`${label.padEnd(28, " ")} ${val}`));
    lines.push("");
    lines.push(closingBalance < 0 ? "SHORTFALL (split among subscribed players)" : "CLOSING BALANCE (carries to next month)");
    lines.push(fmtINR(Math.abs(closingBalance)));
    if (closingBalance < 0 && monthSubPlayers.length > 0) {
      lines.push(`${fmtINR(perPlayerExtra)} extra per player`);
    }
    lines.push("");
    lines.push("PAYMENT STATUS");
    lines.push("-".repeat(40));
    monthSubPlayers.forEach((pid) => {
      const p = players.find((pl) => pl.id === pid);
      if (!p) return;
      lines.push(`${p.name.padEnd(28, " ")} ${monthPayments[pid] ? "Paid" : "Pending"}`);
    });
    lines.push("");
    lines.push("DAY-BY-DAY BREAKDOWN");
    lines.push("-".repeat(40));
    if (monthDayEntries.length === 0) {
      lines.push("No sessions logged.");
    } else {
      monthDayEntries.forEach(([iso, v]) => {
        lines.push(`${fmtDateShort(iso).padEnd(20, " ")} ${String(Number(v.hours || 0) + " hr").padEnd(10, " ")} ${Number(v.balls || 0)} balls`);
      });
    }
    return lines.join("\n");
  }

  // Unlike buildSettlementText() above (opened in a text editor, where
  // monospace alignment is reliable), this version is read in a WhatsApp
  // chat bubble — often on a phone too narrow to fit a padded row on one
  // line — so it uses plain "label: value" lines instead of a padded
  // table. See cleanField()/buildMatchAvailabilityMessage() near the top
  // of this file for the fuller explanation.
  function buildSettlementTextWhatsApp() {
    const out = [];
    out.push(`🏏 *Cricket Nets Settlement — ${monthLabel(activeMonth)}*`);
    out.push("");
    rows.forEach(([label, val]) => out.push(`${label}: ${val}`));
    out.push("—————————————");
    out.push(`${closingBalance < 0 ? "Shortfall" : "Balance"}: ${fmtINR(Math.abs(closingBalance))}`);
    if (closingBalance < 0 && monthSubPlayers.length > 0) {
      out.push(`Extra per player: ${fmtINR(perPlayerExtra)}`);
    }

    if (monthSubPlayers.length > 0) {
      out.push("");
      out.push("*Payment status*");
      monthSubPlayers.forEach((pid) => {
        const p = players.find((pl) => pl.id === pid);
        if (!p) return;
        out.push(`${monthPayments[pid] ? "✅" : "⏳"} ${p.name}`);
      });
    }

    if (monthDayEntries.length > 0) {
      out.push("");
      out.push("*Day-by-day*");
      monthDayEntries.forEach(([iso, v]) => {
        out.push(`${fmtDateShort(iso)}: ${Number(v.hours || 0)}hr / ${Number(v.balls || 0)}b`);
      });
    }
    return out.join("\n");
  }

  function handleExport() {
    const ok = downloadTextFile(`nets-settlement-${activeMonth}.txt`, buildSettlementText());
    setExported(ok);
    if (ok) setTimeout(() => setExported(false), 2000);
  }
  async function handleCopy() {
    const ok = await copyText(buildSettlementTextWhatsApp());
    setCopied(ok);
    if (ok) setTimeout(() => setCopied(false), 2000);
  }
  function handleFullExport() {
    onExportFullSeason();
    setFullExported(true);
    setTimeout(() => setFullExported(false), 2000);
  }

  return (
    <div>
      {isLocked && (
        <div style={{ background: "#FAEEDA", color: "#633806", borderRadius: 10, padding: "10px 14px", fontSize: 12, marginBottom: 14, display: "flex", alignItems: "center", gap: 6 }}>
          <Icon size={13}>🔒</Icon> This month is locked — fees, votes, and payments can't be changed until it's unlocked.
        </div>
      )}

      <div style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: 14, marginBottom: 14 }}>
        {!confirmingUnlock ? (
          <button
            onClick={() => { if (isLocked) setConfirmingUnlock(true); else toggleMonthLock(); }}
            style={{
              width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
              background: isLocked ? "transparent" : COLORS.pitch, color: isLocked ? COLORS.leather : "#fff",
              border: isLocked ? `1px solid ${COLORS.leather}` : "none", borderRadius: 8,
              padding: "10px", fontSize: 13, fontWeight: 600, cursor: "pointer",
            }}
          >
            <Icon size={14}>{isLocked ? "🔓" : "🔒"}</Icon>
            {isLocked ? `Unlock ${monthLabel(activeMonth)}` : `Lock ${monthLabel(activeMonth)}`}
          </button>
        ) : (
          <div>
            <div style={{ fontSize: 12, color: COLORS.inkSoft, marginBottom: 10, display: "flex", alignItems: "center", gap: 6 }}>
              <Icon size={13}>⚠</Icon> Unlocking allows this month's votes, payments, and fees to be edited again.
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => setConfirmingUnlock(false)} style={{ flex: 1, background: "transparent", border: `1px solid ${COLORS.line}`, color: COLORS.ink, borderRadius: 8, padding: "9px", fontSize: 13, cursor: "pointer" }}>
                Cancel
              </button>
              <button onClick={() => { toggleMonthLock(); setConfirmingUnlock(false); }} style={{ flex: 1, background: COLORS.leather, border: "none", color: "#fff", borderRadius: 8, padding: "9px", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
                Unlock
              </button>
            </div>
          </div>
        )}
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, flexWrap: "wrap", gap: 8 }}>
        <div style={{ fontSize: 11, letterSpacing: 1, textTransform: "uppercase", color: COLORS.inkSoft }}>{monthLabel(activeMonth)} settlement</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button onClick={handleCopy} style={{
            display: "flex", alignItems: "center", gap: 5, background: "transparent",
            border: `1px solid ${COLORS.line}`, color: COLORS.ink, borderRadius: 8,
            padding: "5px 10px", fontSize: 11, fontWeight: 600, cursor: "pointer",
          }}>
            {copied ? <Icon size={13}>✅</Icon> : <Icon size={13}>⧉</Icon>}
            {copied ? "Copied!" : "Copy"}
          </button>
          <WhatsAppShareLink text={buildSettlementTextWhatsApp()} style={{ gap: 5, padding: "5px 10px", fontSize: 11 }}>
            <Icon size={13}>💬</Icon> Share
          </WhatsAppShareLink>
          <button onClick={handleExport} style={{
            display: "flex", alignItems: "center", gap: 5, background: COLORS.leather,
            border: "none", color: "#fff", borderRadius: 8,
            padding: "5px 10px", fontSize: 11, fontWeight: 600, cursor: "pointer",
          }}>
            {exported ? <Icon size={13}>✅</Icon> : <Icon size={13}>⬇</Icon>}
            {exported ? "Downloaded" : "Export .txt"}
          </button>
        </div>
      </div>

      <div style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 12, overflow: "hidden", marginBottom: 14 }}>
        {rows.map(([label, val], i) => (
          <div key={label} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 16px", borderBottom: i < rows.length - 1 ? `1px solid ${COLORS.line}` : "none" }}>
            <span style={{ fontSize: 13, color: COLORS.inkSoft }}>{label}</span>
            {label === "Manual adjustment" ? (
              <input
                type="text" inputMode="numeric" value={monthAdjustmentRaw} disabled={isLocked}
                onChange={(e) => setAdjustmentValue(sanitizeSignedDecimalInput(e.target.value))}
                onBlur={(e) => setAdjustmentValue(String(Number(e.target.value) || 0))}
                className="mono"
                style={{ width: 100, textAlign: "right", fontSize: 13, fontWeight: 600, border: `1px solid ${COLORS.line}`, borderRadius: 6, padding: "4px 8px", background: "#fff", color: COLORS.ink, outline: "none", opacity: isLocked ? 0.6 : 1 }}
              />
            ) : (
              <span className="mono" style={{ fontSize: 13, fontWeight: 600 }}>{val}</span>
            )}
          </div>
        ))}
      </div>
      <div style={{ fontSize: 11, color: COLORS.inkSoft, marginBottom: 14 }}>
        Use "Manual adjustment" for a starting balance carried over from before you used this app, or to correct an error — positive adds to the balance, negative subtracts.
      </div>

      <div style={{ fontSize: 11, letterSpacing: 1, textTransform: "uppercase", color: COLORS.inkSoft, marginBottom: 10 }}>Day-by-day breakdown</div>
      <div style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 12, overflow: "hidden", marginBottom: 14 }}>
        <div style={{ display: "grid", gridTemplateColumns: "1.6fr 1fr 1fr", padding: "8px 16px", background: COLORS.pitchLight }}>
          <span style={{ fontSize: 11, color: "#CFE0D3", textTransform: "uppercase", letterSpacing: 0.5 }}>Date</span>
          <span style={{ fontSize: 11, color: "#CFE0D3", textTransform: "uppercase", letterSpacing: 0.5, textAlign: "right" }}>Hours</span>
          <span style={{ fontSize: 11, color: "#CFE0D3", textTransform: "uppercase", letterSpacing: 0.5, textAlign: "right" }}>Balls</span>
        </div>
        {monthDayEntries.length === 0 ? (
          <div style={{ padding: 16, fontSize: 13, color: COLORS.inkSoft }}>No sessions logged yet this month.</div>
        ) : (
          monthDayEntries.map(([iso, v], i) => (
            <button
              key={iso}
              onClick={() => { setSelectedDate(iso); setTab("log"); }}
              style={{
                display: "grid", gridTemplateColumns: "1.6fr 1fr 1fr", width: "100%", textAlign: "left",
                padding: "9px 16px", border: "none", cursor: "pointer",
                background: "transparent", borderBottom: i < monthDayEntries.length - 1 ? `1px solid ${COLORS.line}` : "none",
              }}
            >
              <span style={{ fontSize: 13 }}>{fmtDateShort(iso)}</span>
              <span className="mono" style={{ fontSize: 13, textAlign: "right" }}>{Number(v.hours || 0)} hr</span>
              <span className="mono" style={{ fontSize: 13, textAlign: "right" }}>{Number(v.balls || 0)}</span>
            </button>
          ))
        )}
        {monthDayEntries.length > 0 && (
          <div style={{ display: "grid", gridTemplateColumns: "1.6fr 1fr 1fr", padding: "10px 16px", background: COLORS.card, borderTop: `1px solid ${COLORS.line}` }}>
            <span style={{ fontSize: 13, fontWeight: 600 }}>Total</span>
            <span className="mono" style={{ fontSize: 13, fontWeight: 600, textAlign: "right" }}>{totals.hours} hr</span>
            <span className="mono" style={{ fontSize: 13, fontWeight: 600, textAlign: "right" }}>{totals.balls}</span>
          </div>
        )}
      </div>

      <div style={{ background: closingBalance < 0 ? COLORS.leather : COLORS.pitch, color: "#fff", borderRadius: 12, padding: 18, marginBottom: 14 }}>
        <div style={{ fontSize: 11, letterSpacing: 1, textTransform: "uppercase", opacity: 0.8 }}>
          {closingBalance < 0 ? "Shortfall — split among subscribed players" : "Closing balance — carries to next month"}
        </div>
        <div className="scorenum" style={{ fontSize: 32, marginTop: 4 }}>{fmtINR(Math.abs(closingBalance))}</div>
        {closingBalance < 0 && monthSubPlayers.length > 0 && (
          <div style={{ marginTop: 10, fontSize: 13 }}>
            <div className="mono" style={{ marginBottom: 6 }}>{fmtINR(perPlayerExtra)} extra per player</div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              {monthSubPlayers.map((pid) => {
                const p = players.find((pl) => pl.id === pid);
                if (!p) return null;
                return <span key={pid} style={{ background: "rgba(255,255,255,0.15)", borderRadius: 20, padding: "4px 10px", fontSize: 12 }}>{p.name}</span>;
              })}
            </div>
          </div>
        )}
      </div>

      <button onClick={handleFullExport} style={{
        width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
        background: "transparent", border: `1px solid ${COLORS.line}`, color: COLORS.ink, borderRadius: 10,
        padding: "10px", fontSize: 13, fontWeight: 600, cursor: "pointer",
      }}>
        {fullExported ? <Icon size={14}>✅</Icon> : <Icon size={14}>⬇</Icon>}
        {fullExported ? "Downloaded full season" : "Export full season (CSV, all months)"}
      </button>
    </div>
  );
}

function StatsTab({ players, days, photos, onViewPhoto }) {
  const { stats, total } = useMemo(() => computeAttendanceStats(players, days), [players, days]);
  const [showAllStats, setShowAllStats] = useState(false);
  const STATS_PREVIEW_ROWS = 5;
  const shownStats = showAllStats ? stats : stats.slice(0, STATS_PREVIEW_ROWS);
  const statsOverflow = stats.length - STATS_PREVIEW_ROWS;

  return (
    <div>
      <div style={{ fontSize: 11, letterSpacing: 1, textTransform: "uppercase", color: COLORS.inkSoft, marginBottom: 4 }}>All-time attendance</div>
      <div style={{ fontSize: 13, color: COLORS.inkSoft, marginBottom: 16 }}>
        Based on {total} logged session{total === 1 ? "" : "s"} across all months.
      </div>
      {players.length === 0 ? (
        <div style={{ fontSize: 13, color: COLORS.inkSoft }}>Add players to see attendance stats.</div>
      ) : total === 0 ? (
        <div style={{ fontSize: 13, color: COLORS.inkSoft }}>No sessions logged yet — stats will appear once you log some days.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {shownStats.map((s, i) => (
            <div key={s.id} style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: "12px 16px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                <span style={{ fontSize: 14, fontWeight: 600, display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontSize: 11, color: COLORS.inkSoft }}>#{i + 1}</span>
                  <PlayerAvatar name={s.name} photo={photos && photos[s.id]} size={24} border={false} onView={photos && photos[s.id] && onViewPhoto ? () => onViewPhoto(s.name, photos[s.id]) : undefined} />
                  {s.name}
                </span>
                <span className="mono" style={{ fontSize: 13, color: COLORS.inkSoft }}>{s.attended}/{total} · {s.pct}%</span>
              </div>
              <div style={{ background: COLORS.line, borderRadius: 6, height: 8, overflow: "hidden" }}>
                <div style={{ width: `${s.pct}%`, height: "100%", background: s.pct >= 75 ? "#5C8A63" : s.pct >= 40 ? COLORS.willow : COLORS.leatherLight, borderRadius: 6 }} />
              </div>
            </div>
          ))}
          {statsOverflow > 0 && (
            <button onClick={() => setShowAllStats((v) => !v)} style={{ width: "100%", background: "transparent", border: `1px dashed ${COLORS.line}`, color: COLORS.inkSoft, borderRadius: 8, padding: "8px", fontSize: 12, cursor: "pointer" }}>
              {showAllStats ? "Show less" : `Show all ${stats.length}`}
