      </a>

      <div className="w-320" style={{ borderTop: `1px solid ${COLORS.pitchLight}`, paddingTop: 16, width: "100%" }}>
        <div style={{ fontSize: 11, color: "#7C8E80", marginBottom: 8 }}>Setting up a brand new club instead?</div>
        <button onClick={onRequestTeam} style={{ background: "transparent", border: "none", color: COLORS.willow, fontSize: 12, fontWeight: 600, cursor: "pointer", textDecoration: "underline" }}>
          Request a new team →
        </button>
      </div>
    </div>
  );
}

function RequestTeamView({ onBack, requestNewTeam, suggestTeamCode, teamCodeTaken, onSubmitted }) {
  const [teamName, setTeamName] = useState("");
  const [teamCode, setTeamCode] = useState("");
  const [codeTouched, setCodeTouched] = useState(false);
  const [logo, setLogo] = useState(null);
  const [cropFile, setCropFile] = useState(null);
  const [requestedBy, setRequestedBy] = useState("");
  const [contactNumber, setContactNumber] = useState("");
  const [pin, setPin] = useState("");
  const [pinConfirm, setPinConfirm] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const fileInputRef = React.useRef(null);

  const effectiveCode = codeTouched ? teamCode : (teamName ? suggestTeamCode(teamName) : "");
  const codeAvailable = effectiveCode && !teamCodeTaken(effectiveCode);

  function handlePhotoFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setCropFile(file);
  }

  async function handleSubmit() {
    setError("");
    if (!isValidPhone(contactNumber)) { setError("Enter a valid 10-digit mobile number."); return; }
    if (pin.length !== 4) { setError("Choose a 4-digit PIN."); return; }
    if (pin !== pinConfirm) { setError("PINs don't match."); return; }
    setBusy(true);
    const pinHash = await hashPin(pin);
    const res = await requestNewTeam({ teamName, teamCode: effectiveCode, logo, requestedBy, contactNumber, pinHash });
    setBusy(false);
    if (!res.ok) { setError(res.error); return; }
    onSubmitted(res.code);
  }

  return (
    <div style={{ minHeight: 480, background: COLORS.pitch, color: COLORS.cream, padding: 24 }}>
      <button onClick={onBack} style={{ ...iconBtnStyle, marginBottom: 20 }}><Icon size={16}>←</Icon> <span style={{ fontSize: 12, marginLeft: 4 }}>Back</span></button>
      <div className="w-340" style={{ margin: "0 auto" }}>
        <div style={{ fontSize: 11, letterSpacing: 3, textTransform: "uppercase", color: COLORS.willow, fontWeight: 600, marginBottom: 6, textAlign: "center" }}>New Team Request</div>
        <div className="scorenum" style={{ fontSize: 26, textAlign: "center", marginBottom: 20 }}>Request a new team</div>

        <div style={{ display: "flex", justifyContent: "center", marginBottom: 6 }}>
          <button onClick={() => fileInputRef.current && fileInputRef.current.click()} style={{ width: 68, height: 68, borderRadius: 16, background: COLORS.pitchLight, border: `2px dashed ${COLORS.willow}`, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", overflow: "hidden", padding: 0 }}>
            {logo ? <img src={logo} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <Icon size={22} color={COLORS.willow}>📷</Icon>}
          </button>
        </div>
        <input ref={fileInputRef} type="file" accept="image/*" onChange={handlePhotoFile} style={{ display: "none" }} />
        {cropFile && <PhotoCropModal file={cropFile} onConfirm={(dataUrl) => { setLogo(dataUrl); setCropFile(null); }} onCancel={() => setCropFile(null)} />}
        <div style={{ fontSize: 11, color: "#9BAE9E", textAlign: "center", marginBottom: 18 }}>Team logo (optional)</div>

        <div style={{ background: COLORS.pitchLight, borderRadius: 12, padding: 16 }}>
          <div style={{ fontSize: 11, color: "#9BAE9E", marginBottom: 6 }}>Team name</div>
          <input value={teamName} onChange={(e) => setTeamName(e.target.value)} placeholder="e.g. Thunder CC" style={{ width: "100%", background: COLORS.pitch, border: `1px solid ${COLORS.pitchLight}`, borderRadius: 8, padding: "10px 12px", color: "#fff", fontSize: 13, outline: "none", boxSizing: "border-box", marginBottom: 12 }} />

          <div style={{ fontSize: 11, color: "#9BAE9E", marginBottom: 6 }}>Team code (auto-generated, editable)</div>
          <input value={effectiveCode} onChange={(e) => { setTeamCode(e.target.value.toLowerCase()); setCodeTouched(true); }} style={{ width: "100%", background: COLORS.pitch, border: `1px solid ${COLORS.pitchLight}`, borderRadius: 8, padding: "10px 12px", color: COLORS.willow, fontSize: 13, outline: "none", boxSizing: "border-box", marginBottom: 6 }} />
          {effectiveCode && <div style={{ fontSize: 11, color: codeAvailable ? "#5C8A63" : "#F0A6A4", marginBottom: 12 }}>{codeAvailable ? "✓ Available" : "Already taken"}</div>}

          <div style={{ fontSize: 11, color: "#9BAE9E", marginBottom: 6 }}>Your name (requesting admin)</div>
          <input value={requestedBy} onChange={(e) => setRequestedBy(e.target.value)} style={{ width: "100%", background: COLORS.pitch, border: `1px solid ${COLORS.pitchLight}`, borderRadius: 8, padding: "10px 12px", color: "#fff", fontSize: 13, outline: "none", boxSizing: "border-box", marginBottom: 12 }} />

          <div style={{ fontSize: 11, color: "#9BAE9E", marginBottom: 6 }}>Contact number</div>
          <input
            type="tel" inputMode="numeric" maxLength={10}
            value={contactNumber}
            onChange={(e) => setContactNumber(sanitizePhoneInput(e.target.value))}
            placeholder="10-digit mobile number"
            style={{ width: "100%", background: COLORS.pitch, border: `1px solid ${COLORS.pitchLight}`, borderRadius: 8, padding: "10px 12px", color: "#fff", fontSize: 13, outline: "none", boxSizing: "border-box", marginBottom: 12 }}
          />

          <div style={{ fontSize: 11, color: "#9BAE9E", marginBottom: 6 }}>Set your admin PIN (activates once approved)</div>
          <input
            className="pinbox" type="password" inputMode="numeric" maxLength={4} value={pin}
            onChange={(e) => setPin(e.target.value.replace(/\D/g, "").slice(0, 4))}
            placeholder="••••"
            style={{ width: "100%", textAlign: "center", letterSpacing: 8, fontSize: 20, border: `1px solid ${COLORS.pitchLight}`, borderRadius: 8, padding: "10px 12px", background: COLORS.pitch, color: "#fff", outline: "none", boxSizing: "border-box", marginBottom: 10 }}
          />
          <input
            className="pinbox" type="password" inputMode="numeric" maxLength={4} value={pinConfirm}
            onChange={(e) => setPinConfirm(e.target.value.replace(/\D/g, "").slice(0, 4))}
            onKeyDown={(e) => e.key === "Enter" && handleSubmit()}
            placeholder="Confirm PIN"
            style={{ width: "100%", textAlign: "center", letterSpacing: 8, fontSize: 20, border: `1px solid ${COLORS.pitchLight}`, borderRadius: 8, padding: "10px 12px", background: COLORS.pitch, color: "#fff", outline: "none", boxSizing: "border-box", marginBottom: 14 }}
          />

          {error && <div style={{ color: "#F0A6A4", fontSize: 12, marginBottom: 10 }}>{error}</div>}
          <button onClick={handleSubmit} disabled={busy} style={{ width: "100%", background: COLORS.willow, color: "#fff", border: "none", borderRadius: 8, padding: "10px", fontSize: 14, fontWeight: 600, cursor: busy ? "default" : "pointer" }}>
            {busy ? "Submitting…" : "Submit for approval"}
          </button>
        </div>
        <div style={{ fontSize: 11, color: "#9BAE9E", textAlign: "center", marginTop: 14 }}>
          A Super Admin reviews every new team before it's usable. You'll be able to check back with the same code.
        </div>
      </div>
    </div>
  );
}

function TeamPendingView({ team, onBack, onGoToCode }) {
  const rejected = team.status === "rejected";
  const suspended = team.status === "suspended";
  const deleted = team.status === "deleted";
  const renamed = team.status === "renamed";
  const icon = renamed ? "↪" : deleted ? "🗑" : suspended ? "⏸" : rejected ? "✕" : "⏳";
  const heading = renamed ? "has moved" : deleted ? "was deleted" : suspended ? "has been suspended" : rejected ? "wasn't approved" : "is pending approval";
  const message = renamed
    ? `This team's code changed — its new code is "${team.renamedTo}".`
    : deleted
    ? "This team was removed by the platform admin. Its code can't be reused for a new team."
    : suspended
    ? "This team has been temporarily suspended by the platform admin. Contact them if you think this is a mistake."
    : rejected
    ? "This team request wasn't approved. Contact the platform admin if you think this is a mistake."
    : "A Super Admin needs to review your request before this team is usable. Check back soon, or try the same link again later.";
  return (
    <div style={{ minHeight: 480, background: COLORS.pitch, color: COLORS.cream, padding: 24, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", textAlign: "center" }}>
      <div style={{ fontSize: 36, marginBottom: 12 }}>{icon}</div>
      <div className="scorenum" style={{ fontSize: 24, marginBottom: 10 }}>{team.teamName} {heading}</div>
      <div style={{ fontSize: 13, color: "#CFE0D3", maxWidth: 300, marginBottom: 22 }}>{message}</div>
      {renamed && team.renamedTo && onGoToCode ? (
        <button onClick={() => onGoToCode(team.renamedTo)} style={{ background: COLORS.willow, color: "#fff", border: "none", borderRadius: 8, padding: "10px 20px", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
          Go to {team.renamedTo} →
        </button>
      ) : (
        <button onClick={onBack} style={{ background: COLORS.willow, color: "#fff", border: "none", borderRadius: 8, padding: "10px 20px", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
          ← Back
        </button>
      )}
    </div>
  );
}

function TeamNotFoundView({ code, onBack }) {

      <div style={{ fontSize: 36, marginBottom: 12 }}>🔍</div>

      </button>
    </div>

}

function SuperAdminFlow({
  view, setView, superAdminPin, setupSuperAdminPin, authedSuperAdmin, setAuthedSuperAdmin, teamsIndex,
  approveTeamRequest, rejectTeamRequest, onBack,
  resetTeamAdminPin, suspendTeam, reactivateTeam, deleteTeamFromRegistry, renameTeam, changeTeamCode,
  pinResetRequests, approvePinResetRequest, rejectPinResetRequest,
}) {
  const [pinInput, setPinInput] = useState("");
  const [pinConfirm, setPinConfirm] = useState("");
  const [error, setError] = useState("");
  const [subTab, setSubTab] = useState("requests");
  const [busyCode, setBusyCode] = useState(null);

  if (!authedSuperAdmin) {
    const hasPin = !!superAdminPin;
    async function handleContinue() {
      setError("");
      if (hasPin) {
        if (pinInput.length !== 4) { setError("Enter your PIN."); return; }
        const hashed = await hashPin(pinInput);
        if (hashed !== superAdminPin) { setError("That PIN doesn't match."); return; }
        setAuthedSuperAdmin(true);
        setView("super-admin");
      } else {
        if (pinInput.length !== 4) { setError("Choose a 4-digit PIN."); return; }
        if (pinInput !== pinConfirm) { setError("PINs don't match."); return; }
        const hashed = await hashPin(pinInput);
        const ok = await setupSuperAdminPin(hashed);
        if (!ok) { setError("Could not save — try again."); return; }
        setAuthedSuperAdmin(true);
        setView("super-admin");
      }
    }
    return (
      <div style={{ minHeight: 480, background: COLORS.pitch, color: COLORS.cream, padding: 24 }}>
        <button onClick={onBack} style={{ ...iconBtnStyle, marginBottom: 20 }}><Icon size={16}>←</Icon> <span style={{ fontSize: 12, marginLeft: 4 }}>Back</span></button>
        <div className="w-300" style={{ margin: "40px auto 0", textAlign: "center" }}>
          <div style={{ fontSize: 11, letterSpacing: 3, textTransform: "uppercase", color: COLORS.willow, fontWeight: 600, marginBottom: 6 }}>Super Admin</div>
          <div className="scorenum" style={{ fontSize: 26, marginBottom: 22 }}>{hasPin ? "Enter PIN" : "Set your PIN"}</div>
          <div style={{ background: COLORS.pitchLight, borderRadius: 12, padding: 18 }}>
            <input
              className="pinbox" type="password" inputMode="numeric" maxLength={4} value={pinInput}
              onChange={(e) => setPinInput(e.target.value.replace(/\D/g, "").slice(0, 4))}
              placeholder="••••"
              style={{ width: "100%", textAlign: "center", letterSpacing: 8, fontSize: 20, border: `1px solid ${COLORS.pitchLight}`, borderRadius: 8, padding: "10px 12px", background: COLORS.pitch, color: "#fff", outline: "none", boxSizing: "border-box", marginBottom: hasPin ? 12 : 8 }}
            />
            {!hasPin && (
              <input
                className="pinbox" type="password" inputMode="numeric" maxLength={4} value={pinConfirm}
                onChange={(e) => setPinConfirm(e.target.value.replace(/\D/g, "").slice(0, 4))}
                onKeyDown={(e) => e.key === "Enter" && handleContinue()}
                placeholder="Confirm PIN"
                style={{ width: "100%", textAlign: "center", letterSpacing: 8, fontSize: 20, border: `1px solid ${COLORS.pitchLight}`, borderRadius: 8, padding: "10px 12px", background: COLORS.pitch, color: "#fff", outline: "none", boxSizing: "border-box", marginBottom: 12 }}
              />
            )}
            {error && <div style={{ color: "#F0A6A4", fontSize: 12, marginBottom: 10 }}>{error}</div>}
            <button onClick={handleContinue} style={{ width: "100%", background: COLORS.willow, color: "#fff", border: "none", borderRadius: 8, padding: "10px", fontSize: 14, fontWeight: 600, cursor: "pointer" }}>
              Continue
            </button>
          </div>
        </div>
      </div>
    );
  }

  const entries = Object.values(teamsIndex || {});
  const pending = entries.filter((t) => t.status === "pending");
  const manageable = entries.filter((t) => t.status === "approved" || t.status === "suspended");
  const pinResetList = Object.values(pinResetRequests || {}).sort((a, b) => a.submittedAt.localeCompare(b.submittedAt));

  async function handleApprove(code) {
    setBusyCode(code);
    await approveTeamRequest(code);
    setBusyCode(null);
  }

  return (
    <div style={{ minHeight: 480 }}>
      <div style={{ background: COLORS.pitch, color: COLORS.cream, padding: "20px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <button onClick={() => { setAuthedSuperAdmin(false); setView("landing"); onBack(); }} style={{ ...iconBtnStyle, background: COLORS.pitchLight, borderRadius: 8, padding: "6px 10px", display: "flex", gap: 6 }}>
          <Icon size={14}>←</Icon> <span style={{ fontSize: 12 }}>Exit</span>
        </button>
        <div style={{ textAlign: "right" }}>
          <div style={{ fontSize: 10, letterSpacing: 1, textTransform: "uppercase", color: COLORS.willow }}>Super Admin</div>
          <div className="scorenum" style={{ fontSize: 22 }}>{subTab === "requests" ? "Team Requests" : "All Teams"}</div>
        </div>
      </div>

      <div className="w-600" style={{ margin: "0 auto", padding: 20 }}>
        {subTab === "requests" ? (
          <>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
              <span style={{ fontSize: 12, color: COLORS.inkSoft, fontWeight: 600 }}>Pending</span>
              <span style={{ fontSize: 11, background: "#FAEEDA", color: "#854F0B", padding: "3px 10px", borderRadius: 20 }}>{pending.length} pending</span>
            </div>
            {pending.length === 0 ? (
              <div style={{ fontSize: 13, color: COLORS.inkSoft }}>No pending team requests.</div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {pending.map((t) => (
                  <div key={t.teamCode} style={{ background: COLORS.card, border: `1px dashed ${COLORS.willow}`, borderRadius: 12, padding: 14 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
                      {t.logo ? <img src={t.logo} alt="" style={{ width: 38, height: 38, borderRadius: 10, objectFit: "cover" }} /> : <div style={{ width: 38, height: 38, borderRadius: 10, background: avatarColor(t.teamName) }} />}
                      <div>
                        <div style={{ fontSize: 14, fontWeight: 600 }}>{t.teamName} <span style={{ fontSize: 11, color: COLORS.inkSoft, fontWeight: 400 }}>({t.teamCode})</span></div>
                        <div style={{ fontSize: 11, color: COLORS.inkSoft }}>{t.requestedBy}{t.contactNumber ? ` · ${t.contactNumber}` : ""}</div>
                      </div>
                    </div>
                    <div style={{ display: "flex", gap: 8 }}>
                      <button onClick={() => handleApprove(t.teamCode)} disabled={busyCode === t.teamCode} style={{ flex: 1, background: COLORS.leather, color: "#fff", border: "none", borderRadius: 6, padding: "8px", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
                        {busyCode === t.teamCode ? "…" : "Approve"}
                      </button>
                      <button onClick={() => rejectTeamRequest(t.teamCode)} style={{ flex: 1, background: "transparent", border: `1px solid ${COLORS.line}`, borderRadius: 6, padding: "8px", fontSize: 12, color: COLORS.inkSoft, cursor: "pointer" }}>
                        Reject
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}
            <div style={{ fontSize: 11, color: COLORS.inkSoft, marginTop: 14, marginBottom: 24 }}>Approving activates the team and its admin PIN together — they can log in right after.</div>

            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
              <span style={{ fontSize: 12, color: COLORS.inkSoft, fontWeight: 600 }}>Admin PIN reset requests</span>
              <span style={{ fontSize: 11, background: "#FAEEDA", color: "#854F0B", padding: "3px 10px", borderRadius: 20 }}>{pinResetList.length} pending</span>
            </div>
            {pinResetList.length === 0 ? (
              <div style={{ fontSize: 13, color: COLORS.inkSoft }}>No pending PIN reset requests.</div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {pinResetList.map((r) => {
                  const team = teamsIndex[r.teamCode];
                  const onFile = team ? team.contactNumber : "";
                  const matches = onFile && r.contactNumber && onFile.trim() === r.contactNumber.trim();
                  return (
                    <div key={r.id} style={{ background: COLORS.card, border: `1px dashed ${COLORS.leather}`, borderRadius: 12, padding: 14 }}>
                      <div style={{ marginBottom: 10 }}>
                        <div style={{ fontSize: 14, fontWeight: 600 }}>{team ? team.teamName : r.teamCode} <span style={{ fontSize: 11, color: COLORS.inkSoft, fontWeight: 400 }}>({r.teamCode})</span></div>
                        <div style={{ fontSize: 11, color: COLORS.inkSoft }}>Requested by {r.requestedBy} · {timeAgo(r.submittedAt)}</div>
                      </div>
                      <div style={{ background: "#fff", borderRadius: 8, padding: 10, marginBottom: 10, fontSize: 12 }}>
                        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                          <span style={{ color: COLORS.inkSoft }}>Submitted number</span>
                          <span style={{ fontWeight: 600 }}>{r.contactNumber || "—"}</span>
                        </div>
                        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                          <span style={{ color: COLORS.inkSoft }}>On file for this team</span>
                          <span style={{ fontWeight: 600 }}>{onFile || "—"}</span>
                        </div>
                        <div style={{
                          fontSize: 11, fontWeight: 600, textAlign: "center", borderRadius: 6, padding: "5px",
                          background: matches ? "#EAF3E4" : "#FCEBEA", color: matches ? "#3B6D11" : COLORS.leather,
                        }}>
                          {matches ? "✓ Matches the number on file" : "✕ Doesn't match — verify before approving"}
                        </div>
                      </div>
                      <div style={{ display: "flex", gap: 8 }}>
                        <button onClick={() => approvePinResetRequest(r.id)} style={{ flex: 1, background: COLORS.leather, color: "#fff", border: "none", borderRadius: 6, padding: "8px", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
                          Approve reset
                        </button>
                        <button onClick={() => rejectPinResetRequest(r.id)} style={{ flex: 1, background: "transparent", border: `1px solid ${COLORS.line}`, borderRadius: 6, padding: "8px", fontSize: 12, color: COLORS.inkSoft, cursor: "pointer" }}>
                          Reject
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {manageable.length === 0 ? (
              <div style={{ fontSize: 13, color: COLORS.inkSoft }}>No approved teams yet.</div>
            ) : manageable.map((t) => (
              <TeamManageCard
                key={t.teamCode} team={t}
                resetTeamAdminPin={resetTeamAdminPin} suspendTeam={suspendTeam} reactivateTeam={reactivateTeam}
                deleteTeamFromRegistry={deleteTeamFromRegistry} renameTeam={renameTeam} changeTeamCode={changeTeamCode}
              />
            ))}
          </div>
        )}
      </div>

      <div style={{ position: "fixed", left: 0, right: 0, bottom: 0, display: "flex", justifyContent: "center" }}>
        <div className="w-600" style={{ width: "100%", background: COLORS.pitchLight, margin: "0 8px 8px", borderRadius: 16, padding: "8px 4px", display: "flex", justifyContent: "space-around" }}>
          <button onClick={() => setSubTab("requests")} style={{ background: "transparent", border: "none", cursor: "pointer", textAlign: "center", color: subTab === "requests" ? COLORS.cream : "#7C8E80", padding: "4px 8px" }}>
            <div><Icon size={18}>📋</Icon></div>
            <div style={{ fontSize: 9, marginTop: 2 }}>Requests</div>
          </button>
          <button onClick={() => setSubTab("teams")} style={{ background: "transparent", border: "none", cursor: "pointer", textAlign: "center", color: subTab === "teams" ? COLORS.cream : "#7C8E80", padding: "4px 8px" }}>
            <div><Icon size={18}>🏆</Icon></div>
            <div style={{ fontSize: 9, marginTop: 2 }}>All Teams</div>
          </button>
        </div>
      </div>
    </div>
  );
}

function TeamManageCard({ team, resetTeamAdminPin, suspendTeam, reactivateTeam, deleteTeamFromRegistry, renameTeam, changeTeamCode }) {
  const [expanded, setExpanded] = useState(false);
  const [busy, setBusy] = useState(false);
  const [notice, setNotice] = useState("");

  const [renaming, setRenaming] = useState(false);
  const [nameInput, setNameInput] = useState(team.teamName);

  const [changingCode, setChangingCode] = useState(false);
  const [codeInput, setCodeInput] = useState(team.teamCode);
  const [codeError, setCodeError] = useState("");

  const [confirmDelete, setConfirmDelete] = useState(false);
  const [deleteConfirmText, setDeleteConfirmText] = useState("");

  const suspended = team.status === "suspended";

  async function handleResetPin() {
    setBusy(true);
    const ok = await resetTeamAdminPin(team.teamCode);
    setBusy(false);
    setNotice(ok ? "Admin PIN reset — they'll set a new one at next login." : "Could not reset — try again.");
    setTimeout(() => setNotice(""), 3000);
  }
  async function handleRename() {
    setBusy(true);
    const ok = await renameTeam(team.teamCode, nameInput);
    setBusy(false);
    if (ok) setRenaming(false);
  }
  async function handleChangeCode() {
    setCodeError("");
    setBusy(true);
    const res = await changeTeamCode(team.teamCode, codeInput);
    setBusy(false);
    if (!res.ok) { setCodeError(res.error); return; }
    setChangingCode(false);
  }

  return (
    <div style={{ background: COLORS.card, border: `1px solid ${suspended ? COLORS.leather : COLORS.line}`, borderRadius: 12, overflow: "hidden" }}>
      <button onClick={() => setExpanded((v) => !v)} style={{ width: "100%", textAlign: "left", background: "transparent", border: "none", cursor: "pointer", padding: 14, display: "flex", alignItems: "center", gap: 10 }}>
        {team.logo ? <img src={team.logo} alt="" style={{ width: 38, height: 38, borderRadius: 10, objectFit: "cover" }} /> : <div style={{ width: 38, height: 38, borderRadius: 10, background: avatarColor(team.teamName) }} />}
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 14, fontWeight: 600 }}>{team.teamName} <span style={{ fontSize: 11, color: COLORS.inkSoft, fontWeight: 400 }}>({team.teamCode})</span></div>
          <div style={{ fontSize: 11, color: suspended ? COLORS.leather : COLORS.inkSoft }}>{suspended ? "Suspended" : `Created ${timeAgo(team.createdAt)}`}</div>
        </div>
        <Icon size={16} color={COLORS.inkSoft}>{expanded ? "←" : "→"}</Icon>
      </button>

      {expanded && (
        <div style={{ padding: "0 14px 14px", display: "flex", flexDirection: "column", gap: 10 }}>
          {notice && <div style={{ background: "#EAF3E4", color: "#3B6D11", borderRadius: 8, padding: "8px 10px", fontSize: 12 }}>{notice}</div>}

          {!renaming ? (
            <button onClick={() => setRenaming(true)} style={{ textAlign: "left", background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 8, padding: "9px 12px", fontSize: 12, color: COLORS.ink, cursor: "pointer" }}>
              ✏️ Rename team
            </button>
          ) : (
            <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 8, padding: 10 }}>
              <input value={nameInput} onChange={(e) => setNameInput(e.target.value)} style={{ ...inputStyle, marginBottom: 8 }} />
              <div style={{ display: "flex", gap: 6 }}>
                <button onClick={() => setRenaming(false)} style={{ flex: 1, background: "transparent", border: `1px solid ${COLORS.line}`, borderRadius: 6, padding: "7px", fontSize: 11, cursor: "pointer" }}>Cancel</button>
                <button onClick={handleRename} disabled={busy} style={{ flex: 1, background: COLORS.willow, color: "#fff", border: "none", borderRadius: 6, padding: "7px", fontSize: 11, fontWeight: 600, cursor: "pointer" }}>Save</button>
              </div>
            </div>
          )}

          {!changingCode ? (
            <button onClick={() => setChangingCode(true)} style={{ textAlign: "left", background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 8, padding: "9px 12px", fontSize: 12, color: COLORS.ink, cursor: "pointer" }}>
              🔗 Change team code
            </button>
          ) : (
            <div style={{ background: "#fff", border: `1px solid ${COLORS.willow}`, borderRadius: 8, padding: 10 }}>
              <div style={{ fontSize: 11, color: "#854F0B", background: "#FAEEDA", borderRadius: 6, padding: "6px 8px", marginBottom: 8 }}>
                ⚠ This copies all of this team's data to the new code. Existing bookmarks/links using the old code will redirect here automatically — the old code itself can never be reused for another team.
              </div>
              <input value={codeInput} onChange={(e) => setCodeInput(e.target.value.toLowerCase())} style={{ ...inputStyle, marginBottom: 8 }} />
              {codeError && <div style={{ color: COLORS.leather, fontSize: 11, marginBottom: 8 }}>{codeError}</div>}
              <div style={{ display: "flex", gap: 6 }}>
                <button onClick={() => { setChangingCode(false); setCodeError(""); }} style={{ flex: 1, background: "transparent", border: `1px solid ${COLORS.line}`, borderRadius: 6, padding: "7px", fontSize: 11, cursor: "pointer" }}>Cancel</button>
                <button onClick={handleChangeCode} disabled={busy} style={{ flex: 1, background: COLORS.willow, color: "#fff", border: "none", borderRadius: 6, padding: "7px", fontSize: 11, fontWeight: 600, cursor: "pointer" }}>{busy ? "…" : "Confirm change"}</button>
              </div>
            </div>
          )}

          <button onClick={handleResetPin} disabled={busy} style={{ textAlign: "left", background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 8, padding: "9px 12px", fontSize: 12, color: COLORS.ink, cursor: "pointer" }}>
            🔑 Reset admin PIN
          </button>

          {suspended ? (
            <button onClick={() => reactivateTeam(team.teamCode)} style={{ textAlign: "left", background: "#EAF3E4", border: "none", borderRadius: 8, padding: "9px 12px", fontSize: 12, color: "#3B6D11", fontWeight: 600, cursor: "pointer" }}>
              ▶ Reactivate team
            </button>
          ) : (
            <button onClick={() => suspendTeam(team.teamCode)} style={{ textAlign: "left", background: "#FAEEDA", border: "none", borderRadius: 8, padding: "9px 12px", fontSize: 12, color: "#854F0B", fontWeight: 600, cursor: "pointer" }}>
              ⏸ Suspend team
            </button>
          )}

          {!confirmDelete ? (
            <button onClick={() => setConfirmDelete(true)} style={{ textAlign: "left", background: "transparent", border: `1px solid ${COLORS.leather}`, borderRadius: 8, padding: "9px 12px", fontSize: 12, color: COLORS.leather, fontWeight: 600, cursor: "pointer" }}>
              🗑 Delete team
            </button>
          ) : (
            <div style={{ background: "#FCEBEA", borderRadius: 8, padding: 10 }}>
              <div style={{ fontSize: 12, color: COLORS.leather, marginBottom: 8 }}>
                This permanently removes "{team.teamName}" — nobody will ever be able to access it again. Type the team name to confirm.
              </div>
              <input value={deleteConfirmText} onChange={(e) => setDeleteConfirmText(e.target.value)} placeholder={team.teamName} style={{ ...inputStyle, marginBottom: 8 }} />
              <div style={{ display: "flex", gap: 6 }}>
                <button onClick={() => { setConfirmDelete(false); setDeleteConfirmText(""); }} style={{ flex: 1, background: "transparent", border: `1px solid ${COLORS.line}`, borderRadius: 6, padding: "7px", fontSize: 11, cursor: "pointer" }}>Cancel</button>
                <button
                  onClick={() => deleteTeamFromRegistry(team.teamCode)}
                  disabled={deleteConfirmText.trim() !== team.teamName}
                  style={{ flex: 1, background: COLORS.leather, color: "#fff", border: "none", borderRadius: 6, padding: "7px", fontSize: 11, fontWeight: 600, cursor: "pointer", opacity: deleteConfirmText.trim() === team.teamName ? 1 : 0.5 }}
                >
                  Delete permanently
                </button>
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

            <div style={{ flex: 1 }}>
              {canPromptInstall ? (

function AdminLogin({ adminPin, setAdminPin, onSuccess, onBack, teamCode, teamName, submitPinResetRequest }) {
  const [pinInput, setPinInput] = useState("");
  const [pinConfirm, setPinConfirm] = useState("");
  const [error, setError] = useState("");
  const [showRequestForm, setShowRequestForm] = useState(false);
  const [requestedBy, setRequestedBy] = useState("");
  const [contactNumber, setContactNumber] = useState("");
  const [requestSent, setRequestSent] = useState(false);
  const [busy, setBusy] = useState(false);
  const hasPin = !!adminPin;

  async function handleContinue() {
    setError("");
    if (hasPin) {
      if (pinInput.length !== 4) { setError("Enter your 4-digit admin PIN."); return; }
      const hashed = await hashPin(pinInput);
      if (hashed !== adminPin) { setError("That PIN doesn't match. Try again."); return; }
      onSuccess();
    } else {
      if (pinInput.length !== 4) { setError("Choose a 4-digit PIN."); return; }
      if (pinInput !== pinConfirm) { setError("PINs don't match."); return; }
      const hashed = await hashPin(pinInput);
      setAdminPin(hashed);
      onSuccess();
    }
  }

  async function handleSubmitRequest() {
    setError("");
    if (!requestedBy.trim()) { setError("Enter your name."); return; }
    if (!isValidPhone(contactNumber)) { setError("Enter a valid 10-digit mobile number."); return; }
    setBusy(true);
    const res = await submitPinResetRequest({ teamCode, requestedBy, contactNumber });
    setBusy(false);
    if (!res.ok) { setError(res.error || "Could not submit — try again."); return; }
    setRequestSent(true);
  }

  return (
    <div style={{ minHeight: 480, background: COLORS.pitch, color: COLORS.cream, padding: 24 }}>
      <button onClick={onBack} style={{ ...iconBtnStyle, marginBottom: 20 }}><Icon size={16}>←</Icon> <span style={{ fontSize: 12, marginLeft: 4 }}>Back</span></button>
      <div className="w-320" style={{ margin: "40px auto 0" }}>
        <div style={{ fontSize: 11, letterSpacing: 3, textTransform: "uppercase", color: COLORS.willow, fontWeight: 600, marginBottom: 6, textAlign: "center" }}>Admin Sign-in</div>
        <div className="scorenum" style={{ fontSize: 28, textAlign: "center", marginBottom: 22 }}>{hasPin ? "Enter admin PIN" : "Set an admin PIN"}</div>

        {!showRequestForm ? (
          <div style={{ background: COLORS.pitchLight, borderRadius: 12, padding: 18 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: COLORS.willow, marginBottom: 12 }}>
              {hasPin ? <Icon size={13}>🔒</Icon> : <Icon size={13}>🛡</Icon>}
              {hasPin ? "Only the admin PIN unlocks this dashboard" : "This protects the admin dashboard going forward"}
            </div>
            <input
              className="pinbox"
              type="password" inputMode="numeric" maxLength={4}
              value={pinInput}
              onChange={(e) => setPinInput(e.target.value.replace(/\D/g, "").slice(0, 4))}
              onKeyDown={(e) => e.key === "Enter" && handleContinue()}
              placeholder="••••"
              style={{ width: "100%", textAlign: "center", letterSpacing: 8, fontSize: 20, border: `1px solid ${COLORS.pitchLight}`, borderRadius: 8, padding: "10px 12px", background: COLORS.pitch, color: "#fff", outline: "none", boxSizing: "border-box", marginBottom: hasPin ? 12 : 8 }}
            />
            {!hasPin && (
              <input
                className="pinbox"
                type="password" inputMode="numeric" maxLength={4}
                value={pinConfirm}
                onChange={(e) => setPinConfirm(e.target.value.replace(/\D/g, "").slice(0, 4))}
                onKeyDown={(e) => e.key === "Enter" && handleContinue()}
                placeholder="Confirm PIN"
                style={{ width: "100%", textAlign: "center", letterSpacing: 8, fontSize: 20, border: `1px solid ${COLORS.pitchLight}`, borderRadius: 8, padding: "10px 12px", background: COLORS.pitch, color: "#fff", outline: "none", boxSizing: "border-box", marginBottom: 12 }}
              />
            )}
            {error && <div style={{ color: "#F0A6A4", fontSize: 12, marginBottom: 10 }}>{error}</div>}
            <button onClick={handleContinue} style={{ width: "100%", background: COLORS.willow, color: "#fff", border: "none", borderRadius: 8, padding: "10px", fontSize: 14, fontWeight: 600, cursor: "pointer" }}>
              Continue
            </button>
            {hasPin && (
              <button onClick={() => { setShowRequestForm(true); setError(""); setRequestSent(false); }} style={{ width: "100%", background: "transparent", border: "none", color: "#CFE0D3", fontSize: 12, marginTop: 12, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 5 }}>
                <Icon size={12}>🔑</Icon> Forgot your PIN?
              </button>
            )}
          </div>
        ) : requestSent ? (
          <div style={{ background: COLORS.pitchLight, borderRadius: 12, padding: 18, textAlign: "center" }}>
            <div style={{ fontSize: 30, marginBottom: 10 }}>✅</div>
            <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 8 }}>Request sent</div>
            <div style={{ fontSize: 12, color: "#CFE0D3", marginBottom: 16 }}>
              Your Super Admin will review this and reset the PIN if it checks out. You'll be able to set a new PIN the next time you sign in.
            </div>

            />
            <div style={{ fontSize: 11, color: "#9BAE9E", marginBottom: 6 }}>Contact number given when this team was created</div>
            <input
              type="tel" inputMode="numeric" maxLength={10}
              value={contactNumber}

              onKeyDown={(e) => e.key === "Enter" && handleSubmitRequest()}
              placeholder="10-digit mobile number"
              style={{ width: "100%", background: COLORS.pitch, border: `1px solid ${COLORS.pitchLight}`, borderRadius: 8, padding: "10px 12px", color: "#fff", fontSize: 13, outline: "none", boxSizing: "border-box", marginBottom: 12 }}
            />
            {error && <div style={{ color: "#F0A6A4", fontSize: 12, marginBottom: 10 }}>{error}</div>}
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => { setShowRequestForm(false); setError(""); }} style={{ flex: 1, background: "transparent", border: `1px solid ${COLORS.pitch}`, color: COLORS.cream, borderRadius: 8, padding: "10px", fontSize: 13, cursor: "pointer" }}>

                {busy ? "…" : "Submit request"}
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// A player's own "profile" card — always visible above whichever tab
// they're on, same spot every time, rather than a whole new tab for one
// field. Self-service only: a player manages their own clip here; admin
// can only remove one (see PlayersTab), never add or edit someone else's.
// One independent slot — Batting or Bowling, never both sharing a single
// field, so adding one can never silently overwrite the other the way a
// single tagged slot used to.
function ClipSlot({ label, icon, url, onSave, onRemove, onView }) {
  const [editing, setEditing] = useState(false);
  const [input, setInput] = useState(url || "");
  const [saving, setSaving] = useState(false);

  async function handleSave() {
    if (!input.trim()) return;
    setSaving(true);
    await onSave(input.trim());
    setSaving(false);
    setEditing(false);
  }
  function handleRemove() {
    onRemove();
    setInput("");
    setEditing(false);
  }

  if (!editing && !url) {
    return (
      <button
        onClick={() => { setInput(""); setEditing(true); }}
        style={{
          flex: "1 1 130px", background: "transparent", border: `1px dashed ${COLORS.willow}`, color: COLORS.leather,
          borderRadius: 10, padding: "12px 8px", fontSize: 11.5, fontWeight: 600, cursor: "pointer",
          display: "flex", flexDirection: "column", alignItems: "center", gap: 4,
        }}
      >
        <Icon size={16}>{icon}</Icon>
        Add {label}
      </button>
    );
  }

  if (!editing) {
    return (
      <div style={{ flex: "1 1 130px", background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: "8px 10px" }}>
        <button onClick={onView} style={{ background: "transparent", border: "none", cursor: "pointer", display: "flex", alignItems: "center", gap: 8, padding: 0, marginBottom: 4, width: "100%", textAlign: "left" }}>
          <div style={{ width: 24, height: 24, borderRadius: "50%", background: COLORS.willow, display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontSize: 9, flexShrink: 0 }}>▶</div>
          <span style={{ fontSize: 12, fontWeight: 600 }}>{icon} {label}</span>
        </button>
        <button
          onClick={() => { setInput(url || ""); setEditing(true); }}
          style={{ background: "transparent", border: "none", color: COLORS.inkSoft, fontSize: 10.5, textDecoration: "underline", cursor: "pointer", padding: 0 }}
        >
          Edit
        </button>
      </div>
    );
  }

  return (
    <div style={{ flex: "1 1 100%", background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: 12 }}>
      <div style={{ fontSize: 11.5, fontWeight: 600, color: COLORS.inkSoft, marginBottom: 8 }}>{icon} {label} clip</div>
      <input
        value={input} onChange={(e) => setInput(e.target.value)}
        placeholder="Paste a YouTube, Drive, or Instagram link…"
        style={{ ...inputStyle, fontSize: 12.5, padding: "8px 10px", marginBottom: 8 }}
      />
      <div style={{ display: "flex", gap: 6 }}>
        <button onClick={() => setEditing(false)} style={{ flex: 1, background: "transparent", border: `1px solid ${COLORS.line}`, borderRadius: 6, padding: "7px", fontSize: 11, cursor: "pointer" }}>
          Cancel
        </button>
        {url && (
          <button onClick={handleRemove} style={{ flex: 1, background: "transparent", border: `1px solid ${COLORS.leather}`, color: COLORS.leather, borderRadius: 6, padding: "7px", fontSize: 11, fontWeight: 600, cursor: "pointer" }}>
            Remove
          </button>
        )}
        <button
          onClick={handleSave} disabled={!input.trim() || saving}
          style={{ flex: 1, background: COLORS.willow, color: "#fff", border: "none", borderRadius: 6, padding: "7px", fontSize: 11, fontWeight: 600, cursor: input.trim() ? "pointer" : "default", opacity: input.trim() ? 1 : 0.6 }}
        >
          {saving ? "…" : "Save"}
        </button>
      </div>
    </div>
  );
}

function PlayerArea({ players, pins, setPins, authedPlayerId, setAuthedPlayerId, onBack, days, toggleVoteFor, toggleDeclineFor, subs, toggleSub, activeMonth, rates, totals, closingBalance, weekendExceptions, monthPayments, isMonthLocked, submitRegistration, photos, uploadOwnPhoto, matches, toggleMatchAvailable, toggleMatchNotAvailable, setCarpoolRole, updateCarpoolOffer, updateCarpoolLocation, startSharingLiveLocation, stopSharingLiveLocation, updatePlayerFcmToken, updatePendingRegistrationFcmToken, joinCarpoolDriver, leaveCarpoolRide, cancelCarpoolEntry, switchTeam, teamRecord, paymentDefault, uploadMatchProof, removeMatchProof, setPlayerVideo, removePlayerVideo, initialSelectedId, rememberProfile, submitPlayerPinResetRequest, marketplace, postMarketplaceListing, updateMarketplaceListing, toggleMarketplaceInterest, closeMarketplaceListing, deleteMarketplaceListing, onMatchLiveStarted, onMatchLiveStopped, onNetsLiveStarted, onNetsLiveStopped }) {

          {playerTab === "subscription" && (
            <>
              <div style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: 18 }}>
                <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 2 }}>{monthLabel(activeMonth)}</div>
                <div style={{ fontSize: 12, color: COLORS.inkSoft, marginBottom: 12 }}>₹{rates.subAmount} covers your share of nets fees and balls for the month.</div>
                <button
                  onClick={() => !isMonthLocked && toggleSub(authedPlayer.id)}
                  disabled={isMonthLocked}
                  className="chip"
                  style={{
                    width: "100%", cursor: isMonthLocked ? "not-allowed" : "pointer", borderRadius: 10, padding: "12px 16px", fontSize: 14, fontWeight: 600,
                    border: `1px solid ${subbed ? COLORS.leather : COLORS.line}`,
                    background: subbed ? COLORS.leather : "transparent",
                    color: subbed ? "#fff" : COLORS.ink,
                    display: "flex", alignItems: "center", justifyContent: "center", gap: 8, opacity: isMonthLocked ? 0.6 : 1, marginBottom: subbed ? 10 : 0,
                  }}
                >
                  {subbed ? <Icon size={16}>✓</Icon> : null}
                  {subbed ? `Subscribed — ₹${rates.subAmount}` : `Tap to subscribe (₹${rates.subAmount})`}
                </button>
                {subbed && (
                  <div style={{
                    borderRadius: 8, padding: "9px 10px", fontSize: 11, textAlign: "center", fontWeight: 600,
                    background: paid ? "#EAF3E4" : "#FAEEDA", color: paid ? "#3B6D11" : "#854F0B",
                  }}>
                    {paid ? "✓ Payment confirmed by admin" : "⏳ Pending admin confirmation"}
                  </div>
                )}
              </div>

              <div style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: 18 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                  <span style={{ fontSize: 12, color: COLORS.inkSoft, fontWeight: 600 }}>Who's subscribed</span>
                  <span style={{ fontSize: 11, background: "#EEEAD9", color: COLORS.inkSoft, padding: "3px 10px", borderRadius: 20 }}>
                    {subscribedPlayers.length} of {players.length}
                  </span>
                </div>
                {subscribedPlayers.length === 0 ? (
                  <div style={{ fontSize: 13, color: COLORS.inkSoft }}>No one's subscribed yet this month.</div>
                ) : (
                  <AvatarStack people={subscribedPlayers} currentPlayerId={authedPlayer.id} photos={photos} onViewPhoto={openPhoto} onViewClip={openClip} />
                )}
                <div style={{ fontSize: 10, color: COLORS.inkSoft, marginTop: 10, borderTop: `1px solid ${COLORS.line}`, paddingTop: 8 }}>
                  Shows who's opted in — not who's paid. Payment status stays admin-confirmed only.
                </div>
              </div>

              <div style={{ background: COLORS.pitch, color: COLORS.cream, borderRadius: 12, padding: 18 }}>
                <div style={{ fontSize: 11, letterSpacing: 1, textTransform: "uppercase", color: COLORS.willow, marginBottom: 10 }}>{monthLabel(activeMonth)} club finances</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                  <div><div className="scorenum" style={{ fontSize: 20 }}>{totals.hours} hr</div><div style={{ fontSize: 10, color: "#9BAE9E" }}>Nets used</div></div>
                  <div><div className="scorenum" style={{ fontSize: 20 }}>{totals.balls}</div><div style={{ fontSize: 10, color: "#9BAE9E" }}>Balls used</div></div>
                  <div><div className="scorenum" style={{ fontSize: 20 }}>{fmtINR(totals.collected)}</div><div style={{ fontSize: 10, color: "#9BAE9E" }}>Collected</div></div>
                  <div><div className="scorenum" style={{ fontSize: 20, color: closingBalance < 0 ? "#E39A98" : "#97C459" }}>{fmtINR(Math.abs(closingBalance))}</div><div style={{ fontSize: 10, color: "#9BAE9E" }}>{closingBalance < 0 ? "Shortfall" : "Balance"}</div></div>
                </div>
                <div style={{ fontSize: 10, color: "#9BAE9E", borderTop: "1px solid #2C4C38", marginTop: 10, paddingTop: 8 }}>
                  Same numbers the admin sees, for the club's transparency.
                </div>
              </div>
            </>
          )}
          {playerTab === "matches" && (
            <PlayerMatchesView
              matches={matches} players={players} authedPlayer={authedPlayer}
              toggleMatchAvailable={toggleMatchAvailable} toggleMatchNotAvailable={toggleMatchNotAvailable}
              setCarpoolRole={setCarpoolRole} updateCarpoolOffer={updateCarpoolOffer} updateCarpoolLocation={updateCarpoolLocation}
              startSharingLiveLocation={startSharingLiveLocation} stopSharingLiveLocation={stopSharingLiveLocation}
              joinCarpoolDriver={joinCarpoolDriver} leaveCarpoolRide={leaveCarpoolRide} cancelCarpoolEntry={cancelCarpoolEntry}
              photos={photos} onViewPhoto={openPhoto} onViewClip={openClip}
              paymentDefault={paymentDefault} uploadMatchProof={uploadMatchProof} removeMatchProof={removeMatchProof}
              onMatchLiveStarted={onMatchLiveStarted} onMatchLiveStopped={onMatchLiveStopped}
              teamName={teamRecord ? teamRecord.teamName : ""}
            />
          )}
          {playerTab === "gear" && (
            <MarketplaceTab
              marketplace={marketplace} photos={photos} players={players}
              isAdmin={false} viewerId={authedPlayer.id}
              teamName={teamRecord ? teamRecord.teamName : ""}
              onPost={(fields) => postMarketplaceListing(fields, authedPlayer.id)}
              onUpdate={updateMarketplaceListing}
              onToggleInterest={toggleMarketplaceInterest}
              onClose={closeMarketplaceListing}
              onDelete={deleteMarketplaceListing}
              onViewPhoto={openPhoto}
            />
          )}
        </div>

        <div style={{ position: "fixed", left: 0, right: 0, bottom: 0, display: "flex", justifyContent: "center", zIndex: 50 }}>
          <div className="w-500" style={{ width: "100%" }}>
            <div style={{ background: COLORS.pitchLight, margin: "0 8px 8px", borderRadius: 16, padding: "8px 4px", display: "flex", justifyContent: "space-around", boxShadow: "0 -2px 12px rgba(0,0,0,0.18)" }}>
              <button onClick={() => setPlayerTab("attendance")} style={{ background: "transparent", border: "none", cursor: "pointer", textAlign: "center", color: playerTab === "attendance" ? COLORS.cream : "#7C8E80", padding: "4px 8px" }}>
                <div><Icon size={18}>📅</Icon></div>
                <div style={{ fontSize: 9, marginTop: 2 }}>Attendance</div>
              </button>
              <button onClick={() => setPlayerTab("subscription")} style={{ background: "transparent", border: "none", cursor: "pointer", textAlign: "center", color: playerTab === "subscription" ? COLORS.cream : "#7C8E80", padding: "4px 8px" }}>
                <div><Icon size={18}>💰</Icon></div>
                <div style={{ fontSize: 9, marginTop: 2 }}>Subscription</div>
              </button>
              <button onClick={() => setPlayerTab("matches")} style={{ background: "transparent", border: "none", cursor: "pointer", textAlign: "center", color: playerTab === "matches" ? COLORS.cream : "#7C8E80", padding: "4px 8px" }}>
                <div><Icon size={18}>🏏</Icon></div>
                <div style={{ fontSize: 9, marginTop: 2 }}>Matches</div>
              </button>
              <button onClick={() => setPlayerTab("gear")} style={{ background: "transparent", border: "none", cursor: "pointer", textAlign: "center", color: playerTab === "gear" ? COLORS.cream : "#7C8E80", padding: "4px 8px" }}>
                <div><Icon size={18}>🛒</Icon></div>
                <div style={{ fontSize: 9, marginTop: 2 }}>Gear</div>
              </button>
            </div>
          </div>
        </div>
      </div>
      {viewingPhoto && <PhotoViewerModal name={viewingPhoto.name} photo={viewingPhoto.photo} preserveAspect={viewingPhoto.preserveAspect} onClose={() => setViewingPhoto(null)} />}
      {viewingClip && <ClipViewerModal playerName={viewingClip.player.name} tag={viewingClip.slotType} url={viewingClip.slotType === "Bowling" ? viewingClip.player.bowlingVideoUrl : viewingClip.player.battingVideoUrl} onClose={() => setViewingClip(null)} />}
      {showNetsLiveModal && (
        <LiveBroadcastModal
          matchLabel={`Nets session · ${fmtDateShort(selectedDate)}`}
          broadcasterId={authedPlayer.id}
          broadcasterName={authedPlayer.name}
          onClose={() => setShowNetsLiveModal(false)}
          onStarted={(meetingId) => onNetsLiveStarted(selectedDate, meetingId, authedPlayer.id)}
          onStopped={() => onNetsLiveStopped && onNetsLiveStopped(selectedDate)}
        />
      )}
      </>
    );
  }

  async function handleContinue() {
    setError("");
    if (!selectedId) { setError("Pick your name first."); return; }
    const hasPin = !!pins[selectedId];
    console.log("[TEAM-DEBUG] PlayerArea.handleContinue: teamCode=", teamRecord && teamRecord.teamCode, "selectedId=", selectedId, "selectedName=", players.find((p) => p.id === selectedId)?.name, "hasPin=", hasPin, "playersInScope=", players.length);
    if (hasPin) {
      if (pinInput.length !== 4) { setError("Enter your 4-digit PIN."); return; }
      const hashed = await hashPin(pinInput);
      const matchesStoredHash = pins[selectedId] === hashed;
      console.log("[TEAM-DEBUG] PIN check result:", matchesStoredHash, "storedHash=", pins[selectedId], "computedHash=", hashed);
      if (!matchesStoredHash) { setError("That PIN doesn't match. Try again."); return; }
      setAuthedPlayerId(selectedId);
    } else {
      if (pinInput.length !== 4) { setError("Choose a 4-digit PIN."); return; }
      if (pinInput !== pinConfirm) { setError("PINs don't match."); return; }
      const hashed = await hashPin(pinInput);
      setPins((prev) => ({ ...prev, [selectedId]: hashed }));
      setAuthedPlayerId(selectedId);
    }
    console.log("[TEAM-DEBUG] PlayerArea.handleContinue: setAuthedPlayerId ->", selectedId, "for teamCode=", teamRecord && teamRecord.teamCode);
    if (rememberProfile) {
      const p = players.find((pl) => pl.id === selectedId);
      if (p) rememberProfile(selectedId, p.name);
    }
  }

  async function handleForgotPin() {
    setError("");
    if (!selectedId || !submitPlayerPinResetRequest) return;
    const res = await submitPlayerPinResetRequest(selectedId);
    if (!res.ok) { setError(res.error || "Could not send request — try again."); return; }
    setForgotSent(true);
  }

  const hasPin = selectedId ? !!pins[selectedId] : false;

  // "Register" and "already a player, just no PIN set yet" read identically
  // as "I'm new here" otherwise — this makes the actual fork an explicit
  // choice instead of something inferred from a failed search.
  if (preAuthView === "fork") {
    return (
      <div style={{ minHeight: 480, background: COLORS.pitch, color: COLORS.cream, padding: 24 }}>
        <button onClick={onBack} style={{ ...iconBtnStyle, marginBottom: 20 }}><Icon size={16}>←</Icon> <span style={{ fontSize: 12, marginLeft: 4 }}>Back</span></button>
        <div className="w-340" style={{ margin: "0 auto" }}>
          <div style={{ fontSize: 11, letterSpacing: 3, textTransform: "uppercase", color: COLORS.willow, fontWeight: 600, marginBottom: 6, textAlign: "center" }}>Player Sign-in</div>
          <div className="scorenum" style={{ fontSize: 28, textAlign: "center", marginBottom: 22 }}>Have you played here before?</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <button
              onClick={() => setPreAuthView("login")}
              style={{ textAlign: "left", background: COLORS.willow, color: "#fff", border: "none", borderRadius: 12, padding: "14px 16px", cursor: "pointer" }}
            >
              <div style={{ fontSize: 14, fontWeight: 700 }}>Yes — find my name</div>
              <div style={{ fontSize: 11.5, opacity: 0.9, marginTop: 2 }}>I'm already on the roster</div>
            </button>
            <button
              onClick={() => { setPreAuthView("register"); setRegError(""); }}
              style={{ textAlign: "left", background: COLORS.pitchLight, color: COLORS.cream, border: "none", borderRadius: 12, padding: "14px 16px", cursor: "pointer" }}
            >
              <div style={{ fontSize: 14, fontWeight: 700 }}>No — I'm new here</div>
              <div style={{ fontSize: 11.5, color: "#9BAE9E", marginTop: 2 }}>Register (needs admin approval)</div>
            </button>
          </div>
        </div>
      </div>
    );
  }

  if (preAuthView === "forgot") {
    return (
      <div style={{ minHeight: 480, background: COLORS.pitch, color: COLORS.cream, padding: 24 }}>
        <button onClick={() => { setPreAuthView("login"); setForgotSent(false); setError(""); }} style={{ ...iconBtnStyle, marginBottom: 20 }}><Icon size={16}>←</Icon> <span style={{ fontSize: 12, marginLeft: 4 }}>Back</span></button>
        <div className="w-340" style={{ margin: "0 auto" }}>
          <div style={{ fontSize: 11, letterSpacing: 3, textTransform: "uppercase", color: COLORS.willow, fontWeight: 600, marginBottom: 6, textAlign: "center" }}>Player Sign-in</div>
          <div className="scorenum" style={{ fontSize: 28, textAlign: "center", marginBottom: 22 }}>Forgot your PIN?</div>
          {forgotSent ? (
            <div style={{ background: COLORS.pitchLight, borderRadius: 12, padding: 18, textAlign: "center" }}>
              <div style={{ fontSize: 30, marginBottom: 10 }}>✅</div>
              <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 8 }}>Request sent</div>
              <div style={{ fontSize: 12, color: "#CFE0D3", marginBottom: 16 }}>
                Your admin can see this in their Players list. Come back and sign in once they've reset it.
              </div>
              <button onClick={() => { setPreAuthView("login"); setForgotSent(false); }} style={{ width: "100%", background: COLORS.willow, color: "#fff", border: "none", borderRadius: 8, padding: "10px", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
                ← Back to sign-in
              </button>
            </div>
          ) : (
            <div style={{ background: COLORS.pitchLight, borderRadius: 12, padding: 18 }}>
              <div style={{ fontSize: 12, color: "#CFE0D3", marginBottom: 14 }}>
                This sends your team admin a flag next to your name in their Players list — no approval needed elsewhere, they can already reset any player's PIN directly.
              </div>
              {error && <div style={{ color: "#F0A6A4", fontSize: 12, marginBottom: 10 }}>{error}</div>}
              <button onClick={handleForgotPin} style={{ width: "100%", background: COLORS.willow, color: "#fff", border: "none", borderRadius: 8, padding: "10px", fontSize: 14, fontWeight: 600, cursor: "pointer" }}>
                Send request to admin
              </button>
            </div>
          )}
        </div>
      </div>
    );
  }

  if (preAuthView === "register") {
    return (
      <RegisterView
        onBack={() => { setPreAuthView("fork"); setRegError(""); }}
        regName={regName} setRegName={setRegName}
        regPin={regPin} setRegPin={setRegPin}
        regPinConfirm={regPinConfirm} setRegPinConfirm={setRegPinConfirm}
        regPhoto={regPhoto} setRegPhoto={setRegPhoto}
        regDob={regDob} setRegDob={setRegDob}
        regError={regError} setRegError={setRegError}
        regBusy={regBusy} setRegBusy={setRegBusy}
        submitRegistration={submitRegistration}
        onSubmitted={(id) => { setPendingRegId(id); setPreAuthView("registered"); }}
      />
    );
  }

  if (preAuthView === "registered") {
    return (
      <div style={{ minHeight: 480, background: COLORS.pitch, color: COLORS.cream, padding: 24, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", textAlign: "center" }}>
        <div style={{ fontSize: 36, marginBottom: 12 }}>✅</div>
        <div className="scorenum" style={{ fontSize: 24, marginBottom: 10 }}>Registration submitted</div>
        <div style={{ fontSize: 13, color: "#CFE0D3", maxWidth: 300, marginBottom: 22 }}>
          Ask your admin to approve you, then come back and log in with the name and PIN you just set.
        </div>
        {pendingRegId && updatePendingRegistrationFcmToken && (
          <div style={{ maxWidth: 300, marginBottom: 22 }}>
            {regPushDone ? (
              <div style={{ fontSize: 12, color: "#B9D9A6" }}>🔔 We'll notify you the moment you're approved.</div>
            ) : (
              <>
                <button onClick={handleRegisterPush} disabled={regPushBusy} style={{ background: "transparent", border: `1px solid ${COLORS.willow}`, color: COLORS.willow, borderRadius: 8, padding: "9px 16px", fontSize: 12.5, fontWeight: 600, cursor: regPushBusy ? "default" : "pointer" }}>
                  {regPushBusy ? "…" : "🔔 Notify me when I'm approved"}
                </button>
                {regPushError && <div style={{ fontSize: 11, color: "#E0A79E", marginTop: 8 }}>{regPushError}</div>}
              </>
            )}
          </div>
        )}
        <button onClick={() => { setPreAuthView("login"); setRegName(""); setRegPin(""); setRegPinConfirm(""); setRegPhoto(null); setRegDob(""); }} style={{ background: COLORS.willow, color: "#fff", border: "none", borderRadius: 8, padding: "10px 20px", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
          Back to sign-in
        </button>
      </div>
    );
  }

  return (
    <>
    <div style={{ minHeight: 480, background: COLORS.pitch, color: COLORS.cream, padding: 24 }}>
      <button onClick={onBack} style={{ ...iconBtnStyle, marginBottom: 20 }}><Icon size={16}>←</Icon> <span style={{ fontSize: 12, marginLeft: 4 }}>Back</span></button>
      <div className="w-340" style={{ margin: "0 auto" }}>
        <div style={{ fontSize: 11, letterSpacing: 3, textTransform: "uppercase", color: COLORS.willow, fontWeight: 600, marginBottom: 6, textAlign: "center" }}>Player Sign-in</div>
        <div className="scorenum" style={{ fontSize: 28, textAlign: "center", marginBottom: 22 }}>Who are you?</div>

        {players.length === 0 ? (
          <div style={{ fontSize: 12, color: "#CFE0D3", textAlign: "center", marginBottom: 20 }}>No players yet — be the first to register below.</div>
        ) : selectedId ? (
          <div style={{ display: "flex", justifyContent: "center", marginBottom: 16 }}>
            <div style={{
              display: "flex", alignItems: "center", gap: 8, borderRadius: 20, padding: "6px 8px 6px 6px",
              background: COLORS.willow, border: `1px solid ${COLORS.willow}`,
            }}>
              <PlayerAvatar name={players.find((p) => p.id === selectedId)?.name || ""} photo={photos && photos[selectedId]} size={26} border={false} />
              <span style={{ fontSize: 14, color: "#fff", fontWeight: 600 }}>{players.find((p) => p.id === selectedId)?.name}</span>
              <button
                onClick={() => { setSelectedId(""); setSearchQuery(""); setPinInput(""); setPinConfirm(""); setError(""); }}
                style={{ background: "rgba(255,255,255,0.2)", border: "none", borderRadius: "50%", width: 20, height: 20, color: "#fff", cursor: "pointer", fontSize: 13, lineHeight: 1 }}
              >
                ×
              </button>
            </div>
          </div>
        ) : (
          <div style={{ marginBottom: 16 }}>
            <input
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              placeholder="Filter by name…"
              autoFocus
              style={{
                width: "100%", background: COLORS.pitchLight, border: `1px solid ${COLORS.pitchLight}`, borderRadius: 10,
                padding: "12px 14px", color: "#fff", fontSize: 15, outline: "none", boxSizing: "border-box", marginBottom: 12,
              }}
            />
            {(() => {
              const q = searchQuery.trim().toLowerCase();
              // Nothing renders until there's something to search for — a
              // full-roster grid is exactly the thing that stops scaling
              // once a team has more than a handful of players.
              if (!q) {
                return (
                  <div style={{ fontSize: 13, color: "#9BAE9E", textAlign: "center", padding: "20px 6px" }}>
                    Start typing to find yourself
                  </div>
                );
              }
              const MAX_SHOWN = 9;
              const matches = players.filter((p) => p.name.toLowerCase().includes(q));
              const shown = matches.slice(0, MAX_SHOWN);
              if (shown.length === 0) {
                return (
                  <div style={{ fontSize: 13, color: "#CFE0D3", textAlign: "center" }}>
                    No player found with that name — check the spelling above.
                  </div>
                );
              }
              return (
                <>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8 }}>
                    {shown.map((p) => (
                      <button
                        key={p.id}
                        onClick={() => { setSelectedId(p.id); setSearchQuery(""); setPinInput(""); setPinConfirm(""); setError(""); }}
                        style={{
                          display: "flex", flexDirection: "column", alignItems: "center", gap: 5,
                          background: COLORS.pitchLight, border: "none", borderRadius: 10, padding: "9px 4px", cursor: "pointer",
                        }}
                      >
                        <PlayerAvatar name={p.name} photo={photos && photos[p.id]} size={34} border={false} />
                        <span style={{ fontSize: 10.5, color: "#fff", textAlign: "center", lineHeight: 1.25 }}>{p.name}</span>
                      </button>
                    ))}
                  </div>
                  {matches.length > shown.length && (
                    <div style={{ fontSize: 11, color: "#9BAE9E", textAlign: "center", marginTop: 8 }}>
                      {matches.length - shown.length} more match — keep typing to narrow it down
                    </div>
                  )}
                </>
              );
            })()}
          </div>
        )}

        <div style={{ textAlign: "center", marginBottom: 20 }}>
          <button onClick={() => { setPreAuthView("fork"); setSelectedId(""); setSearchQuery(""); }} style={{ background: "transparent", border: "none", color: "#9BAE9E", fontSize: 12, cursor: "pointer" }}>
            Don't see yourself? ← Back
          </button>
        </div>

        {selectedId && (
          <div style={{ background: COLORS.pitchLight, borderRadius: 12, padding: 18 }}>
            <div style={{
              borderRadius: 9, padding: "8px 10px", fontSize: 10.5, fontWeight: 600, display: "flex", alignItems: "center", gap: 6, marginBottom: 12,
              background: hasPin ? "rgba(120,200,120,0.16)" : "rgba(217,164,97,0.2)", color: hasPin ? "#8FD37A" : COLORS.willow,
            }}>
              {hasPin ? <Icon size={13}>🔒</Icon> : <Icon size={13}>🛡</Icon>}
              {hasPin
                ? `Welcome back, ${players.find((p) => p.id === selectedId)?.name.split(" ")[0]} — enter your PIN`
                : "No PIN on file yet — set one now for next time"}
            </div>
            <input
              className="pinbox"
              type="password" inputMode="numeric" maxLength={4}
              value={pinInput}
              onChange={(e) => setPinInput(e.target.value.replace(/\D/g, "").slice(0, 4))}
              onKeyDown={(e) => e.key === "Enter" && handleContinue()}
              placeholder="••••"
              style={{ width: "100%", textAlign: "center", letterSpacing: 8, fontSize: 20, border: `1px solid ${COLORS.pitchLight}`, borderRadius: 8, padding: "10px 12px", background: COLORS.pitch, color: "#fff", outline: "none", boxSizing: "border-box", marginBottom: hasPin ? 12 : 8 }}
            />
            {!hasPin && (
              <input
                className="pinbox"
                type="password" inputMode="numeric" maxLength={4}
                value={pinConfirm}
                onChange={(e) => setPinConfirm(e.target.value.replace(/\D/g, "").slice(0, 4))}
                onKeyDown={(e) => e.key === "Enter" && handleContinue()}
                placeholder="Confirm PIN"
                style={{ width: "100%", textAlign: "center", letterSpacing: 8, fontSize: 20, border: `1px solid ${COLORS.pitchLight}`, borderRadius: 8, padding: "10px 12px", background: COLORS.pitch, color: "#fff", outline: "none", boxSizing: "border-box", marginBottom: 12 }}
              />
            )}
            {error && <div style={{ color: "#F0A6A4", fontSize: 12, marginBottom: 10 }}>{error}</div>}
            <button onClick={handleContinue} style={{ width: "100%", background: COLORS.willow, color: "#fff", border: "none", borderRadius: 8, padding: "10px", fontSize: 14, fontWeight: 600, cursor: "pointer" }}>
              {hasPin ? "Continue" : "Set PIN & continue"}
            </button>
            {hasPin && submitPlayerPinResetRequest && (
              <button onClick={() => { setPreAuthView("forgot"); setError(""); }} style={{ width: "100%", background: "transparent", border: "none", color: "#9BAE9E", fontSize: 11.5, marginTop: 10, cursor: "pointer" }}>
                Forgot PIN?
              </button>
            )}
          </div>
        )}
      </div>
    </div>
    {viewingPhoto && <PhotoViewerModal name={viewingPhoto.name} photo={viewingPhoto.photo} preserveAspect={viewingPhoto.preserveAspect} onClose={() => setViewingPhoto(null)} />}
    {viewingClip && <ClipViewerModal playerName={viewingClip.player.name} tag={viewingClip.slotType} url={viewingClip.slotType === "Bowling" ? viewingClip.player.bowlingVideoUrl : viewingClip.player.battingVideoUrl} onClose={() => setViewingClip(null)} />}
    </>
  );
}

function PlayerMatchesView({ matches, players, authedPlayer, toggleMatchAvailable, toggleMatchNotAvailable, setCarpoolRole, updateCarpoolOffer, updateCarpoolLocation, startSharingLiveLocation, stopSharingLiveLocation, joinCarpoolDriver, leaveCarpoolRide, cancelCarpoolEntry, photos, onViewPhoto, onViewClip, paymentDefault, uploadMatchProof, removeMatchProof, onMatchLiveStarted, onMatchLiveStopped, teamName }) {
  const matchList = Object.values(matches || {}).sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  const canPayInline = isMobileDevice();

  // match's tab choice onto another.
  const [activeTabs, setActiveTabs] = useState({});
  // Which match's Go Live modal is open, if any — a single shared value

    setLocating(true);
    const loc = await getCurrentLocation();
    setLocating(false);
    if (loc) updateCarpoolLocation(matchId, playerId, loc);

  async function handleCopyPerformers(m) {
    const ok = await copyText(buildMatchPerformersMessage(m, players, teamName));

        <div style={{ fontSize: 28, marginBottom: 8 }}>🏏</div>

        const waitlistIds = m.waitlist || [];
        const waitlistPosition = waitlistIds.indexOf(authedPlayer.id) + 1; // 0 if not on it
        const waitlisted = waitlistPosition > 0;
        // .map() over the ids, not players.filter() — availableIds is
        // already in vote order (first to confirm is first in the list).
        const availablePlayers = availableIds.map((id) => players.find((p) => p.id === id)).filter(Boolean);
        const notAvailablePlayers = notAvailableIds.map((id) => players.find((p) => p.id === id)).filter(Boolean);
        const playedIds = computePlayedIds(m);
        const isPlaying = playedIds.includes(authedPlayer.id);
        const paid = !!(m.payments || {})[authedPlayer.id];
        const perPlayerFee = m.totalCost && playedIds.length ? Number(m.totalCost) / playedIds.length : 0;
        const matchOwnQr = m.hasPaymentQr ? photos[matchQrKey(m.id)] : null;
        const effectiveQr = matchOwnQr || (paymentDefault && paymentDefault.qr);
        const matchBanner = m.hasBanner ? photos[matchBannerKey(m.id)] : null;
        const performers = m.performers || {};
        const filledPerformerCount = PERFORMER_CATEGORIES.filter((c) => performers[c.key] && performers[c.key].playerId).length;
        // A match's own upiNumber is only ever filled in once, at creation

        // team default afterwards. So if the admin fixes the default later
        // (e.g. adding the missing "@bank" suffix), older matches keep
        // showing the stale value unless they fall back the same way QR does.
        const effectiveUpiNumber = (m.upiNumber || (paymentDefault && paymentDefault.upiNumber) || "").trim();
        const hasProof = !!(m.paymentProofFlags || {})[authedPlayer.id];

                </span>

            </button>

            {expanded && (
            <div style={{ padding: "0 16px 16px" }}>
            {matchBanner && (

                  <>

                    <a href={m.locationUrl} target="_blank" rel="noreferrer" style={{ color: COLORS.willow }}>📍 View location</a>
                  </>
