<script>

<script>
  const firebaseConfig = {
  apiKey: "AIzaSyB031BX7NGHGoSR8JsGseNHgXZniwpMD_o",
  authDomain: "cricket-nets-tracker.firebaseapp.com",
  projectId: "cricket-nets-tracker",
  storageBucket: "cricket-nets-tracker.firebasestorage.app",
  messagingSenderId: "81044885705",
  appId: "1:81044885705:web:329709ad243fb2ef2a7d18",
};
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const COLLECTION = "nets_data";

  // Push notifications: the VAPID key is a public key (safe to sit here,
  // same category as apiKey above) — it just lets a browser prove to FCM
  // that a token really was requested by this app. The shared secret is
  // NOT a real secret (this file is view-source-able) — it only keeps the
  // Worker from being casually discovered and abused, not a determined
  // attacker. Actual send-time authority lives in the Worker's own
  // Firebase service-account credential, which never appears here.
  const PUSH_VAPID_KEY = "BPXwfdTNtH3mkryscjFp_pirklYd7fSo0apFWWLgr5DuDOYoKYycAzSUyZpW_t65urxOLRlHxmoetfxfbkk1LuM";
  const PUSH_WORKER_URL = "https://pavilion-push.sivavasi8.workers.dev";
  const PUSH_SHARED_SECRET = "vK4Tq41nBB5eKlnlemgzYPDJavfwu9XrSV-pPDh0NFM";
  // Fire-and-forget — a failed or unreachable Worker just means no push
  // arrives this time, same "no error to surface" stance as the
  // carpool/location features. Never blocks whatever the caller was doing.
  async function sendPushNotification({ tokens, title, body }) {
    if (!tokens || tokens.length === 0) return;
    if (!PUSH_WORKER_URL || PUSH_WORKER_URL.startsWith("PASTE_")) return;
    try {
      await fetch(PUSH_WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ secret: PUSH_SHARED_SECRET, tokens, title, body }),
      });
    } catch (e) {
      console.error("push send failed", e);
    }
  }
  // Same Worker, same shared secret, but for the /live/* routes that broker
  // Cloudflare RealtimeKit meetings — unlike sendPushNotification above,
  // callers need the actual response (a meetingId, an auth token), so this
  // throws on failure instead of swallowing it, and returns the parsed body
  // on success.
  async function callLiveWorker(path, body) {
    const res = await fetch(`${PUSH_WORKER_URL}${path}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ secret: PUSH_SHARED_SECRET, ...body }),
    });
    if (!res.ok) {
      const text = await res.text().catch(() => "");
      throw new Error(text || `Request failed (${res.status})`);
    }
    return res.json();
  }
  // sw.js's onBackgroundMessage only fires while this tab ISN'T focused —
  // with the app open, FCM instead hands the message to this listener,
  // and nothing shows it unless the app explicitly does. Reads from
  // payload.data (not payload.notification) for the same reason sw.js
  // does — see the Worker's comment on why messages are sent data-only.
  //
  // Wrapped defensively on purpose: this runs before window.storage is
  // defined below, in the SAME script block — an uncaught error here
  // (e.g. isSupported() returning a plain boolean instead of a Promise
  // in this SDK build, which is exactly what broke this once already)
  // would silently stop window.storage from ever being created, breaking
  // every single piece of data loading in the app, not just push.
  // Promise.resolve(...) safely handles isSupported() whether it returns
  // a boolean or a real Promise, and the outer try/catch is a second
  // layer of protection against this exact class of failure recurring.
  try {
    if (typeof firebase !== "undefined" && firebase.messaging && firebase.messaging.isSupported) {
      Promise.resolve(firebase.messaging.isSupported()).then((supported) => {
        if (!supported) return;
        firebase.messaging().onMessage((payload) => {
          const title = (payload.data && payload.data.title) || "Pavilion";
          const body = (payload.data && payload.data.body) || "";
          if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
          // Goes through the service worker's own notification API rather
          // than `new Notification(...)` directly — desktop browsers allow
          // the plain constructor from a page, but mobile browsers
          // (Android Chrome in particular) don't reliably support it there
          // and can silently no-op. registration.showNotification() is the
          // one path that works consistently on both.
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.ready.then((registration) => {
              registration.showNotification(title, { body, icon: "/icon-192.png", badge: "/icon-192.png" });
            }).catch((e) => console.error("foreground showNotification failed", e));
          } else {
            new Notification(title, { body, icon: "/icon-192.png" });
          }
        });
      }).catch((e) => console.error("push foreground setup failed", e));
    }
  } catch (e) {
    console.error("push foreground setup failed", e);
  }

  window.__activeTeam = null;
  const UNSCOPED_KEYS = new Set(["teamsIndex", "superAdminPin", "pinResetRequests"]);
  function scopeDocId(key) {
    if (UNSCOPED_KEYS.has(key)) return key;
    return window.__activeTeam ? (window.__activeTeam + "__" + key) : key;
  }

  window.storage = {
    async get(key) {
      try {
        const doc = await db.collection(COLLECTION).doc(scopeDocId(key)).get();
        if (!doc.exists) return null;
        const data = doc.data();
        return { key, value: data.value, shared: true };
      } catch (e) {
        console.error("storage.get failed", key, e);
        throw e;
      }
    },
    async set(key, value) {
      try {
        await db.collection(COLLECTION).doc(scopeDocId(key)).set({ value, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        return { key, value, shared: true };
      } catch (e) {
        console.error("storage.set failed", key, e);
        return null;
      }
    },
    async delete(key) {
      try {
        const doc = await db.collection(COLLECTION).doc(scopeDocId(key)).get();
        const existed = doc.exists;
        await db.collection(COLLECTION).doc(scopeDocId(key)).delete();
        return { key, deleted: existed, shared: true };
      } catch (e) {
        console.error("storage.delete failed", key, e);
        return null;
      }
    },
    async list(prefix) {
      try {
        const teamPrefix = window.__activeTeam ? (window.__activeTeam + "__") : "";
        const searchPrefix = teamPrefix + (prefix || "");
        // Range query on document ID instead of fetching the whole
        // collection and filtering client-side — "" is a very high
        // codepoint (Unicode private-use area) that sorts after any normal
        // text, so this reads back exactly the docs whose ID starts with
        // searchPrefix. Without it, every team's photo load (and any
        // changeTeamCode) was downloading every document belonging to
        // every team on the platform just to keep a few of them.
        const snap = await db.collection(COLLECTION)
          .orderBy(firebase.firestore.FieldPath.documentId())
          .startAt(searchPrefix)
          .endAt(searchPrefix + "")
          .get();
        const keys = [];
        snap.forEach((doc) => {
          const stripped = teamPrefix ? doc.id.slice(teamPrefix.length) : doc.id;
          keys.push(stripped);
        });
        return { keys, prefix, shared: true };
      } catch (e) {
        console.error("storage.list failed", e);
        return null;
      }
    },
    subscribe(key, callback) {
      const unsub = db.collection(COLLECTION).doc(scopeDocId(key)).onSnapshot(
        (doc) => {
          if (doc.exists) {
            const data = doc.data();
            callback(data.value);
          } else {
            callback(undefined);
          }
        },
        (err) => {
          console.error("storage.subscribe error", key, err);
        }
      );
      return unsub;
    },
  };
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useMemo } = React;

function Icon({ children, size = 14, color }) {
  return (
    <span style={{ fontSize: size, lineHeight: 1, display: "inline-block", color: color || undefined, verticalAlign: "middle" }}>
      {children}
    </span>
  );
}
// The one place every "Share via WhatsApp" button's look lives — each call
// site only needs to hand over the message text, plus whatever spacing it
// needs to sit next to its own Copy button (flex:1 in a button row, a
// smaller pill padding elsewhere), and its own label content via children.
function WhatsAppShareLink({ text, children, style }) {
  return (
    <a
      href={buildWhatsAppShareUrl(text)}
      target="_blank"
      rel="noreferrer"
      style={{
        display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
        background: "#25D366", border: "none", color: "#fff", borderRadius: 8,
        textDecoration: "none", fontSize: 12, fontWeight: 600, cursor: "pointer",
        padding: "9px",
        ...style,
      }}
    >
      {children}
    </a>
  );
}
// Same five groups on the admin match card, minus Settings on the
// player-facing one (players never edit a match, so there's nothing to
// put there) — see MatchTabBar below for how these render.
const ADMIN_MATCH_TABS = [
  { key: "squad", label: "Squad" },
  { key: "carpool", label: "Carpool" },
  { key: "money", label: "Money" },
  { key: "performers", label: "Performers" },
  { key: "settings", label: "Settings" },
];
const PLAYER_MATCH_TABS = [
  { key: "squad", label: "Squad" },
  { key: "carpool", label: "Carpool" },
  { key: "money", label: "Money" },
  { key: "performers", label: "Performers" },
];
// Shared tab strip for an expanded match card's content — used by both the
// admin MatchCard and the player-facing PlayerMatchesView. Renders the
// strip plus one bordered panel underneath; callers gate their own content
// with `activeTab === "..."` and hand it all in as children, so this stays
// pure presentation with no knowledge of what any tab actually contains.
function MatchTabBar({ tabs, active, onChange, children }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <div style={{ display: "flex", gap: 4, background: COLORS.pitch, borderRadius: "10px 10px 0 0", padding: "6px 6px 0" }}>
        {tabs.map((t) => (
          <button
            key={t.key}
            onClick={() => onChange(t.key)}
            style={{
              flex: 1, textAlign: "center", fontSize: 11, fontWeight: 600, padding: "9px 4px",
              borderRadius: "8px 8px 0 0", border: "none", cursor: "pointer",
              background: active === t.key ? COLORS.card : "transparent",
              color: active === t.key ? COLORS.ink : "#9BAE9E",
            }}
          >
            {t.label}
          </button>
        ))}
      </div>
      <div style={{ border: `1px solid ${COLORS.line}`, borderTop: "none", borderRadius: "0 0 12px 12px", padding: 16 }}>
        {children}
      </div>
    </div>
  );
}
// Shown to everyone watching once a match has an active liveMeetingId —
// connects as a viewer the moment it mounts, tears the connection back
// down the moment meetingId changes or this unmounts (match card
// collapsed, tab switched away, or the broadcast itself ended and
// liveMeetingId cleared). Deliberately has no "reconnect" button of its
// own — if the connection drops, collapsing and re-expanding the card
// (which remounts this) is the recovery path, same spirit as everything
// else in this app staying simple over clever. viewerId/viewerName are
// optional — omit them (as the admin view does, which has no player
// identity to hand over) and a throwaway anonymous id is used instead.
function LiveViewer({ meetingId, viewerId, viewerName }) {
  const videoRef = React.useRef(null);
  const sessionRef = React.useRef(null);
  const idRef = React.useRef(viewerId || `viewer-${Math.random().toString(36).slice(2)}`);
  const [status, setStatus] = useState("connecting"); // connecting | live | error
  const [errorMsg, setErrorMsg] = useState("");
  // Browsers silently block autoplay of anything with sound unless it
  // starts muted — no error, the video just never plays. Starting muted
  // and letting the viewer tap to unmute (a real user gesture, which
  // browsers do allow to start audio) is the standard way around that.
  const [muted, setMuted] = useState(true);
  // Bumped on every "Try again" tap — in the effect's dependency array
  // purely to force a fresh connection attempt without needing a whole
  // separate retry code path.
  const [retryCount, setRetryCount] = useState(0);

  useEffect(() => {
    let cancelled = false;
    setStatus("connecting");
    setErrorMsg("");
    (async () => {
      // 20s to actually see the broadcaster's track arrive — generous
      // enough for a slow join, bounded so a viewer opening the match
      // before anyone's live doesn't wait forever.
      const res = await startWatchingLive(meetingId, idRef.current, viewerName, 20000);
      if (cancelled) {
        if (res.ok) stopWatchingLive(res.session);
        return;
      }
      if (!res.ok) {
        setStatus("error");
        setErrorMsg(res.error);
        return;
      }
      if (videoRef.current) {
        videoRef.current.srcObject = res.session.stream;
        videoRef.current.play().catch(() => {});
      }
      sessionRef.current = res.session;
      setStatus("live");
    })();
    return () => {
      cancelled = true;
      stopWatchingLive(sessionRef.current);
      sessionRef.current = null;
    };
  }, [meetingId, retryCount]);

  function handleUnmute() {
    if (videoRef.current) {
      videoRef.current.muted = false;
      videoRef.current.play().catch(() => {});
    }
    setMuted(false);
  }

  return (
    <div style={{ position: "relative", borderRadius: 12, overflow: "hidden", background: "#000", marginBottom: 14 }}>
      <video
        ref={videoRef} autoPlay playsInline muted={muted}
        style={{ width: "100%", display: "block", aspectRatio: "16/9", objectFit: "cover", background: "#000" }}
      />
      <div style={{ position: "absolute", top: 10, left: 10, background: "#D62828", color: "#fff", fontSize: 10, fontWeight: 800, padding: "4px 9px", borderRadius: 20, letterSpacing: 0.03 }}>
        🔴 LIVE
      </div>
      {status === "live" && muted && (
        <button
          onClick={handleUnmute}
          style={{ position: "absolute", bottom: 10, right: 10, background: "rgba(0,0,0,0.6)", color: "#fff", border: "none", borderRadius: 20, padding: "6px 12px", fontSize: 11, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", gap: 5 }}
        >
          🔇 Tap for sound
        </button>
      )}
      {status !== "live" && (
        <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 12, color: "#fff", fontSize: 12, background: "rgba(0,0,0,0.55)", padding: 20, textAlign: "center" }}>
          {status === "connecting" ? "Connecting…" : errorMsg}
          {status === "error" && (
            <button
              onClick={() => setRetryCount((c) => c + 1)}
              style={{ background: COLORS.willow, color: "#fff", border: "none", borderRadius: 8, padding: "8px 16px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}
            >
              Try again
            </button>
          )}
        </div>
      )}
    </div>
  );
}
// The broadcaster's own screen — camera preview, a live status line, and
// Stop. Closing this any way (the ✕ or Stop itself) ends the broadcast;
// there's deliberately no "minimize and keep going" option, since the
// broadcaster's phone has to stay on this screen for the stream to keep
// working at all — leaving that ambiguous would be worse than just
// always stopping on close.
function LiveBroadcastModal({ onClose, onStarted, onStopped, matchLabel, broadcasterId, broadcasterName }) {
  const videoRef = React.useRef(null);
  const sessionRef = React.useRef(null);
  const [status, setStatus] = useState("starting"); // starting | live | error
  const [errorMsg, setErrorMsg] = useState("");
  // Camera zoom is a real hardware/browser capability, not something every
  // device offers — Chromium on Android exposes it via a "zoom" constraint
  // on the video track; iOS Safari and Firefox don't support it at all as
  // of writing. Feature-detected below rather than assumed, so the slider
  // only ever shows up where it'll actually do something. null = not
  // available (or not checked yet); otherwise { min, max, step, value }.
  const [zoom, setZoom] = useState(null);
  // Who's currently watching — [{ id, name }]. Polled rather than wired to
  // an SDK "participant joined/left" event: this Beta SDK's exact event
  // names have already turned out unreliable once this session (see
  // attachRemoteTracks), and a 2s poll is simple, robust, and plenty fast
  // for a viewer list that's just informational, not real-time-critical.
  const [viewers, setViewers] = useState([]);
  const [showViewers, setShowViewers] = useState(false);

  useEffect(() => {
    let cancelled = false;
    let viewerPoll = null;
    (async () => {
      const res = await startLiveBroadcast(matchLabel, broadcasterId, broadcasterName);
      if (cancelled) {
        if (res.ok) stopLiveBroadcast(res.session);
        return;
      }
      if (!res.ok) {
        setStatus("error");
        setErrorMsg(res.error);
        return;
      }
      sessionRef.current = res.session;
      if (videoRef.current) videoRef.current.srcObject = res.session.stream;
      setStatus("live");
      onStarted(res.session.meetingId);

      const track = res.session.stream.getVideoTracks()[0];
      if (track && track.getCapabilities) {
        try {
          const caps = track.getCapabilities();
          if (caps.zoom && caps.zoom.max > caps.zoom.min) {
            const settings = track.getSettings ? track.getSettings() : {};
            setZoom({ min: caps.zoom.min, max: caps.zoom.max, step: caps.zoom.step || 0.1, value: settings.zoom || caps.zoom.min });
          }
        } catch (e) {
          // No zoom capability reported — the slider just stays hidden.
        }
      }

      function pollViewers() {
        try {
          const list = [];
          res.session.meeting.participants.joined.forEach((p) => {
            list.push({ id: p.id, name: p.name || "Viewer" });
          });
          setViewers(list);
        } catch (e) {
          // SDK shape may differ — the list just won't update this tick.
        }
      }
      pollViewers();
      viewerPoll = setInterval(pollViewers, 2000);
    })();
    return () => {
      cancelled = true;
      if (viewerPoll) clearInterval(viewerPoll);
      stopLiveBroadcast(sessionRef.current);
      sessionRef.current = null;
    };
    // Deliberately mount-once (empty deps) — every prop here is only ever
    // read inside the async callback above, not on every render, so none
    // of them need to be dependencies.
  }, []);

  function handleZoomChange(rawValue) {
    const value = Number(rawValue);
    const track = sessionRef.current && sessionRef.current.stream.getVideoTracks()[0];
    if (track) track.applyConstraints({ advanced: [{ zoom: value }] }).catch(() => {});
    setZoom((z) => (z ? { ...z, value } : z));
  }

  function handleStop() {
    stopLiveBroadcast(sessionRef.current);
    sessionRef.current = null;
    if (status === "live") onStopped();
    onClose();
  }

  return (
    <div style={{ position: "fixed", top: 0, right: 0, bottom: 0, left: 0, background: "rgba(0,0,0,0.85)", zIndex: 240, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div style={{ width: "100%", maxWidth: 420 }}>
        <div style={{ position: "relative", borderRadius: 12, overflow: "hidden", background: "#111", marginBottom: 16 }}>
          <video
            ref={videoRef} autoPlay playsInline muted
            style={{ width: "100%", display: "block", aspectRatio: "16/9", objectFit: "cover", background: "#111" }}
          />
          {status === "live" && (
            <div style={{ position: "absolute", top: 10, left: 10, background: "#D62828", color: "#fff", fontSize: 10, fontWeight: 800, padding: "4px 9px", borderRadius: 20 }}>
              🔴 LIVE
            </div>
          )}
          {status !== "live" && (
            <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontSize: 12, background: "rgba(0,0,0,0.55)", padding: 20, textAlign: "center" }}>
              {status === "starting" ? "Starting your camera…" : errorMsg}
            </div>
          )}
          {status === "live" && zoom && (
            <div style={{ position: "absolute", left: 12, right: 12, bottom: 10, display: "flex", alignItems: "center", gap: 8, background: "rgba(0,0,0,0.55)", borderRadius: 20, padding: "6px 12px" }}>
              <span style={{ fontSize: 12 }}>🔍</span>
              <input
                type="range" min={zoom.min} max={zoom.max} step={zoom.step} value={zoom.value}
                onChange={(e) => handleZoomChange(e.target.value)}
                style={{ flex: 1 }}
              />
              <span style={{ fontSize: 10, color: "#fff", minWidth: 28, textAlign: "right" }}>{(zoom.min > 0 ? zoom.value / zoom.min : zoom.value).toFixed(1)}x</span>
            </div>
          )}
        </div>
        {status === "live" && (
          <div style={{ marginBottom: 14 }}>
            <button
              onClick={() => setShowViewers((v) => !v)}
              style={{ width: "100%", background: "rgba(255,255,255,0.08)", border: "none", color: "#fff", borderRadius: 10, padding: "9px 12px", fontSize: 12, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "space-between" }}
            >
              <span>👀 {viewers.length} watching</span>
              <span style={{ fontSize: 11, color: "#B7C4B8" }}>{showViewers ? "Hide ←" : "Show →"}</span>
            </button>
            {showViewers && (
              <div style={{ marginTop: 6, background: "rgba(255,255,255,0.05)", borderRadius: 10, padding: viewers.length ? "8px 12px" : "12px", fontSize: 12, color: "#fff" }}>
                {viewers.length === 0 ? (
                  <span style={{ color: "#B7C4B8" }}>No one's joined yet.</span>
                ) : (
                  viewers.map((v) => <div key={v.id} style={{ padding: "4px 0" }}>{v.name}</div>)
                )}
              </div>
            )}
          </div>
        )}
        <div style={{ fontSize: 11, color: "#B7C4B8", textAlign: "center", marginBottom: 14 }}>
          Keep this screen open and your phone unlocked — the broadcast pauses if you switch apps or lock the screen.
        </div>
        <button
          onClick={handleStop}
          style={{ width: "100%", background: status === "live" ? "#D62828" : "rgba(255,255,255,0.15)", color: "#fff", border: "none", borderRadius: 10, padding: "12px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}
        >
          {status === "live" ? "⏹ Stop broadcasting" : "Cancel"}

  if (!url) return null;

  return (
    <div
      onClick={onClose}
      style={{
        position: "fixed", top: 0, right: 0, bottom: 0, left: 0, background: "rgba(0,0,0,0.75)",
        zIndex: 220, display: "flex", flexDirection: "column", alignItems: "center", padding: 24,
        // overflowY (not justifyContent: "center") does the vertical
        // centering here, via the card's own margin: auto below — combining
        // justifyContent: center with overflow is a known flexbox trap that
        // clips the START of content that's taller than the screen, even
        // while scrolled. The taller video frame above makes that a real
        // possibility now, not just a theoretical one.

// outputSize/title/confirmLabel/instructions default to the avatar-photo
// case (existing callers keep working untouched) — QR uploads pass a much
// larger outputSize, since 150px (fine for a face) risks becoming
// unscannable for a QR code's finer black/white pattern, plus QR-specific
// copy. The crop frame itself is already a plain square either way, never
// a forced circle, so nothing else needs to change between the two uses.
// outputSize default was 150 — plenty for the small inline avatars (22–40px)
// everywhere, but PhotoViewerModal's tap-to-enlarge view shows this at 220
// CSS px, which is 400–650+ real pixels on any modern phone screen. 400
// comfortably covers that without the blur a 150px source produces once
// stretched that far. Affects every caller that doesn't pass its own
// outputSize/outputWidth/outputHeight: player avatars (registration +
// change-photo) and team logos (creation + change-logo).
function PhotoCropModal({ file, onConfirm, onCancel, outputSize = 400, outputWidth, outputHeight, quality = 0.82, title = "Position your photo", confirmLabel = "Use this photo", instructions }) {
  const [loaded, setLoaded] = useState(null); // { img, dataUrl } | null
  const [value, setValue] = useState(0.5);
  const [loadError, setLoadError] = useState("");

  useEffect(() => {
    let cancelled = false;
    setLoaded(null);
    setLoadError("");
    setValue(0.5);
    loadImageFromFile(file)
      .then((res) => { if (!cancelled) setLoaded(res); })
      .catch(() => { if (!cancelled) setLoadError("Could not read that photo — try a different one."); });
    return () => { cancelled = true; };
  }, [file]);

  // outputWidth/outputHeight let a caller (the match banner) target a
  // non-square shape; every other caller just passes outputSize and gets
  // the square behavior this always had. The on-screen frame is scaled to
  // match whichever shape is being cropped to, capped at 220px on its
  // longer edge — same size the square frame always used, so nothing
  // about the existing avatar/logo/QR flows visually changes.
  const outW = outputWidth || outputSize;
  const outH = outputHeight || outputSize;
  const MAX_VP = 220;
  const VPW = outW >= outH ? MAX_VP : MAX_VP * (outW / outH);
  const VPH = outH >= outW ? MAX_VP : MAX_VP * (outH / outW);
  const axis = loaded ? cropAxisFor(loaded.img.naturalWidth, loaded.img.naturalHeight, outW, outH) : null;

  let scaledW = VPW, scaledH = VPH, tx = 0, ty = 0;
  if (loaded) {
    const scale = Math.max(VPW / loaded.img.naturalWidth, VPH / loaded.img.naturalHeight);
    scaledW = loaded.img.naturalWidth * scale;
    scaledH = loaded.img.naturalHeight * scale;
    const overflowX = Math.max(0, scaledW - VPW);
    const overflowY = Math.max(0, scaledH - VPH);
    tx = axis === "horizontal" ? -(value * overflowX) : -(overflowX / 2);
    ty = axis === "vertical" ? -(value * overflowY) : -(overflowY / 2);
  }

  function handleConfirm() {
    if (!loaded) return;
    const result = cropToRectDataUrl(loaded.img, outW, outH, axis, value, quality);
    onConfirm(result);
  }

  return (
    <div
      onClick={onCancel}
      style={{
        position: "fixed", top: 0, right: 0, bottom: 0, left: 0, background: "rgba(0,0,0,0.75)",
        zIndex: 250, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 20,
      }}
    >
      <div onClick={(e) => e.stopPropagation()} style={{ background: COLORS.pitch, borderRadius: 16, padding: 20, maxWidth: 300, width: "100%" }}>
        <div style={{ color: COLORS.cream, fontSize: 13, fontWeight: 600, marginBottom: 12, textAlign: "center" }}>{title}</div>

        {loadError ? (
          <div style={{ color: "#F0A6A4", fontSize: 12, textAlign: "center", marginBottom: 14 }}>{loadError}</div>
        ) : !loaded ? (
          <div style={{ width: VPW, height: VPH, borderRadius: 12, background: COLORS.pitchLight, margin: "0 auto 14px", display: "flex", alignItems: "center", justifyContent: "center", color: "#9BAE9E", fontSize: 12 }}>
            Loading…
          </div>
        ) : (
          <>
            <div style={{ width: VPW, height: VPH, borderRadius: 12, overflow: "hidden", margin: "0 auto 14px", position: "relative", background: "#000" }}>
              <img
                src={loaded.dataUrl} alt=""
                style={{ position: "absolute", top: 0, left: 0, width: scaledW, height: scaledH, transform: `translate(${tx}px, ${ty}px)` }}
              />
              <div style={{ position: "absolute", top: 0, left: 0, right: 0, bottom: 0, border: "2px solid rgba(255,255,255,0.5)", borderRadius: 12, pointerEvents: "none" }} />
            </div>
            {axis && (
              <div style={{ marginBottom: 16 }}>
                <input
                  type="range" min="0" max="1" step="0.01" value={value}
                  onChange={(e) => setValue(Number(e.target.value))}
                  style={{ width: "100%" }}
                />
                <div style={{ fontSize: 10, color: "#9BAE9E", textAlign: "center", marginTop: 4 }}>
                  {instructions || `Drag to move the frame ${axis === "vertical" ? "up or down" : "left or right"} over your photo`}
                </div>
              </div>
            )}
          </>
        )}

        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={onCancel} style={{ flex: 1, background: "transparent", border: `1px solid ${COLORS.pitchLight}`, color: COLORS.cream, borderRadius: 8, padding: "9px", fontSize: 13, cursor: "pointer" }}>
            Cancel
          </button>
          <button onClick={handleConfirm} disabled={!loaded} style={{ flex: 1, background: COLORS.willow, border: "none", color: "#fff", borderRadius: 8, padding: "9px", fontSize: 13, fontWeight: 600, cursor: loaded ? "pointer" : "default", opacity: loaded ? 1 : 0.6 }}>
            {confirmLabel}
          </button>
        </div>
      </div>
    </div>
  );
}

// By default this never crops — right for payment screenshots, where
// cutting anything off would make the proof useless. Pass `crop` (plus
// cropOutputWidth/cropOutputHeight for a non-square target — see
// MatchBannerUpload) to route through PhotoCropModal instead: used for QR
// codes and match banners, where the source image is often a full app
// screenshot or export with extra surrounding content, and a *manual*
// crop — the person choosing exactly what stays in frame — is safe in a
// way an automatic one isn't, since an automatic crop risks slicing into
// the QR's scannable pattern or the banner's own layout. `children` is a
// render function receiving `busy`, so the visual slot is entirely up to
// the caller either way.
function PlainImageUpload({ onUpload, maxDim, quality, disabled, children, crop, cropTitle, cropConfirmLabel, cropInstructions, cropOutputWidth, cropOutputHeight }) {
  const [busy, setBusy] = useState(false);
  const [cropFile, setCropFile] = useState(null);
  const inputRef = React.useRef(null);

  async function handleFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    if (crop) {
      setCropFile(file);
      return;
    }
    setBusy(true);
    try {
      const dataUrl = await resizeImageNoCrop(file, maxDim, quality);
      await onUpload(dataUrl);
    } catch (err) {
      console.error(err);
    }
    setBusy(false);
  }

  async function handleCropConfirm(dataUrl) {
    setCropFile(null);
    setBusy(true);
    try {
      await onUpload(dataUrl);
    } catch (err) {
      console.error(err);
    }
    setBusy(false);
  }

  return (
    <div onClick={() => !disabled && !busy && inputRef.current && inputRef.current.click()}>
      {children(busy)}
      <input ref={inputRef} type="file" accept="image/*" onChange={handleFile} style={{ display: "none" }} />
      {crop && cropFile && (
        <PhotoCropModal
          file={cropFile}
          outputSize={maxDim}
          outputWidth={cropOutputWidth}
          outputHeight={cropOutputHeight}
          quality={quality}
          title={cropTitle}
          confirmLabel={cropConfirmLabel}
          instructions={cropInstructions}
          onConfirm={handleCropConfirm}
          onCancel={() => setCropFile(null)}
        />
      )}
    </div>
  );
}

function isWeekend(iso) {
  const day = new Date(iso + "T00:00:00").getDay();
  return day === 0 || day === 6;
}
function nextWeekday(iso) {
  let d = new Date(iso + "T00:00:00");
  while (d.getDay() === 0 || d.getDay() === 6) {
    d.setDate(d.getDate() + 1);
  }
  return toISO(d);
}
const SESSION_KEY = "cricket_nets_session";
const SESSION_DURATION_MS = 15 * 60 * 1000; // stay logged in for 15 minutes, then require PIN again
function readSession() {
  try {
    const raw = window.localStorage.getItem(SESSION_KEY);
    if (!raw) return {};
    const s = JSON.parse(raw) || {};
    if (s.expiresAt && Date.now() > s.expiresAt) return {}; // expired — treat as logged out
    return s;
  } catch {
    return {};
  }
}
function writeSession(session) {
  try {
    window.localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  } catch {
    /* ignore — worst case, refresh asks to log in again */
  }
}
function hadExpiredSession() {
  try {
    const raw = window.localStorage.getItem(SESSION_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw) || {};
    return !!(s.expiresAt && Date.now() > s.expiresAt && (s.authedAdmin || s.authedPlayerId));
  } catch {
    return false;
  }
}

// Remembers up to a handful of "team + player" pairs this device has
// signed in as before — deliberately a short list, not a single slot,
// since the same person can be a player on more than one team, and each
// is a fully independent, unlinked registration (own id, own PIN). This
// only ever remembers WHO to pre-select; PIN entry is still required
// every time, same as if nothing were remembered at all.
const KNOWN_PROFILES_KEY = "cricket_nets_known_profiles";
const MAX_KNOWN_PROFILES = 6;
function readKnownProfiles() {
  try {
    const raw = window.localStorage.getItem(KNOWN_PROFILES_KEY);
    const list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list : [];
  } catch {
    return [];
  }
}
function writeKnownProfiles(list) {
  try {
    window.localStorage.setItem(KNOWN_PROFILES_KEY, JSON.stringify(list));
  } catch {
    /* ignore — worst case, the shortcut just doesn't appear next time */
  }
}
function upsertKnownProfile(profile) {

// Auto-center-crop (kept as a fallback / used internally by the crop math
// below). The crop modal lets the person adjust WHERE within the photo
// this square comes from, since a pure center-crop often cuts off faces.
function resizeImageFile(file, size = 150, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");
        const scale = Math.max(size / img.width, size / img.height);
        const sw = size / scale, sh = size / scale;
        const sx = (img.width - sw) / 2, sy = (img.height - sh) / 2;
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, size, size);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => reject(new Error("Could not read that image."));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("Could not read that file."));
    reader.readAsDataURL(file);
  });
}
function loadImageFromFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => resolve({ img, dataUrl: e.target.result });
      img.onerror = () => reject(new Error("Could not read that image."));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("Could not read that file."));
    reader.readAsDataURL(file);
  });
}
// Unlike resizeImageFile() above, this never crops — used for QR codes and
// payment screenshots, where cutting off any part of the image would make
// it unscannable or unreadable. Only scales down if it's larger than
// maxDim on its longest edge; the aspect ratio is always preserved.
function resizeImageNoCrop(file, maxDim = 640, quality = 0.85) {
  return new Promise((resolve, reject) => {
    loadImageFromFile(file).then(({ img }) => {
      const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * scale);
      const h = Math.round(img.naturalHeight * scale);
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL("image/jpeg", quality));
    }).catch(reject);
  });
}
// A crop against a photo whose shape doesn't match the target always has
// to clip something on one axis — this picks which axis has room to
// slide (e.g. a portrait photo cropped to a square clips vertically) so
// the person can choose where within that range the crop sits, instead
// of always defaulting to dead-center (which is what cuts off faces —
// or, for a match banner, what risks cutting off the score/date text).
// targetW/targetH default to 1/1 (square) for the existing avatar/logo/QR
// callers; the banner crop passes a portrait ratio instead.
function cropAxisFor(width, height, targetW = 1, targetH = 1) {
  const scale = Math.max(targetW / width, targetH / height);
  const overflowX = width * scale - targetW;
  const overflowY = height * scale - targetH;
  if (overflowX < 0.5 && overflowY < 0.5) return null; // already fits the target shape almost exactly
  return overflowX > overflowY ? "horizontal" : "vertical";
}
// General form: crops to an arbitrary outW x outH rectangle rather than
// always a square — PhotoCropModal calls this directly (passing outW=outH
// for the avatar/logo/QR flows, since a square is just a special case of
// a rectangle), so there's a single crop implementation instead of two.
function cropToRectDataUrl(img, outW, outH, axis, value, quality = 0.82) {
  const scale = Math.max(outW / img.naturalWidth, outH / img.naturalHeight);
  const sw = outW / scale, sh = outH / scale;
  let sx = (img.naturalWidth - sw) / 2;
  let sy = (img.naturalHeight - sh) / 2;
  if (axis === "vertical") sy = value * (img.naturalHeight - sh);
  else if (axis === "horizontal") sx = value * (img.naturalWidth - sw);
  const canvas = document.createElement("canvas");
  canvas.width = outW;
  canvas.height = outH;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, outW, outH);
  return canvas.toDataURL("image/jpeg", quality);
}
function timeAgo(isoString) {
  const diffMs = Date.now() - new Date(isoString).getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return "Just now";
  if (mins < 60) return `${mins}m ago`;
  const hours = Math.floor(mins / 60);
  if (hours < 24) return `${hours}h ago`;
  const days = Math.floor(hours / 24);
  return `${days}d ago`;
}

function downloadTextFile(filename, content) {
  try {
    const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return true;
  } catch {
    return false;
  }
}
async function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch { /* fall through */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch {
    return false;
  }
}

function getMonthDayEntries(days, monthKeyStr) {
  const n = daysInMonth(monthKeyStr);
  const list = [];
  for (let i = 1; i <= n; i++) {
    const iso = `${monthKeyStr}-${String(i).padStart(2, "0")}`;
    if (days[iso]) list.push([iso, days[iso]]);
  }
  return list.sort((a, b) => a[0].localeCompare(b[0]));
}

function computeMonthTotals(monthKeyStr, subs, days, payments, rates) {
  const dayEntries = getMonthDayEntries(days, monthKeyStr);
  let hours = 0, balls = 0;
  dayEntries.forEach(([, v]) => { hours += Number(v.hours || 0); balls += Number(v.balls || 0); });
  const netFee = hours * rates.netRate;
  const ballFee = balls * rates.ballRate;
  const expense = netFee + ballFee;
  const subPlayers = subs[monthKeyStr] || [];
  const monthPayments = payments[monthKeyStr] || {};
  const expected = subPlayers.length * rates.subAmount;
  const collected = subPlayers.reduce((sum, pid) => sum + (Number(monthPayments[pid]) || 0), 0);
  const pending = expected - collected;
  const balance = collected - expense;
  return { hours, balls, netFee, ballFee, expense, expected, collected, pending, balance, subscribedCount: subPlayers.length, dayEntries };
}

function allMonthsWithData(subs, days, payments, adjustments) {
  const set = new Set();
  Object.keys(subs).forEach((k) => set.add(k));
  Object.keys(payments).forEach((k) => set.add(k));
  Object.keys(adjustments).forEach((k) => set.add(k));
  Object.keys(days).forEach((iso) => set.add(iso.slice(0, 7)));
  return Array.from(set).sort();
}

function resolveMonthRates(monthKeyStr, rates, lockedMonths) {
  const locked = lockedMonths && lockedMonths[monthKeyStr];
  if (locked && typeof locked === "object" && locked.rates) return locked.rates;
  return rates;
}

function runningCarryFor(activeMonthStr, subs, days, payments, rates, adjustments, lockedMonths) {
  const months = allMonthsWithData(subs, days, payments, adjustments).filter((m) => m < activeMonthStr);
  let carry = 0;
  months.forEach((m) => {
    const t = computeMonthTotals(m, subs, days, payments, resolveMonthRates(m, rates, lockedMonths));
    const adj = Number(adjustments[m] || 0);
    const closing = t.balance + carry + adj;
    carry = closing > 0 ? closing : 0;
  });
  return carry;
}

function buildFullSeasonCSV(subs, days, payments, rates, adjustments, lockedMonths) {
  const months = allMonthsWithData(subs, days, payments, adjustments);
  let carry = 0;
  const lines = [];
  lines.push("MONTHLY SUMMARY");
  lines.push("Month,Hours,Balls,NetFee,BallFee,Expense,SubscribedPlayers,Expected,Collected,Pending,CarryIn,Adjustment,ClosingBalance,Locked");
  months.forEach((m) => {
    const t = computeMonthTotals(m, subs, days, payments, resolveMonthRates(m, rates, lockedMonths));
    const adj = Number(adjustments[m] || 0);
    const closing = t.balance + carry + adj;
    const locked = !!(lockedMonths && lockedMonths[m]);
    lines.push([monthLabel(m), t.hours, t.balls, t.netFee, t.ballFee, t.expense, t.subscribedCount, t.expected, t.collected, t.pending, carry, adj, closing, locked ? "Yes" : "No"].join(","));
    carry = closing > 0 ? closing : 0;
  });
  lines.push("");
  lines.push("DAILY LOG");
  lines.push("Date,Hours,Balls");
  Object.keys(days).sort().forEach((iso) => {
    const v = days[iso];
    lines.push(`${iso},${Number(v.hours || 0)},${Number(v.balls || 0)}`);
  });
  return lines.join("\n");
}

function computeAttendanceStats(players, days) {
  const sessionDates = Object.keys(days).sort();
  const total = sessionDates.length;
  const stats = players.map((p) => {
    const attended = sessionDates.filter((iso) => (days[iso].votes || []).includes(p.id)).length;
    const pct = total > 0 ? Math.round((attended / total) * 100) : 0;
    return { id: p.id, name: p.name, attended, pct };
  });
  stats.sort((a, b) => b.pct - a.pct || b.attended - a.attended);
  return { stats, total };
}

    const tokens = adminNotify.fcmTokens || [];
    if (tokens.length === 0) return;
    sendPushNotification({
      tokens,
      title: "🙋 New registration",
      body: `${name} just registered — needs your approval.`,
    });
  }
  function notifyAdminPinResetRequest(playerName) {
    const tokens = adminNotify.fcmTokens || [];
    if (tokens.length === 0) return;
    sendPushNotification({
      tokens,
      title: "🔑 PIN reset requested",
      body: `${playerName} needs their PIN reset.`,
    });
  }
  // Called with a raw token, not a player id — at the moment a
  // registration is approved, the brand-new player record was only just
  // created in this same update, so there's nothing to look up yet.
  function notifyRegistrationApproved(token) {
    if (!token) return;
    sendPushNotification({
      tokens: [token],
      title: "🎉 You're approved!",
      body: `Welcome to ${teamRecord ? teamRecord.teamName : "the team"} — you can sign in now.`,
    });
  }
  // A player can't self-verify who they are the way an admin PIN reset
  // needs to (that one goes to a Super Admin) — but a player's own team
  // admin already has full, one-click authority to reset any player's PIN
  // (see resetPlayerPin above), so this just flags the request for them
  // to see, no extra approval layer needed. Submitting again while a
  // request is already pending is a no-op rather than a duplicate.
  function submitPlayerPinResetRequest(playerId) {
    const player = players.find((p) => p.id === playerId);
    if (!player) return { ok: false, error: "Player not found." };
    const alreadyPending = Object.values(playerPinResetRequests).some((r) => r.playerId === playerId);
    if (alreadyPending) return { ok: true };
    const id = `pr_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
    setPlayerPinResetRequests((prev) => ({
      ...prev,
      [id]: { id, playerId, playerName: player.name, requestedAt: new Date().toISOString() },
    }));
    notifyAdminPinResetRequest(player.name);
    return { ok: true };

  function dismissPlayerPinResetRequest(id) {
    setPlayerPinResetRequests((prev) => { const next = { ...prev }; delete next[id]; return next; });
  }
  // Two independent slots — battingVideoUrl and bowlingVideoUrl — rather
  // than one shared slot with a tag. A single tagged slot looked like it
  // offered both (two prominent buttons) but actually only ever held one
  // clip at a time, so saving a second one silently overwrote the first.
  // Both fields live right on the player record — still just short URLs,
  // still no new storage key, no Firestore size concerns either way.
  function playerVideoField(slotType) {
    return slotType === "Bowling" ? "bowlingVideoUrl" : "battingVideoUrl";
  }
  function setPlayerVideo(playerId, slotType, url) {
    const field = playerVideoField(slotType);
    setPlayers((prev) => prev.map((p) => (p.id === playerId ? { ...p, [field]: url } : p)));
  }
  function removePlayerVideo(playerId, slotType) {

  function toggleSub(pid) {
    if (lockedMonths[activeMonth]) return;
    setSubs((prev) => {
      const cur = new Set(prev[activeMonth] || []);
      cur.has(pid) ? cur.delete(pid) : cur.add(pid);
      return { ...prev, [activeMonth]: Array.from(cur) };
    });
  }
  function togglePaid(pid) {
    if (lockedMonths[activeMonth]) return;
    let markedPaid = false;
    setPayments((prev) => {
      const cur = { ...(prev[activeMonth] || {}) };
      if (cur[pid]) {
        delete cur[pid];
      } else {
        cur[pid] = rates.subAmount;
        markedPaid = true;
      }
      return { ...prev, [activeMonth]: cur };
    });
    if (markedPaid) notifySubPaymentConfirmed(pid);
  }
  // Available/not-available are mutually exclusive — voting one way always
  // clears the other, so a player is only ever in one list, or neither
  // (genuinely no response yet, a real distinct state from having declined).
  function toggleVoteFor(iso, pid) {
    if (lockedMonths[iso.slice(0, 7)]) return;
    let voted = false;
    setDays((prev) => {
      const cur = prev[iso] || { votes: [], hours: 0, balls: 0 };
      const votes = new Set(cur.votes);
      const declined = new Set(cur.declined || []);
      if (votes.has(pid)) votes.delete(pid);
      else { votes.add(pid); declined.delete(pid); voted = true; }
      return { ...prev, [iso]: { ...cur, votes: Array.from(votes), declined: Array.from(declined) } };
    });
    if (voted) notifyNetsVote(iso, pid, true);
  }
  function toggleDeclineFor(iso, pid) {
    if (lockedMonths[iso.slice(0, 7)]) return;
    let declinedNow = false;
    setDays((prev) => {
      const cur = prev[iso] || { votes: [], hours: 0, balls: 0 };
      const votes = new Set(cur.votes);
      const declined = new Set(cur.declined || []);
      if (declined.has(pid)) declined.delete(pid);
      else { declined.add(pid); votes.delete(pid); declinedNow = true; }
      return { ...prev, [iso]: { ...cur, votes: Array.from(votes), declined: Array.from(declined) } };
    });
    if (declinedNow) notifyNetsVote(iso, pid, false);
  }
  function setDayField(field, value) {
    if (lockedMonths[selectedDate.slice(0, 7)]) return;
    setDays((prev) => {
      const cur = prev[selectedDate] || { votes: [], hours: 0, balls: 0 };
      return { ...prev, [selectedDate]: { ...cur, [field]: value } };
    });
  }
  function setAdjustmentValue(value) {
    if (lockedMonths[activeMonth]) return;
    setAdjustments((prev) => ({ ...prev, [activeMonth]: value }));
  }
  function setRateField(field, value) {
    setRates((prev) => ({ ...prev, [field]: value }));
  }
  function setPaymentDefaultField(field, value) {
    setPaymentDefault((prev) => ({ ...prev, [field]: value }));
  }
  function toggleMonthLock() {
    setLockedMonths((prev) => {
      const next = { ...prev };
      if (next[activeMonth]) {
        delete next[activeMonth];
      } else {
        next[activeMonth] = { lockedAt: new Date().toISOString(), rates: { ...rates } };
      }
      return next;
    });
  }
  function addWeekendException(iso) {
    if (lockedMonths[iso.slice(0, 7)]) return;
    setWeekendExceptions((prev) => ({ ...prev, [iso]: true }));
  }
  function removeWeekendException(iso) {
    if (lockedMonths[iso.slice(0, 7)]) return;
    setWeekendExceptions((prev) => { const next = { ...prev }; delete next[iso]; return next; });

  function nameTaken(name) {
    const lower = name.trim().toLowerCase();
    const inPlayers = players.some((p) => p.name.trim().toLowerCase() === lower);
    const inPending = Object.values(pendingRegistrations).some((r) => r.name.trim().toLowerCase() === lower);
    return inPlayers || inPending;
  }

  async function submitRegistration({ name, pinHash, photo, dob }) {
    const trimmed = name.trim();
    if (!trimmed) return { ok: false, error: "Enter your name." };
    if (nameTaken(trimmed)) {
      return { ok: false, error: `"${trimmed}" is already registered or pending approval. Try adding a last name or nickname.` };
    }
    if (!dob) return { ok: false, error: "Enter your date of birth." };
    if (new Date(dob + "T00:00:00") > new Date()) {
      return { ok: false, error: "Date of birth can't be in the future." };
    }
    const id = `p_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
    setPendingRegistrations((prev) => ({
      ...prev,
      [id]: { id, name: trimmed, pinHash, photo: photo || null, dob, submittedAt: new Date().toISOString() },
    }));
    notifyAdminNewRegistration(trimmed);
    // The id is handed back so the "registered, waiting for approval"
    // screen can attach a push token to this exact pending request (see
    // updatePendingRegistrationFcmToken below) — there's no player record
    // to attach one to yet, since approval hasn't happened.
    return { ok: true, id };
  }
  // A pending registrant can opt into a "you're approved!" push before
  // they're even a real player — approveRegistration below carries this
  // token forward onto the new player record once it exists.
  function updatePendingRegistrationFcmToken(id, token) {
    setPendingRegistrations((prev) => {
      if (!prev[id]) return prev;
      return { ...prev, [id]: { ...prev[id], fcmToken: token } };
    });
  }

  async function approveRegistration(id) {
    const req = pendingRegistrations[id];
    if (!req) return { ok: false, error: "Request not found." };
    if (players.some((p) => p.name.trim().toLowerCase() === req.name.trim().toLowerCase())) {
      return { ok: false, error: `"${req.name}" is already a player. Reject this request or ask them to use a different name.` };
    }
    setPlayers((prev) => [...prev, { id: req.id, name: req.name, dob: req.dob || "", fcmToken: req.fcmToken || null }]);
    setPins((prev) => ({ ...prev, [req.id]: req.pinHash }));
    if (req.photo) {
      try {
        await window.storage.set(`photo_${req.id}`, req.photo);
        loadAllPhotos();
      } catch (e) {
        console.error("Failed to save approved player's photo", e);
      }
    }
    setPendingRegistrations((prev) => { const next = { ...prev }; delete next[id]; return next; });
    // Uses the token carried over from the pending request directly,
    // rather than looking it up from players state — the new player
    // record was only just queued above in this same call, not yet
    // reflected in this render's players closure.
    if (req.fcmToken) notifyRegistrationApproved(req.fcmToken);
    return { ok: true };
  }

  function rejectRegistration(id) {
    setPendingRegistrations((prev) => { const next = { ...prev }; delete next[id]; return next; });
  }

  // ---- Team platform functions (unscoped — operate on the shared teamsIndex) ----
  function teamCodeTaken(code) {
    return !!teamsIndex[code];
  }
  function suggestTeamCode(name) {
    const base = name.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "team";
    let code = base;
    let n = 2;
    while (teamCodeTaken(code)) { code = `${base}-${n}`; n += 1; }
    return code;
  }
  async function requestNewTeam({ teamName, teamCode, logo, requestedBy, contactNumber, pinHash }) {
    if (!teamName.trim()) return { ok: false, error: "Enter a team name." };
    const code = (teamCode || "").trim().toLowerCase();
    if (!code) return { ok: false, error: "Enter a team code." };
    if (!/^[a-z0-9-]+$/.test(code)) return { ok: false, error: "Team code can only have lowercase letters, numbers, and hyphens." };
    if (teamCodeTaken(code)) return { ok: false, error: `"${code}" is already taken — try a different code.` };
    if (!requestedBy.trim()) return { ok: false, error: "Enter your name." };
    if (!pinHash) return { ok: false, error: "Choose a 4-digit PIN." };

    const next = {
      ...teamsIndex,
      [code]: {
        teamCode: code, teamName: teamName.trim(), logo: logo || null,
        status: "pending", requestedBy: requestedBy.trim(), contactNumber: contactNumber.trim(),
        pendingAdminPinHash: pinHash, createdAt: new Date().toISOString(),
      },
    };
    const res = await persistUnscoped("teamsIndex", next);
    if (!res) return { ok: false, error: "Could not submit — try again." };
    setTeamsIndex(next);
    return { ok: true, code };
  }
  async function approveTeamRequest(code) {
    const rec = teamsIndex[code];
    if (!rec) return;
    const next = { ...teamsIndex, [code]: { ...rec, status: "approved", pendingAdminPinHash: undefined } };
    const res = await persistUnscoped("teamsIndex", next);
    if (res) {
      setTeamsIndex(next);
      // Activate the requester's chosen PIN as this team's admin PIN.
      const prevTeam = window.__activeTeam;
      window.__activeTeam = code;
      try {
        await window.storage.set("adminPin", JSON.stringify(rec.pendingAdminPinHash), true);
      } finally {
        window.__activeTeam = prevTeam;
      }
    }
  }
  async function rejectTeamRequest(code) {
    const rec = teamsIndex[code];
    if (!rec) return;
    const next = { ...teamsIndex, [code]: { ...rec, status: "rejected" } };
    const res = await persistUnscoped("teamsIndex", next);
    if (res) setTeamsIndex(next);
  }
  async function setupSuperAdminPin(hash) {
    const res = await persistUnscoped("superAdminPin", hash);
    if (res) setSuperAdminPin(hash);
    return !!res;
  }
  async function updateTeamLogo(dataUrl) {
    if (!activeTeam || !teamsIndex[activeTeam]) return false;
    const next = { ...teamsIndex, [activeTeam]: { ...teamsIndex[activeTeam], logo: dataUrl } };
    const res = await persistUnscoped("teamsIndex", next);
    if (res) setTeamsIndex(next);
    return !!res;
  }

  // ---- Super Admin: team lifecycle management ----
  async function resetTeamAdminPin(code) {
    const prevTeam = window.__activeTeam;
    window.__activeTeam = code;
    try {
      const res = await window.storage.set("adminPin", JSON.stringify(null), true);
      return !!res;
    } catch (e) {
      console.error("resetTeamAdminPin failed", e);
      return false;
    } finally {
      window.__activeTeam = prevTeam;
    }
  }
  // Team admins can no longer self-reset their own PIN (that used to be a
  // "type RESET to confirm" flow reachable by anyone who knew the team
  // code — not a real credential check). Instead this files a request a
  // Super Admin has to review and approve before anything actually resets.
  async function submitPinResetRequest({ teamCode, requestedBy, contactNumber }) {
    if (!teamsIndex[teamCode]) return { ok: false, error: "Team not found." };
    const id = `r_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
    const next = {
      ...pinResetRequests,
      [id]: {
        id, teamCode, requestedBy: requestedBy.trim(), contactNumber: contactNumber.trim(),
        submittedAt: new Date().toISOString(), status: "pending",
      },
    };
    const res = await persistUnscoped("pinResetRequests", next);
    if (!res) return { ok: false, error: "Could not submit — try again." };
    setPinResetRequests(next);
    return { ok: true };
  }
  async function approvePinResetRequest(id) {
    const req = pinResetRequests[id];
    if (!req) return false;
    const ok = await resetTeamAdminPin(req.teamCode);
    if (ok) {
      const next = { ...pinResetRequests };
      delete next[id];
      const res = await persistUnscoped("pinResetRequests", next);
      if (res) setPinResetRequests(next);
    }
    return ok;
  }
  async function rejectPinResetRequest(id) {
    const next = { ...pinResetRequests };
    delete next[id];
    const res = await persistUnscoped("pinResetRequests", next);
    if (res) setPinResetRequests(next);
  }
  async function suspendTeam(code) {
    const rec = teamsIndex[code];
    if (!rec) return;
    const next = { ...teamsIndex, [code]: { ...rec, status: "suspended" } };
    const res = await persistUnscoped("teamsIndex", next);
    if (res) setTeamsIndex(next);
  }
  async function reactivateTeam(code) {
    const rec = teamsIndex[code];
    if (!rec) return;
    const next = { ...teamsIndex, [code]: { ...rec, status: "approved" } };
    const res = await persistUnscoped("teamsIndex", next);
    if (res) setTeamsIndex(next);
  }
  // Marks the team deleted rather than removing its registry entry
  // outright. The underlying data isn't physically purged from Firestore
  // (deletes are deliberately blocked by the security rules as a safety
  // measure across this whole app) — it just becomes unreachable through
  // the app. Removing the key entirely used to free up the code for reuse,
  // which meant requesting a "new" team with that same code would silently
  // resurrect the deleted team's old players, PINs, and payment history
  // under what looked like a brand-new club. Keeping a tombstone entry
  // (teamCodeTaken/suggestTeamCode both just check "does teamsIndex have
  // this key", so this is enough to permanently retire the code) closes
  // that off.
  async function deleteTeamFromRegistry(code) {
    const rec = teamsIndex[code];
    if (!rec) return false;
    const next = { ...teamsIndex, [code]: { ...rec, status: "deleted", deletedAt: new Date().toISOString() } };
    const res = await persistUnscoped("teamsIndex", next);
    if (res) setTeamsIndex(next);
    return !!res;
  }
  async function renameTeam(code, newName) {
    const rec = teamsIndex[code];
    if (!rec || !newName.trim()) return false;
    const next = { ...teamsIndex, [code]: { ...rec, teamName: newName.trim() } };
    const res = await persistUnscoped("teamsIndex", next);
    if (res) setTeamsIndex(next);
    return !!res;
  }
  // Changes a team's code by copying every piece of its data to the new
  // code's prefix, then repointing the registry entry. The old prefix's
  // documents are left behind orphaned (same reasoning as delete above —
  // no destructive Firestore deletes anywhere in this app), so the old
  // code is tombstoned with a pointer to the new one rather than freed —
  // same reuse hazard as deleteTeamFromRegistry otherwise.
  async function changeTeamCode(oldCode, newCode) {
    const trimmed = newCode.trim().toLowerCase();
    if (!/^[a-z0-9-]+$/.test(trimmed)) return { ok: false, error: "Code can only have lowercase letters, numbers, and hyphens." };
    if (teamsIndex[trimmed]) return { ok: false, error: `"${trimmed}" is already taken.` };
    const rec = teamsIndex[oldCode];
    if (!rec) return { ok: false, error: "Team not found." };

    const prevTeam = window.__activeTeam;
    try {
      window.__activeTeam = oldCode;
      const listRes = await window.storage.list("");
      const keys = (listRes && listRes.keys) || [];
      const values = await Promise.all(keys.map((k) => window.storage.get(k)));

      window.__activeTeam = trimmed;
      await Promise.all(
        values.map((res, i) => (res ? window.storage.set(keys[i], res.value) : Promise.resolve()))
      );
    } catch (e) {
      console.error("changeTeamCode failed", e);
      return { ok: false, error: "Something went wrong copying the team's data — try again." };
    } finally {
      window.__activeTeam = prevTeam;
    }

    const next = { ...teamsIndex };
    next[oldCode] = { ...rec, status: "renamed", renamedTo: trimmed };
    next[trimmed] = { ...rec, teamCode: trimmed };
    const res = await persistUnscoped("teamsIndex", next);
    if (!res) return { ok: false, error: "Copied the data, but couldn't update the registry — try again." };
    setTeamsIndex(next);
    return { ok: true };
  }

  // A payment proof screenshot is stored the same way a player photo is —
  // its own small document, never embedded in the shared `matches`
  // document — because `matches` holds every match for the whole team
  // under Firestore's ~500KB per-document cap, and a screenshot per
  // player per match would risk blowing past that as a season's worth
  // accumulates. What DOES go into `matches` is a one-bit flag
  // (paymentProofFlags) so the admin sees "someone just uploaded" the
  // instant it happens, via the live subscription everything else in
  // Matches already has — the image itself follows a beat later. See the
  // "backfill missing proof images" effect below for that second half.
  async function uploadMatchProof(matchId, playerId, dataUrl) {
    try {
      const key = matchProofKey(matchId, playerId);
      const res = await window.storage.set(`photo_${key}`, dataUrl);
      if (!res) return false;
      setPhotos((prev) => ({ ...prev, [key]: dataUrl }));
      setMatches((prev) => {
        const m = prev[matchId];
        if (!m) return prev;
        return { ...prev, [matchId]: { ...m, paymentProofFlags: { ...(m.paymentProofFlags || {}), [playerId]: true } } };
      });
      return true;
    } catch (e) {
      console.error("Failed to upload payment proof", e);
      return false;
    }
  }
  // Lets a player pull their own proof back off a match — e.g. they
  // attached the wrong screenshot and would rather it just be gone than
  // replaced with another one. Deletes are blocked by the security rules
  // everywhere in this app, so this clears the document's content instead
  // of removing it outright, and drops the flag that makes it show up
  // anywhere. Doesn't touch match.payments either way — if the admin had
  // already marked this player paid, that stands on its own; removing the
  // evidence afterward doesn't retroactively undo their confirmation.
  async function removeMatchProof(matchId, playerId) {
    try {
      const key = matchProofKey(matchId, playerId);
      await window.storage.set(`photo_${key}`, "");
      setPhotos((prev) => { const next = { ...prev }; delete next[key]; return next; });
      setMatches((prev) => {
        const m = prev[matchId];
        if (!m) return prev;
        const flags = { ...(m.paymentProofFlags || {}) };
        delete flags[playerId];
        return { ...prev, [matchId]: { ...m, paymentProofFlags: flags } };
      });
      return true;
    } catch (e) {
      console.error("Failed to remove payment proof", e);
      return false;
    }
  }
  // Same hybrid pattern as payment proof above: the image goes in its own

      return false;

  function addMatch(fields) {
    const id = `m_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
    const newMatch = {
      id,
      matchType: fields.matchType || "",
      groundName: fields.groundName || "",
      date: fields.date || "",
      time: fields.time || "",
      overs: fields.overs || "",
      ballType: fields.ballType || "",
      jersey: fields.jersey || "",
      locationUrl: fields.locationUrl || "",
      upiNumber: fields.upiNumber || "",
      // Images (banner, per-match QR override) live in their own documents
      // now, not inline here — see uploadMatchBanner/uploadMatchQr below.
      // These flags are the tiny "does one exist" signal that stays in the
      // live-synced matches document instead.
      hasBanner: false,
      hasPaymentQr: false,

      const next = { ...prev };
      keys.forEach((k) => { delete next[k]; });
      return next;
    });
  }
  function toggleMarketplaceInterest(id, playerId) {
    let becameInterested = false;
    setMarketplace((prev) => {
      const listing = prev[id];
      if (!listing) return prev;
      const already = (listing.interested || []).includes(playerId);
      const nextInterested = already
        ? listing.interested.filter((pid) => pid !== playerId)
        : [...(listing.interested || []), playerId];
      becameInterested = !already;
      return { ...prev, [id]: { ...listing, interested: nextInterested } };
    });
    if (becameInterested && marketplace[id]) notifyMarketplaceInterest(marketplace[id], playerId);
  }

      `Collected: ${fmtINR(totals.collected)} / ${fmtINR(totals.expected)}`,

      closingBalance < 0

  }
  async function handleCopyDashboard() {

function BirthdayBanner({ players, teamName }) {
  const [copied, setCopied] = useState(false);
  const todays = (players || []).filter((p) => isBirthdayToday(p.dob));
  if (todays.length === 0) return null;

  async function handleCopy() {
    const ok = await copyText(buildBirthdayWishMessage(todays.map((p) => p.name), teamName));
    setCopied(ok);
    if (ok) setTimeout(() => setCopied(false), 2000);
  }

  const plural = todays.length > 1;
  return (
    <div style={{
      background: "linear-gradient(135deg, #C08A45, #9A6B3C)", borderRadius: 12, padding: 18,
      color: "#fff", textAlign: "center", marginBottom: 16,
    }}>
      <div style={{ fontSize: 28, marginBottom: 6 }}>🎂</div>
      <div className="scorenum" style={{ fontSize: 22, marginBottom: 4 }}>
        It's {joinNames(todays.map((p) => p.name))}'s birthday{plural ? "s" : ""}!
      </div>
      <div style={{ fontSize: 11.5, opacity: 0.9, marginBottom: 14 }}>Wish them well from the whole squad</div>
      <div style={{ display: "inline-flex", gap: 8 }}>
        <button onClick={handleCopy} style={{
          background: "rgba(255,255,255,0.22)", border: "none", borderRadius: 8, padding: "9px 16px",
          fontSize: 12.5, fontWeight: 600, color: "#fff", cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 6,
        }}>
          {copied ? <Icon size={13}>✅</Icon> : <Icon size={13}>📋</Icon>}
          {copied ? "Copied!" : "Copy"}

function LandingScreen({ onContinue, onRequestTeam, onSuperAdmin, teamsIndex, onBackToProfiles }) {
  const [code, setCode] = useState("");
  const [error, setError] = useState("");

  function handleContinue(pickedCode) {
    const trimmed = (pickedCode || code).trim().toLowerCase();
    if (!trimmed) { setError("Enter a team code."); return; }
    if (!teamsIndex[trimmed]) { setError("No team found with that code."); return; }
    onContinue(trimmed);
  }

  const query = code.trim().toLowerCase();
  const suggestions = query
    ? Object.values(teamsIndex || {})
        .filter((t) => t.status === "approved" && (t.teamCode.startsWith(query) || t.teamName.toLowerCase().includes(query)))
        .slice(0, 6)
    : [];

  return (
    <div style={{ minHeight: 480, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", background: COLORS.pitch, color: COLORS.cream, padding: 24, textAlign: "center" }}>
      <div style={{ fontSize: 11, letterSpacing: 3, textTransform: "uppercase", color: COLORS.willow, fontWeight: 600, marginBottom: 6 }}>Pavilion</div>
      <div className="scorenum" style={{ fontSize: 34, marginBottom: 26 }}>Welcome</div>

      {onBackToProfiles && (
        <button onClick={onBackToProfiles} style={{ background: "transparent", border: "none", color: COLORS.willow, fontSize: 12, fontWeight: 600, cursor: "pointer", marginBottom: 16 }}>
          ← Back to your profiles
        </button>
      )}

      <div className="w-320" style={{ background: COLORS.pitchLight, borderRadius: 12, padding: 18, width: "100%", marginBottom: 16, textAlign: "left" }}>
        <div style={{ fontSize: 12, color: "#CFE0D3", marginBottom: 12 }}>Joining a team? Ask your admin for your invite link or code.</div>
        <div style={{ fontSize: 11, color: "#9BAE9E", marginBottom: 6 }}>Team code</div>
        <input
          value={code}
          onChange={(e) => { setCode(e.target.value); setError(""); }}
          onKeyDown={(e) => e.key === "Enter" && handleContinue()}
          placeholder="e.g. thunder-cc"
          style={{ width: "100%", background: COLORS.pitch, border: `1px solid ${COLORS.pitchLight}`, borderRadius: 8, padding: "10px 12px", color: "#fff", fontSize: 13, outline: "none", boxSizing: "border-box", marginBottom: suggestions.length > 0 ? 8 : 10 }}
        />
        {suggestions.length > 0 && (
          <div style={{ background: COLORS.pitch, borderRadius: 8, overflow: "hidden", marginBottom: 10 }}>
            {suggestions.map((t, i) => (
              <button
                key={t.teamCode}
                onClick={() => { setCode(t.teamCode); handleContinue(t.teamCode); }}
                style={{
                  width: "100%", display: "flex", alignItems: "center", gap: 10, textAlign: "left",
                  background: "transparent", border: "none", cursor: "pointer", padding: "9px 12px",
                  borderBottom: i < suggestions.length - 1 ? `1px solid ${COLORS.pitchLight}` : "none",
                }}
              >
                {t.logo ? (
                  <img src={t.logo} alt="" style={{ width: 22, height: 22, borderRadius: 6, objectFit: "cover", flexShrink: 0 }} />
                ) : (
                  <div style={{ width: 22, height: 22, borderRadius: 6, background: avatarColor(t.teamName), flexShrink: 0 }} />
                )}
                <span style={{ fontSize: 13, color: "#fff" }}>{t.teamName}</span>
                <span style={{ fontSize: 11, color: "#9BAE9E", marginLeft: "auto" }}>{t.teamCode}</span>
              </button>
            ))}
          </div>
        )}
        {error && <div style={{ color: "#F0A6A4", fontSize: 12, marginBottom: 10 }}>{error}</div>}
        <button onClick={() => handleContinue()} style={{ width: "100%", background: COLORS.willow, color: "#fff", border: "none", borderRadius: 8, padding: "10px", fontSize: 14, fontWeight: 600, cursor: "pointer" }}>
          Continue to team →
        </button>
      </div>

      <button onClick={onSuperAdmin} style={{ background: "transparent", border: "none", color: "#7C8E80", fontSize: 12, cursor: "pointer", marginBottom: 14 }}>
        Super Admin? Sign in here
      </button>

      <a href="manual.html" target="_blank" rel="noreferrer" style={{ color: "#7C8E80", fontSize: 11, textDecoration: "underline", marginBottom: 22, display: "inline-block" }}>
